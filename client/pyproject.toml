[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shakerscan"
dynamic = ["version"]
description = "ShakerScan client: the MCP adapter and Hunt CLI for a ShakerScan instance, without the engine"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "ShakerScan" }]
keywords = ["shakerscan", "security", "dast", "pentest", "mcp", "hunt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
# python-fido2 (Yubico, BSD-2-Clause): a USB security key's touch for terminal approvals and the
# decisions an Enterprise gateway asks a touch for. Hash-locked in client/requirements/runtime.lock.
# One minor line: the client follows python-fido2's API, which has changed between minor releases.
# Only where its `cryptography` dependency ships wheels, so the client installs without a Rust
# toolchain everywhere it installed before: macOS and 64-bit Linux (x86-64, ARM64). Windows (no
# terminal touch yet), 32-bit and other Linux architectures and the BSDs install the client
# without it (`pipx inject shakerscan fido2` adds it where a wheel or a toolchain exists).
# cryptography 49 and later publish no Intel macOS wheel: an Intel Mac stays on 48.
dependencies = [
  'fido2>=2.2,<2.3; sys_platform == "darwin" or (sys_platform == "linux" and (platform_machine == "x86_64" or platform_machine == "aarch64"))',
  'cryptography<49; sys_platform == "darwin" and platform_machine == "x86_64"',
]

[project.optional-dependencies]
# `shakerscan record`: a recorded Chromium (then `python -m playwright install chromium`).
record = ["playwright>=1.44"]

[project.urls]
Homepage = "https://shakerscan.com"
Source = "https://github.com/andriyze/shakerscan"
Documentation = "https://github.com/andriyze/shakerscan/blob/main/docs/client.md"

[project.scripts]
shakerscan = "shakerscan.cli:main"

[tool.hatch.version]
path = "src/shakerscan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shakerscan"]

[tool.hatch.build.targets.sdist]
include = ["src/shakerscan", "README.md", "pyproject.toml", "hatch_build.py"]

# Vendors the runtime's MCP adapter and product CLI into the package at build time (hatch_build.py).
[tool.hatch.build.hooks.custom]
