name: Frozen-scope build stabilization validation
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths: ['.github/workflows/stabilize-build-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reconstruct the exact locally reviewed stabilization tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout --detach 84e1f87abbee94454c9534742154e2f5e89444e5
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          def replace(path, before, after):
              p = Path(path); text = p.read_text()
              assert text.count(before) == 1, (path, before)
              p.write_text(text.replace(before, after))
          for path, digest in {
              'scanner/apt_install.sh':'e61c77f762718f9779a6a5c2b4a21c7efda3c3a4',
              'tests/test_apt_install_retry.py':'d6a5750079989842030cea7166cc8bf53756f758',
              'docs/hunt-operator-workflows.md':'c5ef918d0f4c9411e144970b36b3ef65c8c38482',
          }.items():
              result = subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{digest}'])
              data = base64.b64decode(json.loads(result)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == digest
              Path(path).write_bytes(data)
          replace('scanner/Dockerfile', 'RUN apt-get update && apt-get install -y --no-install-recommends libpcap-dev && \\\n    rm -rf /var/lib/apt/lists/*', 'RUN --mount=type=bind,source=scanner/apt_install.sh,target=/tmp/apt_install.sh,ro \\\n    sh /tmp/apt_install.sh libpcap-dev')
          replace('scanner/Dockerfile', '# System deps for network tooling and additional scanners\nRUN apt-get update && apt-get install -y --no-install-recommends \\', '# System deps for network tooling and additional scanners. Retry with fresh signed\n# indexes when a mirror rotates between update and install; omit no packages.\nRUN --mount=type=bind,source=scanner/apt_install.sh,target=/tmp/apt_install.sh,ro \\\n    sh /tmp/apt_install.sh \\')
          replace('scanner/Dockerfile', '    bsdmainutils \\\n && rm -rf /var/lib/apt/lists/*', '    bsdmainutils')
          replace('scanner/Dockerfile', 'COPY scanner/Dockerfile /opt/build-inputs/scanner.Dockerfile', 'COPY scanner/Dockerfile /opt/build-inputs/scanner.Dockerfile\nCOPY scanner/apt_install.sh /opt/build-inputs/apt_install.sh')
          line = 'COPY --from=scanner-runtime /opt/build-inputs/scanner.Dockerfile /opt/build-inputs/scanner.Dockerfile'
          replace('scanner/Dockerfile.api', line, line+'\nCOPY --from=scanner-runtime /opt/build-inputs/apt_install.sh /opt/build-inputs/apt_install.sh')
          path = 'scanner/scanner_tools/build_fingerprint.py'
          line = '        ("runtime/scanner.Dockerfile", scanner_root / "Dockerfile"),'
          replace(path, line, line+'\n        ("runtime/apt_install.sh", scanner_root / "apt_install.sh"),')
          line = '            ("runtime/scanner.Dockerfile", Path(build_input_root) / "scanner.Dockerfile"),'
          replace(path, line, line+'\n            ("runtime/apt_install.sh", Path(build_input_root) / "apt_install.sh"),')
          path = 'tests/test_build_fingerprint_manifest.py'
          replace(path, '        "runtime/scanner.Dockerfile",', '        "runtime/scanner.Dockerfile",\n        "runtime/apt_install.sh",')
          with open(path, 'a') as out:
              out.write('''

          def test_apt_build_helper_has_matching_source_and_runtime_identity(tmp_path):
              from scanner.scanner_tools.build_fingerprint import runtime_file_map

              workspace = tmp_path / "workspace"
              runtime = tmp_path / "app"
              inputs = tmp_path / "build-inputs"
              for folder in (workspace / "scanner", workspace / "api", runtime, inputs):
                  folder.mkdir(parents=True)
              for source, destination in (("scanner/scanner.py", "scanner.py"), ("api/worker.py", "worker.py")):
                  (workspace / source).write_text("# identical execution anchor\\n")
                  (runtime / destination).write_text("# identical execution anchor\\n")
              (workspace / "scanner/apt_install.sh").write_text("# first build helper\\n")
              (inputs / "apt_install.sh").write_text("# first build helper\\n")
              source = source_file_map(str(workspace))
              image = runtime_file_map(str(runtime), str(tmp_path / "absent-locks"), str(inputs))
              assert "runtime/apt_install.sh" in source.keys() & image.keys()
              before = hash_source_files(source, require_all=True)
              assert before == hash_source_files(image, require_all=True)
              (workspace / "scanner/apt_install.sh").write_text("# corrected build helper\\n")
              assert hash_source_files(source, require_all=True) != before
          ''')
          replace('.github/workflows/e2e-pr.yml', '        run: |\n          python3 scripts/summarize_e2e_debt.py artifacts/e2e-scorecard.json', '        run: |\n          mkdir -p artifacts\n          python3 scripts/summarize_e2e_debt.py artifacts/e2e-scorecard.json')
          subprocess.run(['python','scripts/generate_install_manifest.py'], check=True)
          subprocess.run(['git','add','-A'], check=True)
          tree = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert tree == '0fea29813e81246c83ada83ad1c619346ea90eaf', tree
          PY
      - name: Install locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Run affected integration and build regression tests
        run: |
          mkdir -p artifacts
          PYTHONPATH="$PWD:$PWD/api:$PWD/scanner" python -m pytest -q \
            tests/test_apt_install_retry.py tests/test_build_fingerprint_manifest.py \
            tests/test_install_manifest.py tests/test_ci_builds_before_composing.py \
            tests/test_release_image_contract.py tests/test_hunt_budget_amendments.py \
            tests/test_hunt_skill_execution.py tests/test_hunt_bound_skill_gaps.py \
            --junitxml=artifacts/stabilization.xml
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_hunt_methodologies.py
          python scripts/check_installed_import_closure.py
          python scripts/check_documentation_policy.py
          python scripts/check_module_size.py
          python scripts/check_scan_target_transport.py
          git diff --cached --check
      - name: Export validated Git blobs without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          rows = []
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          for path in paths:
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              response = subprocess.check_output(['gh','api','--method','POST',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs','--input','-'], input=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode())
              actual = json.loads(response)['sha']
              assert expected == actual, path
              rows.append({'path':path,'mode':'100644','type':'blob','sha':actual})
          Path('artifacts/stabilization-tree.json').write_text(json.dumps({'tree':'0fea29813e81246c83ada83ad1c619346ea90eaf','entries':rows}, indent=2)+'\n')
          print(json.dumps(rows))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: frozen-stabilization-validation
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
