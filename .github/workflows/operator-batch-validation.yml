name: Operator batch exact-tree validation

# Temporary validation/assembly only. The final product commit removes this workflow
# and the readable patch inputs. No ref update, merge, release or deployment is performed.
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths:
      - '.github/operator-batch/**'
      - '.github/workflows/operator-batch-validation.yml'
permissions:
  contents: write
concurrency:
  group: operator-batch-exact-tree
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'andriyze/shakerscan' && github.ref == 'refs/heads/feat/hunt-operator-workflows'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the reviewed product tree from explicit patches
        shell: bash
        run: |
          mkdir -p /tmp/operator-validation
          cp -R .github/operator-batch /tmp/operator-validation/inputs
          git checkout --detach 2e67d1926d2b35767990c5db8d056738767034da
          python - <<'PY'
          from pathlib import Path
          import subprocess
          patches = sorted(Path('/tmp/operator-validation/inputs').glob('*.patch'))
          assert len(patches) == 5
          # Normalize only accidentally indented diff headers from text transport;
          # the exact final tree comparison below admits no product-content change.
          text = ''.join(p.read_text().replace('\n diff --git ', '\ndiff --git ') for p in patches)
          path = Path('/tmp/operator-validation/reviewed.patch')
          path.write_text(text)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != 'bbc97da32d9649c0fc5f84f89e43d49a291c34c7':
              raise SystemExit('Product tree differs from locally tested tree: ' + tree)
          print('Exact product tree:', tree)
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked dependencies and native test tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
          python -m playwright install --with-deps chromium
      - name: Verify generated artifacts and structural contracts
        run: |
          python scripts/generate_install_manifest.py --check
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_documentation_policy.py
          python scripts/check_module_size.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
          git diff --cached --check
      - name: Native NSE acceptance without optional skips
        env:
          PYTHONPATH: .:api:scanner
          SHAKERSCAN_REQUIRE_NATIVE_NSE: '1'
        run: |
          command -v nmap
          python -m pytest -q tests/integration/test_hunt_nse_native.py tests/test_hunt_nse_http.py tests/test_hunt_nse_capability.py --junitxml=/tmp/operator-validation/native-nse.xml
      - name: Complete partitioned Python suite
        run: python scripts/run_complete_python_suite.py --artifacts-dir /tmp/operator-validation
      - name: Export SHA-verified blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/operator-validation/inputs/export_blobs.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: operator-batch-validation
          path: |
            /tmp/operator-validation/*.json
            /tmp/operator-validation/*.xml
          retention-days: 7
          if-no-files-found: warn
