name: 2.3.1 maintenance validation

on:
  push:
    branches: ['2.3.1']
    paths:
      - .github/workflows/maintenance-2.3.1.yml
      - scripts/_maintenance_2_3_1.py

permissions:
  contents: write

concurrency:
  group: maintenance-2.3.1
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.ref == 'refs/heads/2.3.1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Export tracked source only for isolated review
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/maintenance-source.tar.gz" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-source-${{ github.sha }}
          path: ${{ runner.temp }}/maintenance-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Apply and validate reviewed maintenance patch
        run: |
          if [ -f scripts/_maintenance_2_3_1.py ]; then
            python3 scripts/_maintenance_2_3_1.py
          fi
      - name: Commit validated changes to the maintenance branch
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            exit 0
          fi
          git config user.name 'ShakerScan maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(lifecycle): implement reviewed 2.3.1 repository cleanup and deletion'
          git push origin HEAD:refs/heads/2.3.1
