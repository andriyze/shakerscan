name: Auth assurance merge main once

on:
  push:
    branches: ["auth-assurance/pr"]

permissions:
  contents: write

jobs:
  merge-main:
    if: ${{ !contains(github.event.head_commit.message, '[merge-main-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: auth-assurance/pr
          fetch-depth: 0
      - name: Merge current main and resolve known generated/index conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(docs/README\.md|install/MANIFEST\.sha256)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if [ "$merge_rc" -ne 0 ] && [ -z "$conflicts" ]; then
            echo "git merge failed without a resolvable content conflict" >&2
            exit "$merge_rc"
          fi

          if printf '%s\n' "$conflicts" | grep -qx 'docs/README.md'; then
            git checkout --ours docs/README.md
            python - <<'PY'
          from pathlib import Path

          path = Path("docs/README.md")
          text = path.read_text(encoding="utf-8")
          line = "| [`ai-boundary-alpha.md`](ai-boundary-alpha.md) | Configured AI application security verification: controls, deterministic proof, and alpha boundaries |\n"
          if "ai-boundary-alpha.md" not in text:
              auth = "| [`authenticated-assurance.md`](authenticated-assurance.md) | Authenticated-scan profile and assurance preview: reuse decisions, trust boundaries, and remaining release gates |\n"
              decisions = "| [`decisions/README.md`](decisions/README.md) | Normative architecture-decision index |\n"
              if auth in text:
                  text = text.replace(auth, line + auth, 1)
              elif decisions in text:
                  text = text.replace(decisions, line + decisions, 1)
              else:
                  raise SystemExit("documentation index insertion marker missing")
          path.write_text(text, encoding="utf-8")
          PY
            git add docs/README.md
          fi

          if printf '%s\n' "$conflicts" | grep -qx 'install/MANIFEST.sha256'; then
            git checkout --ours install/MANIFEST.sha256
            git add install/MANIFEST.sha256
          fi

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts remain:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi

          python scripts/generate_install_manifest.py
          git add install/MANIFEST.sha256

          git rm .github/workflows/auth-assurance-merge-main-once.yml
          git diff --cached --check
          git commit -m "merge(main): integrate AI boundary verification into authenticated assurance [merge-main-once]"
          git push origin HEAD:auth-assurance/pr
