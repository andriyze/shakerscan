name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without v prefix"
        required: true
      candidate_sha:
        description: "Exact candidate commit built by Release candidate"
        required: true
      candidate_run_id:
        description: "Successful Release candidate workflow run ID"
        required: true
      acceptance_receipt_url:
        description: "Durable URL for the content-free two-node physical acceptance receipt"
        required: true
      acceptance_receipt_sha256:
        description: "SHA-256 of the physical acceptance receipt"
        required: true
      acceptance_node_count:
        description: "Distinct accepted fleet nodes (minimum 2)"
        required: true

concurrency:
  group: shakerscan-release-promotion
  cancel-in-progress: false

permissions:
  contents: write

env:
  SCANNER_IMAGE: shakerscan/shakerscan-scanner
  API_IMAGE: shakerscan/shakerscan-api
  UI_IMAGE: shakerscan/shakerscan-ui
  SIGNER_IMAGE: shakerscan/shakerscan-model-intake-signer

jobs:
  promote:
    name: Promote accepted candidate by digest
    runs-on: ubuntu-latest
    environment: release-promotion
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Validate candidate and physical acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ACCEPTANCE_URL: ${{ inputs.acceptance_receipt_url }}
          ACCEPTANCE_SHA256: ${{ inputs.acceptance_receipt_sha256 }}
          ACCEPTANCE_NODE_COUNT: ${{ inputs.acceptance_node_count }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTANCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_URL" =~ ^https:// ]]
          [[ "$ACCEPTANCE_NODE_COUNT" =~ ^[0-9]+$ && "$ACCEPTANCE_NODE_COUNT" -ge 2 ]]
          [[ "$(tr -d '[:space:]' < VERSION)" == "$VERSION" ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          python3 - "$VERSION" <<'PY'
          import re
          import subprocess
          import sys
          candidate = tuple(map(int, sys.argv[1].split("."))) if re.fullmatch(r"\d+\.\d+\.\d+", sys.argv[1]) else None
          published = [
              tuple(map(int, match.groups()))
              for tag in subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
              if (match := re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag))
          ]
          if candidate and published and max(published) > candidate:
              raise SystemExit("refusing to publish a stable version older than an existing release")
          PY
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 "$ACCEPTANCE_URL" \
            --output physical-acceptance-receipt.json
          echo "${ACCEPTANCE_SHA256}  physical-acceptance-receipt.json" | sha256sum --check --strict
          python3 - "$ACCEPTANCE_NODE_COUNT" <<'PY'
          import hashlib
          import json
          import sys
          path = "physical-acceptance-receipt.json"
          receipt = json.load(open(path, encoding="utf-8"))
          embedded = receipt.pop("receipt_sha256", "")
          canonical = json.dumps(receipt, sort_keys=True, separators=(",", ":"), default=str).encode()
          required_checks = {
              "physical_worker_loss_recovered",
              "public_data_stores_closed",
              "uniform_worker_build_mode",
          }
          passed_checks = {item.get("name") for item in receipt.get("checks", []) if item.get("pass") is True}
          nodes = {node for node in receipt.get("selected_node_ids", []) if node}
          assert receipt.get("schema_version") == "shakerscan_fleet_acceptance_v1"
          assert receipt.get("passed") is True and receipt.get("preflight_only") is False
          assert required_checks <= passed_checks
          assert len(nodes) >= 2 and len(nodes) == int(sys.argv[1])
          assert embedded == hashlib.sha256(canonical).hexdigest()
          PY
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          [[ "$(gh run view "$CANDIDATE_RUN_ID" --json conclusion,headSha --jq '.conclusion + " " + .headSha')" == "success $CANDIDATE_SHA" ]]
          gh run download "$CANDIDATE_RUN_ID" \
            --pattern "release-candidate-${VERSION}-${CANDIDATE_SHA}" \
            --dir candidate-receipt
          receipt="$(find candidate-receipt -name release-candidate-receipt.json -type f -print -quit)"
          [[ -n "$receipt" ]]
          jq -e --arg version "$VERSION" --arg sha "$CANDIDATE_SHA" \
            '.schema_version == "shakerscan-release-candidate/v1" and .version == $version and .candidate_sha == $sha and (.candidate_tag | test("^candidate-[0-9a-f]{40}-[0-9]+$")) and ([.images[] | test("^sha256:[0-9a-f]{64}$")] | all)' \
            "$receipt"
          cp "$receipt" release-candidate-receipt.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify registry digests and publish immutable version tags
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          promote() {
            image="$1"
            key="$2"
            expected="$(jq -r ".images.${key}" release-candidate-receipt.json)"
            candidate_tag="$(jq -r '.candidate_tag' release-candidate-receipt.json)"
            actual="$(docker buildx imagetools inspect "${image}:${candidate_tag}" | awk '$1 == "Digest:" && !found {print $2; found=1}')"
            [[ "$actual" == "$expected" ]]
            if existing="$(docker buildx imagetools inspect "${image}:${VERSION}" 2>/dev/null | awk '$1 == "Digest:" && !found {print $2; found=1}')" && [[ -n "$existing" ]]; then
              [[ "$existing" == "$expected" ]]
            else
              docker buildx imagetools create -t "${image}:${VERSION}" "${image}@${expected}"
            fi
            published="$(docker buildx imagetools inspect "${image}:${VERSION}" | awk '$1 == "Digest:" && !found {print $2; found=1}')"
            [[ "$published" == "$expected" ]]
          }
          promote "$SCANNER_IMAGE" scanner
          promote "$API_IMAGE" api
          promote "$UI_IMAGE" ui
          promote "$SIGNER_IMAGE" signer

      - name: Create provenance-rich GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ACCEPTANCE_URL: ${{ inputs.acceptance_receipt_url }}
          ACCEPTANCE_SHA256: ${{ inputs.acceptance_receipt_sha256 }}
        shell: bash
        run: |
          cp "docs/releases/${VERSION}.md" release-notes.md
          cat >> release-notes.md <<EOF

          ## Build and acceptance provenance

          - Candidate commit: \`${CANDIDATE_SHA}\`
          - Candidate workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}
          - Physical acceptance receipt: ${ACCEPTANCE_URL}
          - Acceptance receipt SHA-256: \`${ACCEPTANCE_SHA256}\`
          - Stable installer and \`latest\` are promoted separately after public smoke.
          EOF
          gh release create "v${VERSION}" --target "$CANDIDATE_SHA" \
            --title "ShakerScan v${VERSION}" --notes-file release-notes.md
