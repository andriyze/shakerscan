name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without v prefix"
        required: true
      push_latest:
        description: "Also tag Docker images as latest"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  SCANNER_IMAGE: shakerscan/shakerscan-scanner
  UI_IMAGE: shakerscan/shakerscan-ui
  SOURCE_URL: https://github.com/andriyze/shakerscan

jobs:
  # Resolve and validate the release version once, shared by all downstream jobs.
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
      created: ${{ steps.meta.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            push_latest="${{ inputs.push_latest }}"
          else
            version="${GITHUB_REF_NAME#v}"
            push_latest="true"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$file_version" ]]; then
            echo "Release version mismatch: ref/input resolved to $version but VERSION contains $file_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push_latest=$push_latest" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  # Build each architecture on a NATIVE runner (no QEMU emulation — that is what
  # blew past the 6h job limit, and katana's CGO dep cannot cross-compile). Each
  # job pushes by digest; the manifest lists are assembled in the merge job.
  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare platform pair
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push scanner by digest
        id: scanner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scanner/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=Shaker Scan Scanner
            org.opencontainers.image.description=Open-source DAST scanner API, worker, and security tooling image
            org.opencontainers.image.created=${{ needs.meta.outputs.created }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-scanner
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Shaker Scan
          outputs: type=image,name=${{ env.SCANNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push UI by digest
        id: ui
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          file: ui/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=Shaker Scan UI
            org.opencontainers.image.description=Open-source Shaker Scan web dashboard
            org.opencontainers.image.created=${{ needs.meta.outputs.created }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-ui
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Shaker Scan
          outputs: type=image,name=${{ env.UI_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        shell: bash
        run: |
          mkdir -p /tmp/digests/scanner /tmp/digests/ui
          scanner_digest="${{ steps.scanner.outputs.digest }}"
          ui_digest="${{ steps.ui.outputs.digest }}"
          touch "/tmp/digests/scanner/${scanner_digest#sha256:}"
          touch "/tmp/digests/ui/${ui_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into one multi-arch manifest list per image.
  merge:
    name: Create multi-arch manifests
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.meta.outputs.version }}
      scanner_image: ${{ env.SCANNER_IMAGE }}:${{ needs.meta.outputs.version }}
      ui_image: ${{ env.UI_IMAGE }}:${{ needs.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create scanner manifest list
        working-directory: /tmp/digests/scanner
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PUSH_LATEST: ${{ needs.meta.outputs.push_latest }}
        shell: bash
        run: |
          tags="-t ${SCANNER_IMAGE}:${VERSION}"
          if [[ "$PUSH_LATEST" == "true" ]]; then
            tags="$tags -t ${SCANNER_IMAGE}:latest"
          fi
          docker buildx imagetools create $tags \
            $(printf "${SCANNER_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${SCANNER_IMAGE}:${VERSION}"

      - name: Create UI manifest list
        working-directory: /tmp/digests/ui
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PUSH_LATEST: ${{ needs.meta.outputs.push_latest }}
        shell: bash
        run: |
          tags="-t ${UI_IMAGE}:${VERSION}"
          if [[ "$PUSH_LATEST" == "true" ]]; then
            tags="$tags -t ${UI_IMAGE}:latest"
          fi
          docker buildx imagetools create $tags \
            $(printf "${UI_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${UI_IMAGE}:${VERSION}"

  github-release:
    name: Create GitHub Release
    needs: [meta, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Docker images:
          - \`${{ needs.merge.outputs.scanner_image }}\`
          - \`${{ needs.merge.outputs.ui_image }}\`

          Multi-architecture platforms:
          - \`linux/amd64\`
          - \`linux/arm64\`

          Run prebuilt images:

          \`\`\`bash
          ./scanner.sh start --prebuilt --image-tag ${{ needs.merge.outputs.version }}
          \`\`\`
          EOF

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.merge.outputs.version }}
        shell: bash
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file release-notes.md
          else
            gh release create "v${VERSION}" --title "Shaker Scan v${VERSION}" --notes-file release-notes.md
          fi
