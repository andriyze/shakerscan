name: Methodology batch exact-tree validation
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths:
      - 'scripts/methodology-batch/**'
      - '.github/workflows/methodology-batch-validation.yml'
permissions:
  contents: read
concurrency:
  group: methodology-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the explicit assembly inputs and select their pinned parent
        run: |
          cp -R scripts/methodology-batch /tmp/methodology-batch
          git checkout --detach c4c8592087993bf7050030ece687aea54971e635
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install the locked Python and native test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
      - name: Reconstruct and verify the exact product tree
        run: |
          python /tmp/methodology-batch/assemble.py
          test "$(git write-tree)" = 392cbff0bb80ab57a413ee4671c270a84eb063ee
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Local exact-tree validation snapshot; no ref publication'
      - name: Validate methodology integration and generated contracts
        run: |
          python scripts/check_hunt_methodologies.py
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_documentation_policy.py
          python scripts/check_module_size.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
          git diff --check c4c8592087993bf7050030ece687aea54971e635 HEAD
      - name: Native NSE acceptance without optional skips
        env:
          PYTHONPATH: .:api:scanner
          SHAKERSCAN_REQUIRE_NATIVE_NSE: '1'
        run: |
          mkdir -p /tmp/methodology-results
          python -m pytest -q tests/integration/test_hunt_nse_native.py tests/test_hunt_nse_http.py tests/test_hunt_nse_capability.py --junitxml=/tmp/methodology-results/native-nse.xml
      - name: Run the complete partitioned Python suite
        run: python scripts/run_complete_python_suite.py --artifacts-dir /tmp/methodology-results
      - name: Export verified Git blobs only after successful tests
        env:
          EXPORT_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          import xml.etree.ElementTree as ET
          out = pathlib.Path('/tmp/methodology-results')
          expected = '392cbff0bb80ab57a413ee4671c270a84eb063ee'
          parent = 'c4c8592087993bf7050030ece687aea54971e635'
          def git(*args):
              return subprocess.check_output(['git', *args])
          assert git('write-tree').decode().strip() == expected
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          summary = {}
          for name in ('native-nse.xml', 'v2-full-python.xml'):
              cases = list(ET.parse(out / name).getroot().iter('testcase'))
              assert cases, name
              assert not any(c.find('failure') is not None or c.find('error') is not None for c in cases), name
              skipped = sum(c.find('skipped') is not None for c in cases)
              if name == 'native-nse.xml':
                  assert skipped == 0, 'native tests must execute'
              summary[name] = {'passed': len(cases) - skipped, 'skipped': skipped, 'failures': 0, 'errors': 0}
          entries = []
          for raw in git('diff', '--name-only', '-z', parent, 'HEAD').split(b'\0'):
              if not raw:
                  continue
              path = raw.decode()
              listing = git('ls-tree', 'HEAD', '--', path).decode().strip()
              if not listing:
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              fields = listing.split('\t', 1)[0].split()
              mode, kind, sha = fields
              assert kind == 'blob' and mode in ('100644', '100755'), path
              data = pathlib.Path(path).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, path
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['EXPORT_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == sha, (path, result)
              entries.append({'path': path, 'mode': mode, 'type': kind, 'sha': sha})
          record = {'parent': parent, 'product_tree': expected, 'tests': summary, 'tree_elements': entries}
          (out / 'verified-tree.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps({'product_tree': expected, 'files': len(entries), 'tests': summary}, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: methodology-batch-validation
          path: /tmp/methodology-results
          if-no-files-found: warn
          retention-days: 7
