name: Audit workspace export
on:
  push:
    branches: [fix/post-2.0-audit-release]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f03d30979ca624d839293944d8609a06b3df0b48
          persist-credentials: false
      - name: Archive the exact audited source (no credentials or generated files)
        run: git archive --format=tar.gz HEAD > /tmp/audit-source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-source-f03d309
          path: /tmp/audit-source.tar.gz
          retention-days: 1
          if-no-files-found: error
