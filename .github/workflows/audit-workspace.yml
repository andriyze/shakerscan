name: Apply tested audit corrections
on:
  push:
    branches: [fix/post-2.0-audit-release]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply exact hash-verified source edits
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/post-2.0-audit-release
          git merge-base --is-ancestor f03d30979ca624d839293944d8609a06b3df0b48 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          root = Path.cwd().resolve()
          encoded = ''.join((root / f'.github/audit-edits.{n}.b64').read_text().strip() for n in range(4))
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '30e7d541b1d69f10550602baae200f4cf020069da6c1b09a8cb7135a30a3c1e9'
          updates = json.loads(data)
          assert len(updates) == 19
          for update in updates:
              name = update['path']
              assert name.startswith(('api/', 'tests/', 'docs/')) or name == 'install/MANIFEST.sha256'
              path = root / name
              path.resolve().relative_to(root)
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == update['before'], name
              lines = (before or b'').decode().splitlines(keepends=True)
              for start, end, replacement in reversed(update['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == update['after'], name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
          PY
          git diff --check
          python3 scripts/generate_install_manifest.py --check
          python3 scripts/check_module_size.py
          python3 -m compileall -q api tests
      - name: Commit corrections only to the audit branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api tests docs install/MANIFEST.sha256
          git commit -m 'fix(scan): close post-2.0 audit coverage and scoring gaps'
          git push origin HEAD:refs/heads/fix/post-2.0-audit-release
          echo "Corrected branch commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
