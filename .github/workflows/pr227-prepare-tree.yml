name: PR227 candidate review tree preparation
on:
  push:
    branches: ['chore/pr227-candidate-review-preparation']
    paths: ['.github/pr227/**', '.github/workflows/pr227-prepare-tree.yml']
concurrency:
  group: pr227-candidate-review-preparation
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'andriyze/shakerscan'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/scanner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Apply exact reviewed plaintext patch
        run: python .github/pr227/prepare-tree.py apply
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install the repository locked dependency set
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Refresh deliberately changed API snapshots
        run: |
          SHAKERSCAN_UPDATE_API_CONTRACT=1 python -m pytest -q tests/test_api_characterization.py
          python scripts/generate_public_api_contract.py
          python scripts/generate_capability_inventory.py
          python scripts/generate_install_manifest.py
      - name: Test candidate review and adjacent API contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.run_complete_python_suite import partition_test_files, _run_group, merge_junit_reports
          root = Path.cwd()
          selected = {
              root / "tests/test_ai_boundary_candidate_lookup.py",
              root / "tests/test_ai_boundary_hypothesis.py",
              root / "tests/test_ai_boundary_hypothesis_route.py",
              root / "tests/test_ai_boundary_admission.py",
              root / "tests/test_investigation_candidates.py",
              root / "tests/test_hunt_action_dispatcher.py",
              root / "tests/test_runtime_capabilities.py",
              root / "tests/test_command_arsenal.py",
              root / "tests/test_hunt_skills.py",
              root / "tests/test_hunt_methodology_integration.py",
              root / "tests/test_functionality_inventory.py",
              root / "tests/test_install_manifest.py",
              root / "tests/test_public_api_contract_generation.py",
              root / "tests/test_api_characterization.py",
              root / "tests/test_api_helpers.py",
          }
          package, compatibility = partition_test_files(root)
          assert selected <= set(package) | set(compatibility)
          reports, results = [], []
          for name, group, native in (("package", package, True), ("compatibility", compatibility, False)):
              report = root / f"artifacts/candidate-review-{name}.xml"
              reports.append(report)
              results.append(_run_group(root, name=name, paths=tuple(p for p in group if p in selected),
                  package_native=native, collect_only=False, coverage=False,
                  coverage_file=root / "artifacts/.coverage", junit_path=report))
          merge_junit_reports(tuple(reports), root / "artifacts/candidate-review-tests.xml")
          raise SystemExit(1 if any(results) else 0)
          PY
      - name: Check generated contracts and documentation
        run: |
          python scripts/generate_public_api_contract.py --check
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_surface_dispositions.py
      - name: Stage immutable Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/pr227/prepare-tree.py stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr227-candidate-review-tree
          path: artifacts/
          retention-days: 3
          if-no-files-found: error
