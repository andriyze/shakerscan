name: E2E smoke

# Pre-merge integration coverage, run ONCE per change: the fast deterministic E2E areas
# (platform, AI Gate on the fixture endpoint, keyless Hunt) and the production-stack browser
# acceptance, so a broken page or contract fails on the pull request instead of an hour into
# a candidate build. The complete E2E (DAST against Juice Shop, Model Intake), the recall
# benchmark, and the fault receipts run once, on the final images, in release-candidate
# certification. It is a required check and always reports.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: ci-postgres-credential-0000000000000001
      REDIS_PASSWORD: ci-redis-credential-000000000000000001
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Detect relevant backend and UI changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- api scanner db tests/e2e docker-compose.yml Makefile scanner.sh \
               scripts/generate_public_api_contract.py \
               docs/generated/public-openapi-manifest.json \
               ui/src/lib/publicApi.generated.ts \
               tests/test_public_api_contract_generation.py \
               .github/workflows/e2e-pr.yml .github/workflows/e2e.yml; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- ui api/api.py api/scan/contracts.py \
               api/public_api_contract.py \
               scripts/generate_scan_contract.py scripts/generate_hunt_contract.py \
               scripts/generate_public_api_contract.py \
               docs/generated/public-openapi-manifest.json \
               .github/workflows/e2e-pr.yml .github/workflows/v2-contracts.yml; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
          else
            echo "ui=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$(cat "$GITHUB_OUTPUT" | grep -c '=true')" -gt 0 ]]; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip smoke tests for unrelated changes
        if: steps.changes.outputs.stack != 'true'
        run: echo "No E2E-relevant backend or UI changes; smoke test is not required."

      - name: Start ShakerScan stack
        if: steps.changes.outputs.stack == 'true'
        run: |
          # The API image builds FROM shakerscan-worker:local, which compose will not
          # build for it -- see tests/test_ci_builds_before_composing.py.
          ./scanner.sh build
          docker compose up -d
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
          curl -sf http://localhost:8080/health

      - name: Run the fast deterministic E2E areas
        if: steps.changes.outputs.backend == 'true'
        env:
          # The PR gate mirrors the candidate certification, which is an authorized declared-debt
          # release: checks the release owner has recorded as debt run as loud, counted XFAIL rows
          # (an XPASS is printed when one unexpectedly passes). Every undeclared check stays hard.
          SHAKERSCAN_RELEASE_DECLARED_DEBT: "1"
        run: |
          mkdir -p artifacts
          python3 tests/e2e/run_e2e.py --area platform --scorecard artifacts/e2e-scorecard.json
          python3 tests/e2e/run_e2e.py --area ai_gate
          python3 tests/e2e/run_e2e.py --area hunt
          python3 - <<'PY'
          import json
          card = json.load(open("artifacts/e2e-scorecard.json"))
          debt = [
              (area.get("area"), row.get("name"), row.get("reason"))
              for area in card.get("areas", []) for row in area.get("rows", [])
              if row.get("xfail")
          ]
          for area, name, reason in debt:
              print(f"::warning title=declared E2E debt::{area}: {name} -- {reason}")
          print(f"declared-debt rows: {len(debt)}; gate: {card.get('gate')}")
          PY

      - name: Set up supported Node runtime
        if: steps.changes.outputs.stack == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run UI contracts, production build, and real-stack browser acceptance
        if: steps.changes.outputs.stack == 'true'
        env:
          PLAYWRIGHT_REAL_STACK: "1"
          SHAKERSCAN_API_URL: http://localhost:8080
        run: |
          npm --prefix ui ci
          npm --prefix ui run test:unit
          npm --prefix ui run build
          npx --prefix ui playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm --prefix ui run test:browser

      - name: Upload E2E scorecard and browser results
        if: always() && steps.changes.outputs.stack == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-smoke-${{ github.event.pull_request.head.sha }}
          path: |
            artifacts/e2e-scorecard.json
            ui/test-results/browser-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump stack logs on failure
        if: failure() && steps.changes.outputs.stack == 'true'
        run: docker compose logs --tail=300 api worker ui || true

      - name: Stop E2E stack
        if: always() && steps.changes.outputs.stack == 'true'
        run: docker compose down -v
