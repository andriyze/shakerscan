name: E2E smoke

# Deterministic integration coverage for backend changes. Active DAST tests are
# kept in the manually triggered full release gate (e2e.yml).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-postgres-credential-0000000000000001
      REDIS_PASSWORD: ci-redis-credential-000000000000000001
      MODEL_INTAKE_SIGNER_DATABASE_PASSWORD: ci-model-intake-signer-db-password-00000001
      MODEL_INTAKE_SIGNER_INTERNAL_TOKEN: ci-model-intake-signer-token-000000000000001
      MODEL_INTAKE_OPERATOR_TOKEN: ci-model-intake-operator-token-00000000000001
      SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_TOKEN: ci-model-intake-operator-token-00000000000001
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect relevant backend and UI changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- api scanner db tests/e2e docker-compose.yml Makefile \
               scripts/generate_public_api_contract.py \
               docs/generated/public-openapi-manifest.json \
               ui/src/lib/publicApi.generated.ts \
               tests/test_public_api_contract_generation.py \
               .github/workflows/e2e-pr.yml .github/workflows/e2e.yml; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- ui api/api.py api/scan/contracts.py \
               api/public_api_contract.py \
               scripts/generate_scan_contract.py scripts/generate_hunt_contract.py \
               scripts/generate_public_api_contract.py \
               docs/generated/public-openapi-manifest.json \
               .github/workflows/e2e-pr.yml .github/workflows/v2-contracts.yml; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
          else
            echo "ui=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip smoke tests for unrelated changes
        if: steps.changes.outputs.backend != 'true' && steps.changes.outputs.ui != 'true'
        run: echo "No E2E-relevant backend or UI changes; smoke test is not required."

      - name: Start ShakerScan stack
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.ui == 'true'
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
          curl -sf http://localhost:8080/health

      - name: Run deterministic platform, Model Intake, and AI Gate smoke tests
        if: steps.changes.outputs.backend == 'true'
        run: |
          python3 tests/e2e/run_e2e.py --area platform
          python3 tests/e2e/run_e2e.py --area model_intake
          python3 tests/e2e/run_e2e.py --area ai_gate
          python3 tests/e2e/run_e2e.py --area hunt

      - name: Run Model Intake cryptographic trust contracts
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker compose cp tests api:/tmp/model-intake-tests
          docker compose exec -T api sh -lc '
            cd /tmp &&
            PYTHONPATH=/app/_src/api:/app/_src python -m pytest -q -p no:cacheprovider \
              model-intake-tests/test_model_intake_admission.py \
              model-intake-tests/test_model_intake_attestation.py \
              model-intake-tests/test_model_intake_signature_crypto.py'

      - name: Run complete Python unit and contract suite
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker compose exec -T api sh -lc '
            cd /workspace &&
            PYTHONPATH=/app/_src/api:/app/_src/scanner:/app/_src \
              python -m pytest -q -p no:cacheprovider tests'

      - name: Set up supported Node runtime
        if: steps.changes.outputs.ui == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run UI contracts and browser acceptance
        if: steps.changes.outputs.ui == 'true'
        run: |
          npm --prefix ui ci
          npm --prefix ui run test:unit
          npm --prefix ui run build
          npx --prefix ui playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm --prefix ui run test:browser

      - name: Dump stack logs on failure
        if: failure() && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.ui == 'true')
        run: docker compose logs --tail=300 api worker ui || true

      - name: Stop E2E stack
        if: always() && (steps.changes.outputs.backend == 'true' || steps.changes.outputs.ui == 'true')
        run: docker compose down -v
