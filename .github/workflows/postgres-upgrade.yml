name: PostgreSQL upgrade

# The launcher migrates PostgreSQL 16 data to the 18 cluster layout before anything can start
# PostgreSQL. This runs that migration against the real images in throwaway Compose projects:
# the happy path with rollback, a no-op rerun, an 18 cluster started too early, a failed restore
# followed by a retry, an empty host, and an unsupported POSTGRES_IMAGE.
on:
  pull_request:
    paths:
      - 'scanner.sh'
      - 'scripts/postgres_upgrade.sh'
      - 'scripts/postgres_upgrade_smoke.sh'
      - 'docker-compose.yml'
      - 'docker-compose.release.yml'
      - 'db/init.sql'
      - 'install/index.sh'
      - 'tests/test_postgres_upgrade.py'
      - '.github/workflows/postgres-upgrade.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postgres-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not `smoke`: that name is the required E2E check, and a second job with it made a green
  # PostgreSQL upgrade indistinguishable from (and able to stand in for) the E2E result.
  postgres-upgrade-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # True only when the read-only Docker Hub secrets exist; forks and Dependabot get false
      # and keep pulling anonymously, as before.
      HAS_DH_READ: ${{ secrets.DOCKERHUB_READ_USERNAME != '' && secrets.DOCKERHUB_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      # Docker Hub pulls go through mirror.gcr.io first, so they work without the read token.
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      # Authenticated, read-only Docker Hub pulls avoid the anonymous pull rate limit (429
      # toomanyrequests). Skipped, so pulls stay anonymous, when the read secrets are absent.
      - name: Log in to Docker Hub for read-only pulls
        if: env.HAS_DH_READ == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_READ_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      - name: Migrate PostgreSQL 16 data to 18 through the launcher
        run: bash scripts/postgres_upgrade_smoke.sh
      # Why a Docker pull did not use the mirror: dockerd logs each endpoint it falls back from.
      - name: Show Docker daemon registry fallbacks
        if: failure()
        run: |
          sudo journalctl -u docker --since -15min --no-pager \
            | grep -iE 'mirror|fallback|next endpoint|toomanyrequests|error' | tail -n 100 || true
