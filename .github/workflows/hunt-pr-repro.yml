name: Hunt review source snapshot

# Temporary, read-only review aid. Archive tracked source only, never credentials or runner state.
# Refresh the snapshot after concurrent PR changes; this helper is removed by the repair commit.
on:
  push:
    branches: [feat/hunt-fewer-refusals]
    paths: [.github/workflows/hunt-pr-repro.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Archive the exact review source
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hunt-review-source-${{ github.sha }}
          path: source.tar.gz
          retention-days: 1
          if-no-files-found: error
