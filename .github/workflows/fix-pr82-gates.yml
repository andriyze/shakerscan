name: Repair PR82 release contracts
on:
  push:
    branches: [feature/hunt-investigation-improvements]
    paths: [.github/workflows/fix-pr82-gates.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/hunt-investigation-improvements
          fetch-depth: 0
      - name: Repair documentation and installer closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          doc = Path('docs/hunt-investigation-evaluation.md')
          text = doc.read_text()
          if '**Status**:' not in '\n'.join(text.splitlines()[:20]):
              text = text.replace('# Hunt investigation evaluation\n', '# Hunt investigation evaluation\n\n**Status**: Evaluation protocol; not a security-efficacy claim.\n', 1)
              doc.write_text(text)

          installer = Path('install/index.sh')
          text = installer.read_text()
          needle = 'download "$REPO_RAW_BASE/scanner/scanner_tools/url_redaction.py" "$INSTALL_DIR/scanner/scanner_tools/url_redaction.py"\n'
          addition = 'download "$REPO_RAW_BASE/scanner/scanner_tools/xss_evidence.py" "$INSTALL_DIR/scanner/scanner_tools/xss_evidence.py"\n'
          if addition not in text:
              if needle not in text:
                  raise SystemExit('installer insertion anchor missing')
              text = text.replace(needle, needle + addition, 1)
              installer.write_text(text)
          PY
          python3 scripts/generate_install_manifest.py
          python3 -m pytest -q tests/test_documentation_policy.py tests/test_install_manifest.py tests/test_installed_import_closure.py
          git diff --check
      - name: Commit repaired PR only
        shell: bash
        run: |
          rm .github/workflows/fix-pr82-gates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/hunt-investigation-evaluation.md install/index.sh install/MANIFEST.sha256 .github/workflows/fix-pr82-gates.yml
          git commit -m 'fix(hunt): satisfy installer and documentation release contracts'
          git push origin HEAD:feature/hunt-investigation-improvements
