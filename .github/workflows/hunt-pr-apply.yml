name: Validate and apply Hunt execution repair

# Temporary branch-only repair delivery. Read-only validation precedes the narrowly scoped
# fast-forward commit. Removed after the tested product changes reach PR 193.
on:
  push:
    branches: [feat/hunt-fewer-refusals]
    paths: [.github/workflows/hunt-pr-apply.yml]
permissions:
  contents: read
concurrency:
  group: hunt-pr193-repair
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      patch_sha256: ${{ steps.bundle.outputs.patch_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only e7ac37bdb4a4aa032109516eae77f4136b6e33a3 HEAD -- . ':! .github' ':!.github')"
          cat .github/hunt-repair/part{0,1,2,3}.bin > /tmp/hunt-repair.patch.gz
          echo '7f31b175bfd0bfd76d24a332e6288d7d91f07536be62a61814859bb79392ed5f  /tmp/hunt-repair.patch.gz' | sha256sum -c -
          gzip -dc /tmp/hunt-repair.patch.gz > /tmp/hunt-repair.patch
          git apply --check --unidiff-zero /tmp/hunt-repair.patch
          git apply --unidiff-zero /tmp/hunt-repair.patch
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install the locked dependency set
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Check actual Hunt admission and live target transports
        run: python -m pytest -q tests/test_hunt_operator_execution.py --disable-warnings
      - name: Check the related core regressions
        run: >-
          python -m pytest -q
          tests/test_hunt_start_adjustments.py tests/test_hunt_start_route_adjustments.py
          tests/test_hunt_run_router.py tests/test_hunt_standing_authorization.py
          tests/test_hunt_http_capability.py tests/test_hunt_direct_origin.py
          tests/test_hunt_action_dispatcher.py tests/test_credential_resolver.py
          tests/test_credential_refs.py tests/test_credential_store.py
          tests/test_scan_credentials.py tests/test_scan_authorization_revalidation.py
          tests/test_target_authorization.py tests/test_http_credential_destination.py
          tests/test_http_redirect_chain.py tests/test_runtime_credentials.py
          tests/test_device_postman.py tests/test_device_web.py
          tests/test_device_review_regressions.py tests/test_browser_login_action.py
          tests/test_browser_login_transport.py tests/test_auth_session_capability.py
          --disable-warnings
      - name: Regenerate and validate the public contracts and install kit
        run: |
          python scripts/generate_public_api_contract.py
          python scripts/generate_capability_inventory.py
          python scripts/generate_install_manifest.py
          python scripts/generate_hunt_contract.py
          python scripts/generate_public_api_contract.py --check
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_scan_target_transport.py
          git diff --check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check the UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          node --test tests/*hunt*.test.mjs tests/*credential*.test.mjs
      - name: Export only the validated product changes
        id: bundle
        run: |
          git add -N api/hunt/target_binding.py api/runtime/approval_policy.py tests/test_hunt_operator_execution.py
          git diff --binary HEAD -- . ':!.github' > /tmp/tested-hunt-repair.patch
          test -s /tmp/tested-hunt-repair.patch
          echo "patch_sha256=$(sha256sum /tmp/tested-hunt-repair.patch | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-hunt-repair-${{ github.sha }}
          path: /tmp/tested-hunt-repair.patch
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tested-hunt-repair-${{ github.sha }}
          path: ${{ runner.temp }}/hunt-repair
      - name: Commit the tested repair without overwriting concurrent work
        env:
          EXPECTED_PATCH_SHA: ${{ needs.validate.outputs.patch_sha256 }}
          PATCH_FILE: ${{ runner.temp }}/hunt-repair/tested-hunt-repair.patch
        run: |
          set -euo pipefail
          echo "$EXPECTED_PATCH_SHA  $PATCH_FILE" | sha256sum -c -
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          git add -A
          test -z "$(git diff --cached --name-only -- .github)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(hunt): execute authorized authentication across target transports'
          git push origin HEAD:refs/heads/feat/hunt-fewer-refusals
          echo "Pushed repair $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
