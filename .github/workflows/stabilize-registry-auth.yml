name: Supporting-image identity diagnostic
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths: ['.github/workflows/stabilize-registry-auth.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check anonymous pull tokens and exact manifests without running images
        shell: python
        run: |
          import hashlib, json, urllib.error, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          client = urllib.request.build_opener(NoRedirect())
          accept = ', '.join(['application/vnd.oci.image.index.v1+json', 'application/vnd.docker.distribution.manifest.list.v2+json', 'application/vnd.oci.image.manifest.v1+json', 'application/vnd.docker.distribution.manifest.v2+json'])
          targets = [
              ('minio', 'RELEASE.2025-04-22T22-12-26Z', 'sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e', ['sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb','sha256:54d3d6a0a58fb25b4e9943d1db3828d3b4de44666f911381b4fda57175488194']),
              ('mc', 'RELEASE.2025-04-16T18-13-26Z', 'sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3', ['sha256:2582c2f48b1e31545143ba5285c67d7b38c8b8f6912142d0630686dc7aaac28b','sha256:d798ef4fe8f417b814a8968682c1e172cdfabe59da81b39e4d9cc108a355b271']),
          ]
          def get(url, headers=None):
              try:
                  req = urllib.request.Request(url, headers=headers or {})
                  with client.open(req, timeout=30) as response:
                      data = response.read(4 * 1024 * 1024 + 1)
                      if len(data) > 4 * 1024 * 1024:
                          return 'oversize', None
                      return response.status, data
              except urllib.error.HTTPError as error:
                  return error.code, None
              except (urllib.error.URLError, TimeoutError):
                  return 'transport-error', None
          failures = []
          for name, tag, digest, children in targets:
              resolved = False
              for registry, auth, service in [('quay.io','https://quay.io/v2/auth','quay.io'), ('registry-1.docker.io','https://auth.docker.io/token','registry.docker.io')]:
                  query = urllib.parse.urlencode({'service':service,'scope':f'repository:minio/{name}:pull'})
                  status, raw = get(auth + '?' + query)
                  print('Token endpoint', registry, name, 'HTTP', status, flush=True)
                  if status != 200:
                      continue
                  token_json = json.loads(raw)
                  token = token_json.get('token') or token_json.get('access_token')
                  if not isinstance(token, str) or len(token) > 65536:
                      print('No usable anonymous pull token', flush=True)
                      continue
                  for reference in [digest, tag, *children]:
                      url = f'https://{registry}/v2/minio/{name}/manifests/{reference}'
                      status, body = get(url, {'Accept':accept, 'Authorization':'Bearer ' + token, 'Cache-Control':'no-cache'})
                      print('Manifest', registry, name, reference, 'HTTP', status, flush=True)
                      if status != 200:
                          continue
                      observed = 'sha256:' + hashlib.sha256(body).hexdigest()
                      print('Verified response digest', observed, flush=True)
                      if reference.startswith('sha256:') and observed != reference:
                          raise SystemExit('Registry bytes do not match requested digest')
                      document = json.loads(body)
                      print('Platforms', [(row.get('platform'), row.get('digest')) for row in document.get('manifests', [])], flush=True)
                      if observed == digest:
                          resolved = True
              if not resolved:
                  failures.append(name)
          if failures:
              raise SystemExit('Pinned indexes still unavailable: ' + ', '.join(failures))
