name: Fix 2.2.0 RC failures v2
on:
  push:
    branches: [fix/2.2.0-rc-failures]
    paths: [.github/workflows/fix-rc-failures-v2.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Apply fixes and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def one(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing marker in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          one('tests/e2e/harness.py', '    return {"Authorization": f"Bearer {token}"}\n',
              '    headers = {"Authorization": f"Bearer {token}"}\n'
              '    origin = os.environ.get("SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_ORIGIN", "").strip()\n'
              '    if origin:\n        headers["Origin"] = origin\n'
              '    return headers\n')
          one('scripts/installed_stack_smoke.sh',
              '        SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_TOKEN="$token" \\\n        SHAKERSCAN_RELEASE_DECLARED_DEBT=',
              '        SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_TOKEN="$token" \\\n'
              '        SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_ORIGIN="http://127.0.0.1:$UI_PORT" \\\n'
              '        SHAKERSCAN_RELEASE_DECLARED_DEBT=')

          p=Path('scanner/model_intake_tools/semgrep.in')
          p.write_text(p.read_text().replace('semgrep==1.172.0','semgrep==1.174.0',1) +
              '# Security floor for Semgrep MCP transport advisories fixed in MCP 1.28.1+.\nmcp==1.29.0\n')

          p=Path('scanner/Dockerfile.model-intake'); s=p.read_text()
          marker='ARG SCANNER_RUNTIME_IMAGE=shakerscan-worker:local\nFROM ${SCANNER_RUNTIME_IMAGE}\n'
          stage='''ARG MODEL_INTAKE_GO_BUILDER=golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452\nFROM ${MODEL_INTAKE_GO_BUILDER} AS model-intake-go-tools\nARG TRIVY_VERSION=0.73.0\nARG OSV_SCANNER_VERSION=2.5.1\nRUN set -eux; \\\n    git clone --depth 1 --branch "v${TRIVY_VERSION}" https://github.com/aquasecurity/trivy.git /src/trivy; \\\n    cd /src/trivy; \\\n    go get github.com/go-git/go-git/v5@v5.19.2 golang.org/x/crypto@v0.55.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.1 oras.land/oras-go/v2@v2.6.2; \\\n    CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /out/trivy ./cmd/trivy; \\\n    git clone --depth 1 --branch "v${OSV_SCANNER_VERSION}" https://github.com/google/osv-scanner.git /src/osv-scanner; \\\n    cd /src/osv-scanner; \\\n    go get golang.org/x/crypto@v0.55.0 golang.org/x/mod@v0.40.0 google.golang.org/grpc@v1.83.1; \\\n    CGO_ENABLED=0 go build -trimpath -buildvcs=false -o /out/osv-scanner ./cmd/osv-scanner; \\\n    go version /out/trivy | grep -F 'go1.27.0'; \\\n    go version /out/osv-scanner | grep -F 'go1.27.0'; \\\n    go version -m /out/trivy | grep -F 'golang.org/x/crypto\tv0.55.0'; \\\n    go version -m /out/trivy | grep -F 'github.com/go-git/go-git/v5\tv5.19.2'; \\\n    go version -m /out/trivy | grep -F 'oras.land/oras-go/v2\tv2.6.2'; \\\n    go version -m /out/osv-scanner | grep -F 'google.golang.org/grpc\tv1.83.1'\n\n'''
          if marker not in s: raise SystemExit('runtime marker missing')
          s=s.replace(marker,stage+marker,1)
          old='''RUN apt-get update && apt-get install -y --no-install-recommends \\\n      make gcc libcurl4-openssl-dev libssl-dev python3-dev \\\n      python3-venv python3-pip-whl python3-setuptools-whl \\\n && rm -rf /var/lib/apt/lists/*\n\n'''
          if old not in s: raise SystemExit('build dep layer missing')
          s=s.replace(old,'',1)
          old='''RUN set -eu; \\\n    for tool in modelscan fickling semgrep safetensors pip-audit; do \\\n'''
          new='''RUN set -eu; \\\n    apt-get update; \\\n    apt-get install -y --no-install-recommends make gcc libcurl4-openssl-dev libssl-dev python3-dev python3-venv python3-pip-whl python3-setuptools-whl; \\\n    for tool in modelscan fickling semgrep safetensors pip-audit; do \\\n'''
          if old not in s: raise SystemExit('venv run missing')
          s=s.replace(old,new,1)
          tail='''      --output /opt/pip-audit-cache/runtime-audit.json \\\n      --metadata /opt/pip-audit-cache/metadata.json\n'''
          newtail='''      --output /opt/pip-audit-cache/runtime-audit.json \\\n      --metadata /opt/pip-audit-cache/metadata.json; \\\n    apt-get purge -y --auto-remove make gcc libcurl4-openssl-dev libssl-dev python3-dev python3-venv python3.12-venv python3-pip-whl python3-setuptools-whl; \\\n    rm -rf /var/lib/apt/lists/*\n'''
          if tail not in s: raise SystemExit('cache tail missing')
          s=s.replace(tail,newtail,1)
          a=s.index('# Trivy is a checksum-pinned native adapter.')
          b=s.index('ENV OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/opt/osv-cache')
          repl='''# Native scanners are rebuilt from tagged upstream source using a patched Go toolchain.\nCOPY --from=model-intake-go-tools /out/trivy /opt/tools/trivy\nCOPY --from=model-intake-go-tools /out/osv-scanner /opt/tools/osv-scanner\nARG TRIVY_DOWNLOAD_ATTEMPTS=4\nRUN set -eu; \\\n    chmod 755 /opt/tools/trivy /opt/tools/osv-scanner; \\\n    mkdir -p /opt/trivy-cache; \\\n    download_trivy_data() { /opt/tools/trivy image --download-db-only --cache-dir /opt/trivy-cache && /opt/tools/trivy fs --scanners misconfig --format json --cache-dir /opt/trivy-cache /opt/model-intake-locks >/dev/null; }; \\\n    attempt=1; until download_trivy_data; do [ "$attempt" -lt "${TRIVY_DOWNLOAD_ATTEMPTS}" ] || exit 1; sleep $((attempt*5)); attempt=$((attempt+1)); done; \\\n    mkdir -p /opt/osv-cache/osv-scalibr/PyPI; \\\n    curl --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 -fsSL "https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip" -o /opt/osv-cache/osv-scalibr/PyPI/all.zip; \\\n    osv_db_sha="$(sha256sum /opt/osv-cache/osv-scalibr/PyPI/all.zip | cut -d' ' -f1)"; osv_updated="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; \\\n    printf '{"UpdatedAt":"%s","Ecosystem":"PyPI","DatabaseSHA256":"%s"}\\n' "$osv_updated" "$osv_db_sha" > /opt/osv-cache/metadata.json\nENV OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/opt/osv-cache\n'''
          s=s[:a]+repl+s[b+len('ENV OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/opt/osv-cache\n'):]
          oldpurge='''# The build dependencies restored above are not needed at runtime.\nRUN apt-get purge -y --auto-remove \\\n      make gcc libcurl4-openssl-dev libssl-dev python3-dev \\\n      python3-venv python3.12-venv python3-pip-whl python3-setuptools-whl && \\\n    rm -rf /var/lib/apt/lists/*\n\n'''
          s=s.replace(oldpurge,'')
          p.write_text(s)

          p=Path('tests/test_model_intake_image_split.py'); t=p.read_text()
          t=t.replace('"ARG OSV_SCANNER_VERSION=2.5.0",','"ARG OSV_SCANNER_VERSION=2.5.1",')
          t=t.replace('assert MI.count("apt-get purge -y --auto-remove") == 1',
              'assert MI.count("apt-get purge -y --auto-remove") == 1\n'
              '    assert "AS model-intake-go-tools" in MI\n'
              '    assert "golang:1.27.0-bookworm@sha256:" in MI\n'
              '    assert "golang.org/x/crypto@v0.55.0" in MI\n'
              '    assert "google.golang.org/grpc@v1.83.1" in MI\n'
              '    assert "COPY --from=model-intake-go-tools /out/trivy" in MI\n'
              '    assert "aquasecurity/trivy/releases/download" not in MI')
          p.write_text(t)
          Path('tests/test_model_intake_e2e_operator_headers.py').write_text('''from tests.e2e import harness as H\n\ndef test_operator_headers_propagate_explicit_origin(monkeypatch):\n    monkeypatch.setenv("SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_TOKEN", "x" * 40)\n    monkeypatch.setenv("SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_ORIGIN", "http://127.0.0.1:39001")\n    assert H.model_intake_operator_headers() == {"Authorization": "Bearer " + "x" * 40, "Origin": "http://127.0.0.1:39001"}\n\ndef test_operator_headers_do_not_invent_origin(monkeypatch):\n    monkeypatch.setenv("SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_TOKEN", "y" * 40)\n    monkeypatch.delenv("SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_ORIGIN", raising=False)\n    assert H.model_intake_operator_headers() == {"Authorization": "Bearer " + "y" * 40}\n''')
          PY
          python -m pip install --disable-pip-version-check uv==0.8.22
          uv pip compile scanner/model_intake_tools/semgrep.in --python-version 3.12 --universal --generate-hashes --output-file scanner/model_intake_tools/semgrep.lock
          grep -F 'semgrep==1.174.0' scanner/model_intake_tools/semgrep.lock
          grep -F 'mcp==1.29.0' scanner/model_intake_tools/semgrep.lock
          ! grep -F 'mcp==1.23.3' scanner/model_intake_tools/semgrep.lock
          python3 scripts/generate_install_manifest.py
          git diff --check
      - name: Focused tests
        run: |
          python -m pip install --disable-pip-version-check -r scanner/requirements.lock --require-hashes
          pytest -q tests/test_model_intake_image_split.py tests/test_model_intake_e2e_operator_headers.py tests/test_v2_ci_contract.py
          python3 scripts/generate_install_manifest.py --check
          python3 scripts/check_module_size.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner/Dockerfile.model-intake scanner/model_intake_tools/semgrep.in scanner/model_intake_tools/semgrep.lock tests/e2e/harness.py scripts/installed_stack_smoke.sh tests/test_model_intake_image_split.py tests/test_model_intake_e2e_operator_headers.py install/MANIFEST.sha256
          git commit -m 'fix(release): correct exact-image auth and Model Intake CVEs'
          git push origin HEAD:refs/heads/fix/2.2.0-rc-failures
