name: Temporary 2.2.0 RC repair

on:
  push:
    branches: [fix/2.2.0-final-rc]
    paths: [.github/workflows/_temporary_220_rc_repair.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Patch planner authority and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          action = Path("api/scan/action_plan.py")
          text = action.read_text()
          marker = '"prove.request_sqli",'
          start = text.index(marker)
          end = text.index("            if nosqli:", start)
          segment = text[start:end]
          required = 'required="sqli" in explicitly_requested,'
          if segment.count(required) != 1:
              raise SystemExit(f"expected one required SQLi proof in marker block, found {segment.count(required)}")
          segment = segment.replace(
              required,
              '# Exact-request differential verification is the family minimum; proof is an optional escalation.\n                        required=False,',
          )
          action.write_text(text[:start] + segment + text[end:])

          test = Path("tests/test_220_request_candidate_priority.py")
          text = test.read_text()
          old_sig = 'def _plan(family: str):\n'
          old_budget = '        max_state_changing_requests=10,\n'
          if text.count(old_sig) != 1 or text.count(old_budget) != 1:
              raise SystemExit("unexpected request priority helper shape")
          text = text.replace(old_sig, 'def _plan(family: str, *, max_state_changing_requests: int = 10):\n', 1)
          text = text.replace(old_budget, '        max_state_changing_requests=max_state_changing_requests,\n', 1)
          marker = 'def test_exact_sqli_request_and_proof_fit_rc_mutation_ceiling() -> None:\n'
          start = text.index(marker)
          replacement = '''def test_exact_sqli_verification_survives_tight_rc_mutation_ceiling() -> None:
              budget, plan = _plan("sqli")
              by_id = {action.action_id: action for action in plan.actions}

              assert by_id["verify.request_sqli"].required is True
              assert by_id["prove.request_sqli"].required is False
              assert by_id["verify.sqli"].required is False
              assert by_id["prove.sqli"].required is False

              allocation = allocate_scan_action_plan(plan, budget)
              admitted = {action.action_id: action for action in allocation.plan.actions}
              assert admitted["verify.request_sqli"].admission_status == "planned"
              assert admitted["prove.request_sqli"].admission_status == "skipped"
              assert admitted["prove.request_sqli"].reason_code == "insufficient_plan_budget"


          def test_exact_sqli_proof_runs_when_mutation_authority_is_available() -> None:
              budget, plan = _plan("sqli", max_state_changing_requests=20)
              by_id = {action.action_id: action for action in plan.actions}

              assert by_id["verify.request_sqli"].required is True
              assert by_id["prove.request_sqli"].required is False

              allocation = allocate_scan_action_plan(plan, budget)
              admitted = {action.action_id: action for action in allocation.plan.actions}
              assert admitted["verify.request_sqli"].admission_status == "planned"
              assert admitted["prove.request_sqli"].admission_status == "planned"
          '''
          test.write_text(text[:start] + replacement)
          PY
      - name: Regenerate installer manifest
        run: |
          python scripts/generate_install_manifest.py
          python scripts/generate_install_manifest.py --check
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Prove targeted regressions
        run: |
          python -m pytest -q tests/test_220_request_candidate_priority.py tests/test_install_manifest.py
      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/scan/action_plan.py tests/test_220_request_candidate_priority.py install/MANIFEST.sha256
          git diff --cached --check
          git commit -m "fix: make SQLi proof degrade within scan authority"
          git push origin HEAD:fix/2.2.0-final-rc
