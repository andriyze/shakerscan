name: Hunt proof exact-tree validation

on:
  push:
    branches: [feat/hunt-verified-discovery]
    paths:
      - .github/hunt-proof-transfer/**
      - .github/workflows/hunt-proof-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hunt_records
          POSTGRES_PASSWORD: hunt-records-disposable-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hunt_records"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUNT_TEST_POSTGRES_DSN: postgresql://postgres:hunt-records-disposable-ci@127.0.0.1:5432/hunt_records
      PYTHONPATH: .:api:scanner
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble the exact locally tested production tree
        run: python3 .github/hunt-proof-transfer/assemble.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Execute proof, negative controls, PostgreSQL, replay and attribution regressions
        run: |
          python -m pytest -q --junitxml=/tmp/hunt-proof-output/tests.xml \
            tests/test_hunt_authz_findings.py tests/test_hunt_authz_proof_loopback.py \
            tests/test_hunt_authz_findings_postgres.py tests/test_hunt_findings_attribution.py \
            tests/test_hunt_replay_service_evidence.py tests/test_hunt_deterministic_findings.py \
            tests/test_hunt_http_capability.py tests/test_hunt_service_sources.py \
            tests/test_hunt_service_sources_postgres.py tests/test_hunt_fragment_xss_browser_proof.py \
            tests/test_authz_capability.py tests/test_authz_selected_objects.py \
            tests/test_authz_investigation_acceptance.py
      - name: Verify generated contracts and static gates
        run: |
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_hunt_methodologies.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hunt-proof-validated-${{ github.sha }}
          path: /tmp/hunt-proof-output/
          retention-days: 7
          if-no-files-found: error
  publish-immutable-objects:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reassemble exact bytes and publish Git blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_GIT_OBJECTS: '1'
        run: python3 .github/hunt-proof-transfer/assemble.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hunt-proof-objects-${{ github.sha }}
          path: /tmp/hunt-proof-output/
          retention-days: 7
          if-no-files-found: error
