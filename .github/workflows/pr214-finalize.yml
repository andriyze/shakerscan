name: PR 214 final recovery validation
on:
  push:
    branches: [claude/github-access-qqgoq6]
    paths: [.github/workflows/pr214-finalize.yml]
permissions:
  contents: write
jobs:
  validate-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Apply both reviewed patches and remove transfer scaffolding
        run: |
          git apply --index --unidiff-zero .github/pr214-product.patch
          git apply --index .github/pr214-followup.patch
          test "$(git hash-object api/worker.py)" = a6f8c40b0edc41ade5652cd09c7ffbcac0d71c97
          test "$(git hash-object tests/test_hunt_replay_worker_lifecycle.py)" = 2aab238a4b8e2ec48d32aa2d2335459033a49e48
          git rm .github/pr214-product.patch .github/pr214-followup.patch .github/workflows/pr214-repair.yml .github/workflows/pr214-finalize.yml
          git diff --cached --check
      - name: Install locked dependencies and native Nmap
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
      - name: Native IPv4 and IPv6 plus final recovery and broad focused regressions
        env:
          PYTHONPATH: .:api:scanner:client/src
          SHAKERSCAN_REQUIRE_NATIVE_NSE: '1'
        run: |
          python -m pytest -q tests/integration/test_hunt_nse_native.py tests/test_hunt_nse_capability.py tests/test_hunt_replay_service_origin.py tests/test_hunt_replay_worker_lifecycle.py tests/test_replay_capability_adapter.py tests/test_runtime_zero_limits.py tests/test_runtime_capabilities.py tests/test_budget_reservation_lifecycle.py tests/test_network_capabilities.py tests/test_hunt_network_reservations.py tests/test_hunt_session_service_authority.py tests/test_hunt_service_execution.py tests/test_hunt_authority_integrity.py tests/test_hunt_authorization_service_origins.py tests/test_auth_session_store.py tests/test_hunt_verification_admission.py client/tests/test_public.py --junitxml=/tmp/pr214-final.xml
      - name: Static and generated contract gates
        run: |
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
      - name: Upload validated Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def post(endpoint, value):
              request = urllib.request.Request(base + endpoint, data=json.dumps(value).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for row in git('diff', '--cached', '--name-status').splitlines():
              status, path = row.split('\t')
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, expected, _ = git('ls-files', '--stage', '--', path).split()[:3]
              created = post('/git/blobs', {'content': Path(path).read_text(), 'encoding': 'utf-8'})
              assert created['sha'] == expected, (path, created['sha'], expected)
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': created['sha']})
          result = post('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert result['sha'] == git('write-tree')
          data = {'parent': git('rev-parse', 'HEAD'), 'tree': result['sha'], 'changed_files': [e['path'] for e in entries]}
          print('VALIDATED_PARENT=' + data['parent'])
          print('VALIDATED_TREE=' + data['tree'])
          Path('/tmp/pr214-final-tree.json').write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr214-final-recovery-validation
          path: |
            /tmp/pr214-final.xml
            /tmp/pr214-final-tree.json
          retention-days: 7
