name: Promote stable channel

# Order matters here. The hosted installer resolves `install/STABLE_VERSION` from `main` at
# request time, so merging that change IS the public promotion. This workflow therefore validates
# the public smoke receipt and moves `latest` FIRST, and only then prepares the channel bump as a
# branch for a pull request. Nothing user-facing moves before the receipt has been checked.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already-published version that passed public smoke"
        required: true
      smoke_receipt_url:
        description: "Durable public-smoke receipt URL"
        required: true
      smoke_receipt_sha256:
        description: "SHA-256 of the public-smoke receipt"
        required: true

concurrency:
  group: shakerscan-stable-promotion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stable:
    name: Validate smoke, move latest, prepare the channel bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release and public smoke receipt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SMOKE_URL: ${{ inputs.smoke_receipt_url }}
          SMOKE_SHA256: ${{ inputs.smoke_receipt_sha256 }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SMOKE_URL" =~ ^https:// ]]
          [[ "$SMOKE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh release view "v${VERSION}" --json isPrerelease,isDraft --jq '(.isPrerelease == false) and (.isDraft == false)' | grep -qx true
          release_sha="$(gh release view "v${VERSION}" --json targetCommitish --jq .targetCommitish)"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          gh release download "v${VERSION}" --pattern release-image-lock.env --output release-image-lock.env
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 "$SMOKE_URL" --output public-smoke-receipt.json
          echo "${SMOKE_SHA256}  public-smoke-receipt.json" | sha256sum --check --strict
          jq -e --arg version "$VERSION" --arg sha "$release_sha" '
            .schema_version == "shakerscan-public-smoke/v2"
            and .version == $version
            and .source_sha == $sha
            and .scope_exclusions == ["model_intake"]
            and .checks.clean_install == "pass"
            and .checks.ui_api_identity == "pass"
            and .checks.worker_identity == "pass"
          ' public-smoke-receipt.json >/dev/null
          for binding in scanner:SCANNER_IMAGE api:API_IMAGE ui:UI_IMAGE signer:SIGNER_IMAGE; do
            key="${binding%%:*}"
            variable="${binding#*:}"
            expected="$(sed -n "s/^${variable}=//p" release-image-lock.env)"
            [[ "$expected" =~ @sha256:[0-9a-f]{64}$ ]]
            test "$(jq -r ".images.${key}" public-smoke-receipt.json)" = "$expected"
          done
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path
          current = Path("install/STABLE_VERSION").read_text().strip()
          nxt = tuple(map(int, sys.argv[1].split(".")))
          cur = tuple(map(int, current.split("."))) if re.fullmatch(r"\d+\.\d+\.\d+", current) else (0, 0, 0)
          if nxt < cur:
              raise SystemExit(f"refusing to move the stable channel backwards from {current} to {sys.argv[1]}")
          PY

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Move latest aliases without rebuilding
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          for image in \
            shakerscan/shakerscan-scanner \
            shakerscan/shakerscan-api \
            shakerscan/shakerscan-ui \
            shakerscan/shakerscan-model-intake-signer; do
            digest="$(docker buildx imagetools inspect "${image}:${VERSION}" | awk '$1 == "Digest:" && !found {print $2; found=1}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools create -t "${image}:latest" "${image}@${digest}"
            latest="$(docker buildx imagetools inspect "${image}:latest" | awk '$1 == "Digest:" && !found {print $2; found=1}')"
            [[ "$latest" == "$digest" ]]
          done

      - name: Prepare the stable-channel pull request branch
        env:
          VERSION: ${{ inputs.version }}
          SMOKE_URL: ${{ inputs.smoke_receipt_url }}
          SMOKE_SHA256: ${{ inputs.smoke_receipt_sha256 }}
        shell: bash
        run: |
          if [[ "$(tr -d '[:space:]' < install/STABLE_VERSION)" == "$VERSION" ]]; then
            echo "install/STABLE_VERSION already resolves ${VERSION}; nothing to bump."
            exit 0
          fi
          branch="release/stable-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" main
          printf '%s\n' "$VERSION" > install/STABLE_VERSION
          git add install/STABLE_VERSION
          git commit -m "release: promote ${VERSION} stable channel" \
            -m "Public smoke receipt: ${SMOKE_URL}" \
            -m "Receipt sha256: ${SMOKE_SHA256}" \
            -m "Promotion run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push --force-with-lease origin "$branch"
          # Pull requests opened with the workflow token do not trigger the required checks, so the
          # operator opens it; merging that pull request moves the hosted installer.
          {
            echo "## Stable channel bump prepared"
            echo
            echo "\`latest\` now points at v${VERSION}. Open and merge the channel pull request:"
            echo
            echo '```bash'
            echo "gh pr create --base main --head ${branch} --title 'release: promote ${VERSION} stable channel' --body 'Public smoke receipt: ${SMOKE_URL} (sha256 ${SMOKE_SHA256})'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
