name: E2E (manual full validation)

# The full suite performs bounded active SQLi/XSS testing against the pinned
# Juice Shop service. It is intentionally manual and diagnostic. Publication runs
# one final-manifest acceptance and does not require this separate workflow.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact approved commit SHA on v2"
        required: true

permissions:
  contents: read

concurrency:
  group: e2e-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Juice Shop shares the Compose network with the scanner worker. Do not
      # route active scans through the runner host gateway.
      SHAKERSCAN_E2E_DAST_TARGET: http://juice-shop:3000
      SHAKERSCAN_E2E_SCAN_TARGET: http://juice-shop:3000
      POSTGRES_PASSWORD: ci-postgres-credential-0000000000000001
      REDIS_PASSWORD: ci-redis-credential-000000000000000001
      MODEL_INTAKE_SIGNER_DATABASE_PASSWORD: ci-model-intake-signer-db-password-00000001
      MODEL_INTAKE_SIGNER_INTERNAL_TOKEN: ci-model-intake-signer-token-000000000000001
      MODEL_INTAKE_OPERATOR_TOKEN: ci-model-intake-operator-token-00000000000001
      SHAKERSCAN_E2E_MODEL_INTAKE_OPERATOR_TOKEN: ci-model-intake-operator-token-00000000000001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify exact release candidate
        shell: bash
        env:
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "$REQUESTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          candidate_sha="$(git rev-parse HEAD)"
          if [[ "$REQUESTED_CANDIDATE_SHA" != "$candidate_sha" ]]; then
            echo "Candidate mismatch: requested=$REQUESTED_CANDIDATE_SHA checked_out=$candidate_sha" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/v2:refs/remotes/origin/v2
          git merge-base --is-ancestor "$candidate_sha" origin/v2 || {
            echo "Approved candidate is not reachable from origin/v2" >&2
            exit 1
          }

      - name: Set up supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Start ShakerScan and pinned Juice Shop
        run: |
          # `docker compose up --build` cannot build this stack from scratch. The API
          # image builds FROM shakerscan-worker:local, which is a Dockerfile base rather
          # than a compose dependency, so on a clean runner compose tried to PULL it and
          # failed with "pull access denied". `scanner.sh build` builds the shared scanner
          # runtime first and binds the sandbox and API images to that exact image, which
          # is what docker-compose.yml's own comment says is required and what
          # v2-contracts.yml already does.
          ./scanner.sh build
          docker compose --profile e2e up -d
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/health && break
            sleep 5
          done
          curl -sf http://localhost:8080/health
          for i in $(seq 1 40); do
            curl -sf http://localhost:3001/ >/dev/null && break
            sleep 5
          done
          curl -sf http://localhost:3001/ >/dev/null

      - name: Verify Juice Shop is reachable from the worker network
        run: |
          docker compose exec -T worker python3 -c 'import urllib.request; response = urllib.request.urlopen("http://juice-shop:3000/rest/products/search?q=apple", timeout=10); assert response.status == 200'

      - name: Run full E2E validation
        run: |
          mkdir -p artifacts
          python3 tests/e2e/run_e2e.py --area all \
            --scorecard artifacts/e2e-scorecard.json

      # The E2E gate proves the stack works end to end; it does not measure how much
      # the scanner actually finds. `expected_recall` -- how many of Juice Shop's known
      # vulnerability classes the engine reaches -- was produced only by whoever
      # remembered to run the benchmark by hand, so release qualification never saw it.
      # The stack and target are already up here, so the measurement costs one step.
      #
      # `--enforce-quality` requires either the complete bar or the explicit bounded
      # release disposition. An empty incremental gate list cannot pass by itself.
      - name: Measure DAST recall against the Juice Shop answer key
        run: |
          python3 scripts/benchmark_targets.py juice_shop --auth --enforce-quality \
            --target-url juice_shop=http://juice-shop:3000 \
            --auth-target-url juice_shop=http://127.0.0.1:3001
          cp results/benchmark-runs/benchmark-juice_shop.json artifacts/dast-recall.json

      - name: Run exact-candidate UI unit and browser acceptance
        env:
          PLAYWRIGHT_REAL_STACK: "1"
          SHAKERSCAN_API_URL: http://localhost:8080
        run: |
          npm --prefix ui ci
          npm --prefix ui run test:unit
          npx --prefix ui playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm --prefix ui run test:browser
          cp ui/test-results/browser-results.json artifacts/playwright.json

      - name: Upload exact-SHA E2E scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-e2e-${{ inputs.candidate_sha }}
          path: |
            artifacts/e2e-scorecard.json
            artifacts/playwright.json
            artifacts/dast-recall.json
          if-no-files-found: error
          retention-days: 30

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose --profile e2e logs --tail=300 api worker juice-shop || true

      - name: Stop E2E stack
        if: always()
        run: docker compose --profile e2e down -v
