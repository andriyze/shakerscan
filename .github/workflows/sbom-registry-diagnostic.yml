name: SBOM diagnostic exact-tree validation
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths: ['.github/workflows/sbom-registry-diagnostic.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Reconstruct explicit reviewed changes on the published budget tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin b4a8ea7e2dd53d9559c2192861b21c92aa1ebdbe
          git checkout --detach b4a8ea7e2dd53d9559c2192861b21c92aa1ebdbe
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/8ee4742e455314c2e543aa65e3a0f9039304f1de" --jq .content | base64 --decode > "$RUNNER_TEMP/sbom-diagnostics.patch"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/2103182432312f46db63d46264d75009f3b224ea" --jq .content | base64 --decode > tests/test_release_sbom_registry_errors.py
          test "$(git hash-object "$RUNNER_TEMP/sbom-diagnostics.patch")" = 8ee4742e455314c2e543aa65e3a0f9039304f1de
          test "$(git hash-object tests/test_release_sbom_registry_errors.py)" = 2103182432312f46db63d46264d75009f3b224ea
          git apply --check "$RUNNER_TEMP/sbom-diagnostics.patch"
          git apply "$RUNNER_TEMP/sbom-diagnostics.patch"
          git add scripts/release_sbom.py scripts/release_sbom_stage2.py tests/test_release_sbom_registry_errors.py
          test "$(git write-tree)" = 2f5088f4a3680c7492e90e26328ee2e1a4a6d1cd
      - name: Run offline regression and consistency checks without contacting registries
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3' 'packaging==25.0'
          python -m unittest discover -s tests -p 'test_release_sbom*.py' -v
          python scripts/generate_install_manifest.py --check
          python scripts/check_documentation_policy.py
          python scripts/check_module_size.py
          git diff --cached --check
      - name: Export only verified blobs; do not change any branch or publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = {
              'scripts/release_sbom.py': 'c52ceecabbd07a822ca058f8870a95606d190c99',
              'scripts/release_sbom_stage2.py': '1fff063ddbe13181d5a0b32f9c7b74e151ad3af7',
          }
          for path, sha in expected.items():
              request = json.dumps({'encoding': 'utf-8', 'content': Path(path).read_text()})
              response = subprocess.run(['gh', 'api', '--method', 'POST', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs', '--input', '-'], input=request, text=True, capture_output=True, check=True, timeout=60)
              actual = json.loads(response.stdout)['sha']
              if actual != sha:
                  raise SystemExit('Git blob differs from tested source: ' + path)
              print(path, actual)
          print('Verified source tree: 2f5088f4a3680c7492e90e26328ee2e1a4a6d1cd')
          PY
