name: SBOM registry diagnostic
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths: ['.github/workflows/sbom-registry-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Read immutable historical fixture
        run: |
          git fetch --depth=1 origin tag v2.4.0
          git worktree add --detach "$RUNNER_TEMP/sbom-fixture" 'v2.4.0^{commit}'
          python3 -m pip install 'PyYAML==6.0.3' 'packaging==25.0'
      - name: Inspect each pinned supporting service without pulling or running images
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from scripts.release_sbom_coverage import supporting_images, service_platforms
          root = Path(os.environ['RUNNER_TEMP']) / 'sbom-fixture'
          inventory = json.loads((root / 'install/release-images.json').read_text())
          failures = []
          for service in supporting_images(root / 'docker-compose.release.yml', inventory):
              reference = service['image_reference']
              print('Inspecting', service['image'], reference, flush=True)
              result = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', reference, '--raw'], capture_output=True, text=True, timeout=180)
              if result.returncode:
                  detail = re.sub(r'(?i)bearer\s+\S+', 'Bearer [REDACTED]', result.stderr)
                  detail = re.sub(r'https?://\S+', '[registry URL]', detail)
                  print('Registry failure:', result.returncode, detail[-2000:], flush=True)
                  failures.append(service['image'])
              else:
                  print('Platforms:', service_platforms(json.loads(result.stdout)), flush=True)
          if failures:
              raise SystemExit('Unresolved pinned images: ' + ', '.join(failures))
          PY
