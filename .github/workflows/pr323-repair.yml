name: PR 323 guarded repair
on:
  push:
    branches: [claude/loving-pascal-koca85]
    paths: [.github/pr323-repair.py, .github/workflows/pr323-repair.yml]
permissions:
  contents: write
concurrency:
  group: pr323-guarded-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'andriyze/shakerscan' && github.ref == 'refs/heads/claude/loving-pascal-koca85'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shakerscan_finding_service_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FINDING_SERVICE_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/shakerscan_finding_service_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install repository-locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Apply edits only to the audited source blobs
        run: python .github/pr323-repair.py
      - name: Run behavioral and PostgreSQL migration regressions
        run: |
          mkdir -p artifacts
          python -m pytest -q \
            tests/test_authentication_proof_contract.py \
            tests/test_ai_template_secrets.py \
            tests/test_backup_secrets_and_retention.py \
            tests/test_deployment_gate.py \
            tests/test_finding_service_identity.py \
            tests/test_finding_reconciliation.py \
            tests/test_finding_check_identity.py \
            tests/test_finding_proof_state.py \
            tests/test_sqli_proof_capability.py \
            tests/test_nosqli_verify_capability.py \
            tests/test_api_helpers.py \
            --junitxml=artifacts/pr323-repair.xml
      - name: Regenerate and verify shipped contracts
        run: |
          python scripts/generate_capability_inventory.py
          python scripts/generate_install_manifest.py
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_scan_target_transport.py
          bash -n scanner.sh
          git diff --check
      - name: Publish tested changes without rewriting branch history
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=claude/loving-pascal-koca85
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="$(git -c http.https://github.com/.extraheader="$auth" ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote" = "$EXPECTED_HEAD"
          git add api/api.py api/capabilities/authentication_proof.py api/runtime/ai_template_secrets.py \
            api/scan/finding_reconciliation.py scanner.sh \
            tests/test_authentication_proof_contract.py tests/test_ai_template_secrets.py \
            tests/test_backup_secrets_and_retention.py tests/test_deployment_gate.py \
            tests/test_finding_service_identity.py install/MANIFEST.sha256 docs/functionality-reference.md
          git -c user.name=ChatGPT -c user.email=noreply@openai.com commit \
            -m 'fix: bind exception migrations, template secrets, auth proof and backup key aliases'
          git -c http.https://github.com/.extraheader="$auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr323-repair-${{ github.sha }}
          path: artifacts/pr323-repair.xml
          if-no-files-found: warn
          retention-days: 7
