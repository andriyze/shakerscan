name: Apply V2 Hunt UI contract

on:
  push:
    branches:
      - v2
    paths:
      - .github/workflows/v2-apply-hunt-ui-contract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-apply-hunt-ui-contract
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Patch API entrypoint and Hunt UI contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one patch anchor, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          api = Path("ui/src/lib/api.ts")
          replace_once(
              api,
              """    requestCollectionIds?: string[]
  }
) {
""",
              """    requestCollectionIds?: string[]
    policy?: {
      activeTesting?: boolean
      allowStateChangingHttp?: boolean
      networkDiscovery?: boolean
      authorizationConfirmed?: boolean
      approvalReceiptId?: string
      scopeReceiptId?: string
    }
  }
) {
""",
          )
          replace_once(
              api,
              """        request_collection_ids: options.requestCollectionIds,
      }
""",
              """        request_collection_ids: options.requestCollectionIds,
        policy: options.policy
          ? {
              active_testing: Boolean(options.policy.activeTesting),
              allow_state_changing_http: Boolean(options.policy.allowStateChangingHttp),
              network_discovery: Boolean(options.policy.networkDiscovery),
              authorization_confirmed: Boolean(options.policy.authorizationConfirmed),
              approval_receipt_id: options.policy.approvalReceiptId || undefined,
              scope_receipt_id: options.policy.scopeReceiptId || undefined,
            }
          : undefined,
      }
""",
          )

          page = Path("ui/src/app/hunt/page.tsx")
          replace_once(
              page,
              """    const timeout = setTimeout(() => {
      if (alive) setError('Cancellation requested but the run did not reach a terminal state yet.')
    }, 10000)
""",
              """    const timeout = setTimeout(() => {
      const status = String(activeHuntRef.current?.status || '')
      if (!terminalStatuses.has(status)) {
        setError('Cancellation requested but the run did not reach a terminal state yet.')
      }
    }, 10000)
""",
          )
          replace_once(
              page,
              """      requestCollectionIds,
      credentialRefs: credentialRefInput.trim()
""",
              """      requestCollectionIds,
      policy: {
        activeTesting: active,
        allowStateChangingHttp: allowStateChanging,
        networkDiscovery,
        authorizationConfirmed: confirmedAuthorization,
      },
      credentialRefs: credentialRefInput.trim()
""",
          )

          entrypoint = Path("scanner/entrypoint.sh")
          replace_once(
              entrypoint,
              """if [ "${1:-}" = "python3" ] && [ "${2:-}" = "/app/worker.py" ] && [ -f /app/worker_v2.py ]; then
    shift 2
    set -- python3 /app/worker_v2.py "$@"
fi

# Execute command passed to container
""",
              """if [ "${1:-}" = "python3" ] && [ "${2:-}" = "/app/worker.py" ] && [ -f /app/worker_v2.py ]; then
    shift 2
    set -- python3 /app/worker_v2.py "$@"
fi

# Route the API through the V2 Hunt-start contract while the large compatibility
# application still owns persistence, queues, fleet operations, and existing routes.
if [ "${1:-}" = "python3" ] && [ "${2:-}" = "/app/api.py" ] && [ -f /app/api_v2.py ]; then
    shift 2
    set -- python3 /app/api_v2.py "$@"
fi

# Execute command passed to container
""",
          )
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Publish Hunt contract integration
        run: |
          if git diff --quiet -- ui/src/lib/api.ts ui/src/app/hunt/page.tsx scanner/entrypoint.sh; then
            echo "V2 Hunt UI contract is already applied."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ui/src/lib/api.ts ui/src/app/hunt/page.tsx scanner/entrypoint.sh
          git commit -m 'fix(hunt): submit explicit v2 policy from UI'
          git push origin HEAD:v2
