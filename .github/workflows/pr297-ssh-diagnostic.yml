name: PR297 SSH diagnostic
on:
  pull_request:
    branches: [codex/network-worker-defaults]
    paths:
      - '.github/workflows/pr297-ssh-diagnostic.yml'
      - 'api/capabilities/ssh*'
      - 'tests/ssh*'
      - 'tests/test_target_asset_ssh_runtime_postgres.py'
permissions:
  contents: read
jobs:
  real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ssh-ci-only
          POSTGRES_DB: hunt_ssh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hunt_ssh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TARGET_ASSET_TEST_DATABASE_URL: postgresql://postgres:ssh-ci-only@127.0.0.1:5432/hunt_ssh_test
      SSH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SSH_TIMING_OUTPUT_DIR: artifacts/ssh-timings
      PYTHONPATH: .:api:scanner
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Run the actual first SSH scenario with a diagnostic deadline
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/pr297-ssh-integration.patch').read_text().replace('\n diff --git','\ndiff --git')
          Path('/tmp/integration.patch').write_text(text)
          PY
          git apply --index --unidiff-zero /tmp/integration.patch
          set -o pipefail
          timeout -s ABRT -k 5 90 python -X faulthandler -m pytest -vv -s -x -o faulthandler_timeout=40 'tests/test_target_asset_ssh_runtime_postgres.py::test_hunt_direct_ssh_reuses_streams_cancels_and_revalidates[network-ssh_password]' --junitxml=artifacts/diagnostic.xml 2>&1 | tee artifacts/diagnostic.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr297-ssh-diagnostic-${{ github.sha }}
          path: |
            artifacts/diagnostic.log
            artifacts/diagnostic.xml
            artifacts/ssh-timings
          retention-days: 3
          if-no-files-found: error
