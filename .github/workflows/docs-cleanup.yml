name: Docs cleanup maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/generate_install_manifest.py
      - run: python scripts/check_documentation_policy.py
      - run: python scripts/generate_install_manifest.py --check
      - name: Commit generated manifest
        run: |
          if git diff --quiet -- install/MANIFEST.sha256; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/MANIFEST.sha256
          git commit -m "build: refresh installer manifest"
          git push origin HEAD:${{ github.ref_name }}
