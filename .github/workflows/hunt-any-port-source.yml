name: Hunt any-port source snapshot
on:
  push:
    branches: [fix/hunt-any-port-remove-dead-lab]
    paths: [.github/workflows/hunt-any-port-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hunt-any-port-source-${{ github.sha }}
          path: source.tar.gz
          retention-days: 1
