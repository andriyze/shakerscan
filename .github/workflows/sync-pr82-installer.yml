name: Sync PR82 hosted installer
on:
  push:
    branches: [feature/hunt-investigation-improvements]
    paths: [.github/workflows/sync-pr82-installer.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/hunt-investigation-improvements
          fetch-depth: 0
      - name: Synchronize hosted installer and manifest
        shell: bash
        run: |
          cmp -s install/index.sh install/index.html && { echo 'hosted installer already synchronized'; exit 1; } || true
          cp install/index.sh install/index.html
          python3 scripts/generate_install_manifest.py
          cmp -s install/index.sh install/index.html
          grep -F 'scanner/scanner_tools/xss_evidence.py' install/index.html >/dev/null
          git diff --check
      - name: Commit generated outputs only
        shell: bash
        run: |
          rm .github/workflows/sync-pr82-installer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install/index.html install/MANIFEST.sha256 .github/workflows/sync-pr82-installer.yml
          git commit -m 'fix(hunt): synchronize hosted installer contract'
          git push origin HEAD:feature/hunt-investigation-improvements
