# Temporary authoring job. Remove after reviewed candidate blobs are committed.
# Only learning/UI/runtime-test changes; no SSH execution implementation is included.
name: PR297 learning reconciliation
on:
  pull_request:
    branches: [main, codex/network-worker-defaults]
    paths: ['.github/pr297-learning-edits.json', '.github/workflows/pr297-learning-reconciliation.yml', 'tests/test_target_asset_planner_runtime_postgres.py']
permissions:
  contents: read
concurrency:
  group: pr297-learning-reconciliation
  cancel-in-progress: true
jobs:
  candidate:
    if: github.repository == 'andriyze/shakerscan' && github.event.pull_request.number == 297 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/hunt-aisvs-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: learning-ci-only
          POSTGRES_DB: hunt_learning_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hunt_learning_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TARGET_ASSET_TEST_DATABASE_URL: postgresql://postgres:learning-ci-only@127.0.0.1:5432/hunt_learning_test
      PYTHONPATH: .:api:scanner
      REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Reconcile exact reviewed learning edits
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          changes=json.loads(Path('.github/pr297-learning-edits.json').read_text())
          assert len(changes)==13
          for name,item in changes.items():
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              text=path.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==item['before'], name
              for start,end,value in reversed(item['edits']):
                  assert 0 <= start <= end <= len(text)
                  text=text[:start]+value+text[end:]
              assert hashlib.sha256(text.encode()).hexdigest()==item['after'], name
              path.write_text(text)
          PY
          python scripts/generate_public_api_contract.py
          python scripts/generate_hunt_contract.py
          python scripts/generate_capability_inventory.py
          python scripts/generate_install_manifest.py
          python scripts/check_documentation_policy.py
          python scripts/check_module_size.py
      - name: Actual Hunt runtime and PostgreSQL acceptance
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_target_asset_planner_runtime_postgres.py tests/test_target_asset_instruction_trust_postgres.py tests/test_target_asset_skill_postgres.py tests/test_target_instruction_trust.py tests/test_hunt_metadata_defaults.py tests/test_e2e_network_readiness.py --junitxml=artifacts/learning-runtime.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=ET.parse('artifacts/learning-runtime.xml').findall('testsuite')
          assert sum(int(s.get('tests','0')) for s in suites)>=35
          assert sum(int(s.get('skipped','0')) for s in suites)==0
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm --prefix ui ci
      - name: Validate UI contracts
        working-directory: ui
        run: |
          npx tsc --noEmit
          npm run test:unit
      - name: Export source candidates for independent review
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          changes=json.loads(Path('.github/pr297-learning-edits.json').read_text())
          names=list(changes)+['docs/generated/public-openapi-manifest.json','ui/src/lib/publicApi.generated.ts','ui/src/lib/huntContract.generated.ts','docs/functionality-reference.md','install/MANIFEST.sha256']
          manifest={'head_sha':os.environ['REVIEW_HEAD'],'files':{}}
          root=Path('artifacts/candidate')
          for name in names:
              raw=Path(name).read_bytes()
              digest=hashlib.sha256(raw).hexdigest()
              if name in changes: assert digest==changes[name]['after'],name
              output=root/'tree'/name
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(raw)
              manifest['files'][name]={'sha256':digest,'bytes':len(raw)}
          (root/'index.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr297-learning-candidate-${{ github.sha }}
          path: artifacts/candidate
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr297-learning-tests-${{ github.sha }}
          path: artifacts/learning-runtime.xml
          retention-days: 3
          if-no-files-found: warn

  immutable-blobs:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr297-learning-candidate-${{ github.sha }}
          path: candidate
      - name: Store immutable review candidates, never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          allowed={'.github/workflows/hunt-aisvs-regressions.yml','AGENTS.md','api/hunt/run_service.py','api/targets/asset_inventory.py','skills/hunt/SKILL.md','tests/test_target_asset_instruction_trust_postgres.py','tests/test_target_asset_skill_postgres.py','ui/src/app/hunt/page.tsx','ui/src/components/targets/TargetSkillEditor.tsx','ui/src/lib/targetInstructionState.mjs','ui/src/lib/targetInstructionState.test.mjs','ui/src/lib/targetSkillApi.ts','ui/tests/browser/target-skill.spec.ts','docs/generated/public-openapi-manifest.json','ui/src/lib/publicApi.generated.ts','ui/src/lib/huntContract.generated.ts','docs/functionality-reference.md','install/MANIFEST.sha256'}
          root=Path('candidate');index=json.loads((root/'index.json').read_text())
          assert index['head_sha']==os.environ['REVIEW_HEAD'] and set(index['files'])==allowed
          result={'head_sha':index['head_sha'],'files':{}}
          for name,item in index['files'].items():
              path=root/'tree'/name
              assert path.is_file() and not path.is_symlink() and path.stat().st_size<2000000
              raw=path.read_bytes();assert hashlib.sha256(raw).hexdigest()==item['sha256'] and len(raw)==item['bytes']
              payload=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/andriyze/shakerscan/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response: sha=json.load(response)['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              result['files'][name]={'sha':sha,**item}
          Path('blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr297-learning-blob-ids-${{ github.sha }}
          path: blobs.json
          retention-days: 3
          if-no-files-found: error
