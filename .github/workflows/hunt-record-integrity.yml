name: Hunt record integrity

on:
  push:
    branches: [main, feat/2.3.0-dast-recall]
    paths:
      - 'api/hunt/**'
      - 'api/investigation_candidates.py'
      - 'scripts/*hunt*'
      - 'tests/test_authorization*'
      - 'tests/test_hunt*'
      - 'ui/**'
      - '.github/workflows/hunt-record-integrity.yml'
  pull_request:
    paths:
      - 'api/hunt/**'
      - 'api/investigation_candidates.py'
      - 'scripts/*hunt*'
      - 'tests/test_authorization*'
      - 'tests/test_hunt*'
      - 'ui/**'
      - '.github/workflows/hunt-record-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunt-record-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-records:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hunt_records
          POSTGRES_PASSWORD: hunt-records-disposable-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d hunt_records'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HUNT_TEST_POSTGRES_DSN: postgresql://postgres:hunt-records-disposable-ci@127.0.0.1:5432/hunt_records
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install the locked dependency set
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Check retained records, real PostgreSQL locks, and offline scoring
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/hunt-records.xml \
            tests/test_authorization_candidate_materialization.py \
            tests/test_authorization_candidate_history.py \
            tests/test_authorization_history_projection.py \
            tests/test_authorization_review_routes.py \
            tests/test_authorization_candidate_postgres.py \
            tests/test_hunt_knowledge_pages.py \
            tests/test_hunt_graph_projection.py \
            tests/test_hunt_investigation_score.py \
            tests/test_hunt_review_metrics.py
          python scripts/check_module_size.py
      - name: Retain the test result for this exact revision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hunt-record-integrity-${{ github.sha }}
          path: artifacts/hunt-records.xml
          if-no-files-found: error
          retention-days: 14
  review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm --prefix ui test
      - run: npm --prefix ui run build
