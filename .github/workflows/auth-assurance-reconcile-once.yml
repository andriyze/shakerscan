name: Auth assurance reconcile once

on:
  push:
    branches: ["auth-assurance/pr"]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[auth-reconcile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: auth-assurance/pr
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Restore corrected-main ASM semantics while retaining assurance wiring
        run: |
          git fetch origin main
          git show origin/main:api/api.py > /tmp/api-main.py
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/api-main.py').read_text(encoding='utf-8')
          needle = 'app.include_router(credential_router)\n'
          addition = '''app.include_router(credential_router)\ntry:\n    from authenticated_assurance.router import router as authenticated_assurance_router, configure_assurance_engine\nexcept ModuleNotFoundError:\n    from api.authenticated_assurance.router import router as authenticated_assurance_router, configure_assurance_engine\napp.include_router(authenticated_assurance_router)\n'''
          if needle not in text: raise SystemExit('credential router marker missing')
          text = text.replace(needle, addition, 1)
          needle = 'configure_credential_api(approval_validator=_validate_approval_receipt_for_action)\n'
          addition = needle + 'configure_assurance_engine(approve=_validate_approval_receipt_for_action, freeze=_freeze_scan_target_binding, enqueue=lambda payload: enqueue_job(get_redis(), AGENT_TOOL_QUEUE_NAME, payload), build=expected_build_fingerprint)\n'
          if needle not in text: raise SystemExit('credential configuration marker missing')
          text = text.replace(needle, addition, 1)
          Path('api/api.py').write_text(text, encoding='utf-8')
          PY
      - name: Reconcile overlapping Scan coverage semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          adapter = Path('api/scan/action_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          marker = "    async def _observations(self, action_id: str) -> tuple[Mapping[str, Any], ...]:\n"
          if 'def _empty_slice_reason(' not in text:
              helper = '''    def _empty_slice_reason(self, manifest: ScanWorkManifest) -> str:\n        \"\"\"Do not launder an incomplete producer into clean not-applicable coverage.\"\"\"\n        if str(getattr(manifest, \"status\", \"complete\")) != \"complete\":\n            return \"dependency_incomplete\"\n        return \"not_applicable\"\n\n'''
              if marker not in text: raise SystemExit('action adapter insertion marker missing')
              text = text.replace(marker, helper + marker, 1)
          empty = '        if not rows:\n            return self._skip(action, "not_applicable")\n'
          count = text.count(empty)
          if count < 5: raise SystemExit(f'expected at least five empty-slice sites, found {count}')
          text = text.replace(empty, '        if not rows:\n            return self._skip(action, self._empty_slice_reason(manifest))\n')
          adapter.write_text(text, encoding='utf-8')

          explanation = Path('api/scan/explanation.py')
          text = explanation.read_text(encoding='utf-8')
          if '"dependency_incomplete":' not in text:
              needle = '    "dependency_failed": "A required earlier action did not complete",\n'
              addition = needle + '    "dependency_incomplete": "The action producing this work did not complete, so nothing was published for this batch",\n    "dependency_private_state_unavailable": "Private state from an earlier action was not available to this worker",\n'
              if needle not in text: raise SystemExit('explanation marker missing')
              text = text.replace(needle, addition, 1)
          explanation.write_text(text, encoding='utf-8')

          finalizer = Path('api/scan/finalizer.py')
          text = finalizer.read_text(encoding='utf-8')
          start = text.find('_PROOF_UNAVAILABLE_REASONS'); end = text.find('_PROOF_CAPABILITIES', start)
          if start < 0 or end < 0: raise SystemExit('proof unavailable block missing')
          if '"dependency_incomplete"' not in text[start:end]:
              needle = '    "placement_unavailable",\n'; pos = text.find(needle, start, end)
              if pos < 0: raise SystemExit('proof unavailable insertion marker missing')
              text = text[:pos] + needle + '    "dependency_incomplete",\n' + text[pos + len(needle):]
          finalizer.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate installer manifest
        run: python scripts/generate_install_manifest.py
      - name: Validate reconciled tree with repository canonical runner
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          python scripts/run_complete_python_suite.py
      - name: Commit reconciled tree and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/auth-assurance-reconcile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/api.py api/scan/action_adapter.py api/scan/explanation.py api/scan/finalizer.py install/MANIFEST.sha256
          git diff --cached --check
          git commit -m "fix(auth): complete corrected-main reconciliation [auth-reconcile]"
          git push origin HEAD:auth-assurance/pr
