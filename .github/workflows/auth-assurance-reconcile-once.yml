name: Auth assurance reconcile once

on:
  push:
    branches: ["auth-assurance/pr"]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[auth-reconcile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: auth-assurance/pr
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Reconcile overlapping Scan semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=None):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              found = text.count(old)
              if found == 0:
                  raise SystemExit(f"expected reconciliation marker missing in {path}")
              if count is not None and found != count:
                  raise SystemExit(f"expected {count} markers in {path}, found {found}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          adapter = Path("api/scan/action_adapter.py")
          text = adapter.read_text(encoding="utf-8")
          marker = "    async def _observations(self, action_id: str) -> tuple[Mapping[str, Any], ...]:\n"
          if "def _empty_slice_reason(" not in text:
              helper = '''    def _empty_slice_reason(self, manifest: ScanWorkManifest) -> str:\n        \"\"\"Do not launder an incomplete producer into clean not-applicable coverage.\"\"\"\n        if str(getattr(manifest, \"status\", \"complete\")) != \"complete\":\n            return \"dependency_incomplete\"\n        return \"not_applicable\"\n\n'''
              if marker not in text:
                  raise SystemExit("action adapter insertion marker missing")
              text = text.replace(marker, helper + marker, 1)
          empty = '        if not rows:\n            return self._skip(action, "not_applicable")\n'
          occurrences = text.count(empty)
          if occurrences < 5:
              raise SystemExit(f"expected at least five empty-slice markers, found {occurrences}")
          text = text.replace(empty, '        if not rows:\n            return self._skip(action, self._empty_slice_reason(manifest))\n')
          adapter.write_text(text, encoding="utf-8")

          explanation = Path("api/scan/explanation.py")
          text = explanation.read_text(encoding="utf-8")
          if '"dependency_incomplete":' not in text:
              needle = '    "dependency_failed": "A required earlier action did not complete",\n'
              addition = needle + '    "dependency_incomplete": "The action producing this work did not complete, so nothing was published for this batch",\n    "dependency_private_state_unavailable": "Private state from an earlier action was not available to this worker",\n'
              if needle not in text:
                  raise SystemExit("explanation reason marker missing")
              text = text.replace(needle, addition, 1)
          explanation.write_text(text, encoding="utf-8")

          finalizer = Path("api/scan/finalizer.py")
          text = finalizer.read_text(encoding="utf-8")
          block = '_PROOF_UNAVAILABLE_REASONS = frozenset({\n    "insufficient_plan_budget",\n    "placement_unavailable",\n'
          if '"dependency_incomplete"' not in text[text.find('_PROOF_UNAVAILABLE_REASONS'):text.find('_PROOF_CAPABILITIES')]:
              if block not in text:
                  raise SystemExit("finalizer proof-unavailable marker missing")
              text = text.replace(block, block + '    "dependency_incomplete",\n', 1)
          finalizer.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate installer manifest
        run: python scripts/generate_install_manifest.py
      - name: Run reconciliation regressions
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          python -m pytest -q -p no:cacheprovider tests/test_auth_assurance_main_reconciliation.py tests/test_asm_dispatch_backoff.py tests/test_scan_action_adapter.py tests/test_scan_family_coverage.py
      - name: Commit reconciled tree and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/auth-assurance-reconcile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/scan/action_adapter.py api/scan/explanation.py api/scan/finalizer.py install/MANIFEST.sha256
          git commit -m "fix(auth): reconcile corrected-main scan coverage semantics [auth-reconcile]"
          git push origin HEAD:auth-assurance/pr
