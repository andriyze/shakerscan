name: Service Intelligence finalize
on:
  push:
    branches: [feat/service-intelligence]
    paths: ['.github/workflows/service-intelligence-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { ref: feat/service-intelligence, fetch-depth: 0 }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: '3.12' }
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Regenerate and verify
        run: |
          python scripts/generate_capability_inventory.py
          python scripts/generate_public_api_contract.py
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_public_api_contract.py --check
      - name: Commit final generated state and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/service-intelligence-finalize.yml
          git add docs/functionality-reference.md docs/generated/public-openapi-manifest.json ui/src/lib/publicApi.generated.ts tests/fixtures/api_contract || true
          git diff --cached --check
          git commit -m 'chore: finalize Service Intelligence contracts after main sync'
          git push origin HEAD:refs/heads/feat/service-intelligence
