name: PR297 direct SSH integration

on:
  pull_request:
    branches: [codex/network-worker-defaults]
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/pr297-ssh-integration.patch'
      - '.github/pr297-ssh-stream-fix.patch'
      - '.github/workflows/pr297-ssh-reconcile.yml'

permissions:
  contents: read

concurrency:
  group: pr297-ssh-authoring-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'andriyze/shakerscan' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/hunt-aisvs-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ssh-ci-only
          POSTGRES_DB: hunt_ssh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hunt_ssh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TARGET_ASSET_TEST_DATABASE_URL: postgresql://postgres:ssh-ci-only@127.0.0.1:5432/hunt_ssh_test
      SSH_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SSH_TIMING_OUTPUT_DIR: artifacts/ssh-timings
      PYTHONPATH: .:api:scanner
      REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Apply explicit integration edits against exact Git preimages
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, re
          patch = Path('.github/pr297-ssh-integration.patch').read_text()
          patch = patch.replace('\n diff --git', '\ndiff --git')
          patch += '\n' + Path('.github/pr297-ssh-stream-fix.patch').read_text()
          Path('/tmp/ssh-integration.patch').write_text(patch)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero','/tmp/ssh-integration.patch'],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero','/tmp/ssh-integration.patch'],check=True)
          for part in patch.split('diff --git ')[1:]:
              path = part.split('\n',1)[0].split(' b/',1)[1]
              expected = re.search(r'^index [0-9a-f]+\.\.([0-9a-f]+)',part,re.M)[1]
              actual = subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual == expected, path
          PY
          python scripts/generate_public_api_contract.py
          python scripts/generate_hunt_contract.py
          python scripts/generate_capability_inventory.py
          python scripts/generate_install_manifest.py
      - name: Run actual SSH commands through API, database, queue, worker and TLS gateway
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_hunt_stream_body_limit.py tests/test_hunt_ssh_commands.py tests/test_api_stream.py tests/test_target_asset_ssh_runtime_postgres.py tests/test_hunt_network_reservations.py --junitxml=artifacts/ssh-runtime.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites=ET.parse('artifacts/ssh-runtime.xml').findall('testsuite')
          assert sum(int(s.get('tests','0')) for s in suites)>=39
          assert sum(int(s.get('skipped','0')) for s in suites)==0
          PY
      - name: Check installation, generated sources and implementation limits
        run: |
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/generate_public_api_contract.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
      - name: Export exact candidate source for independent review
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          files = subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          assert all(p.startswith(('api/','scripts/','tests/','docs/','skills/','install/','ui/','.github/workflows/')) or p=='AGENTS.md' for p in files)
          root=Path('artifacts/ssh-candidate');root.mkdir(parents=True)
          index={'head_sha':os.environ['REVIEW_HEAD'],'files':{}}
          for name in files:
              path=Path(name)
              assert path.is_file() and not path.is_symlink() and '..' not in path.parts
              content=path.read_bytes()
              dest=root/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(content)
              blob=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              mode=subprocess.check_output(['git','ls-files','-s',name],text=True).split()[0]
              index['files'][name]={'sha':blob,'sha256':hashlib.sha256(content).hexdigest(),'mode':mode}
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','rm','--cached','.github/pr297-ssh-integration.patch','.github/pr297-ssh-stream-fix.patch','.github/workflows/pr297-ssh-reconcile.yml','.github/workflows/pr297-ssh-diagnostic.yml'],check=True)
          index['final_tree_sha']=subprocess.check_output(['git','write-tree'],text=True).strip()
          (root/'index.json').write_text(json.dumps(index,indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar',index['final_tree_sha'],'-o','artifacts/ssh-candidate-source.tar'],check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr297-ssh-candidate-${{ github.sha }}
          path: artifacts/ssh-candidate
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr297-ssh-evidence-${{ github.sha }}
          path: |
            artifacts/ssh-runtime.xml
            artifacts/ssh-timings
            artifacts/ssh-candidate-source.tar
          retention-days: 3
          if-no-files-found: error

  immutable-blobs:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr297-ssh-candidate-${{ github.sha }}
          path: candidate
      - name: Store candidate files as immutable Git blobs; never change commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, urllib.request
          root=Path('candidate'); index=json.loads((root/'index.json').read_text())
          assert index['head_sha']==os.environ['REVIEW_HEAD']
          for name,item in index['files'].items():
              path=root/name
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              assert name.startswith(('api/','scripts/','tests/','docs/','skills/','install/','ui/','.github/workflows/')) or name=='AGENTS.md'
              assert path.is_file() and not path.is_symlink() and path.stat().st_size<5000000
              content=path.read_bytes()
              assert hashlib.sha256(content).hexdigest()==item['sha256']
              expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              assert expected==item['sha'] and item['mode'] in {'100644','100755'}
              payload=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request('https://api.github.com/repos/andriyze/shakerscan/git/blobs',
                  data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Content-Type':'application/json','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert json.load(response)['sha']==expected
          Path('blobs.json').write_text(json.dumps(index,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr297-ssh-blob-ids-${{ github.sha }}
          path: blobs.json
          retention-days: 3
          if-no-files-found: error
