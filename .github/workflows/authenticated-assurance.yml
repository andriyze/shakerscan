name: Authenticated assurance acceptance

on:
  pull_request:
    paths:
      - 'api/**'
      - 'scanner/**'
      - 'tests/**'
      - 'scripts/**'
      - 'install/**'
      - '.github/workflows/authenticated-assurance.yml'
  push:
    branches: [main, 'auth-assurance/pr']

permissions:
  contents: read

concurrency:
  group: authenticated-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: api:scanner:.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive the exact tested source for reproducible failures
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assurance-source-${{ github.sha }}
          path: |
            artifacts/source-commit.txt
            artifacts/source.tar.gz
          retention-days: 3
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Start explicitly disposable restore fixture
        run: |
          container="assurance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "ASSURANCE_TEST_POSTGRES_CONTAINER=$container" >> "$GITHUB_ENV"
          docker run --detach --rm --name "$container" \
            --label shakerscan.assurance_restore_fixture=true \
            --publish 127.0.0.1::5432 \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --env POSTGRES_DB=shakerscan_assurance_test postgres:16
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$container")
          echo "ASSURANCE_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:${port}/shakerscan_assurance_test" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d shakerscan_assurance_test; then exit 0; fi
            sleep 2
          done
          echo 'Disposable assurance database did not become ready' >&2
          exit 1
      - name: Real database, worker, interruption, and dump/restore acceptance
        run: |
          python -m pytest -q \
            tests/test_authenticated_assurance_postgres.py \
            tests/test_authenticated_validation_worker.py \
            tests/test_scan_authentication_health.py \
            tests/test_authenticated_assurance_restore.py \
            --junitxml=artifacts/assurance-acceptance.xml
      - name: Require every acceptance module to execute without skips
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('artifacts/assurance-acceptance.xml')
          if not report.is_file():
              raise SystemExit('Required assurance acceptance produced no report')
          cases = list(ET.parse(report).getroot().iter('testcase'))
          required = (
              'test_authenticated_assurance_postgres',
              'test_authenticated_validation_worker',
              'test_scan_authentication_health',
              'test_authenticated_assurance_restore',
          )
          for module in required:
              selected = [case for case in cases if case.get('classname', '').split('.')[-1] == module]
              if not selected or any(case.find('skipped') is not None for case in selected):
                  raise SystemExit(f'Required assurance module did not run fully: {module}')
          if any(case.find('failure') is not None or case.find('error') is not None for case in cases):
              raise SystemExit('Assurance acceptance failed')
          print(f'{len(cases)} assurance acceptance cases executed without skips')
          PY
      - name: Verify installer manifest
        if: always()
        run: python scripts/generate_install_manifest.py --check
      - name: Stop only this run's disposable database
        if: always()
        run: |
          if [ -n "${ASSURANCE_TEST_POSTGRES_CONTAINER:-}" ]; then
            docker rm --force "$ASSURANCE_TEST_POSTGRES_CONTAINER"
          fi
      - name: Upload acceptance results (never database dumps or keys)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assurance-acceptance-${{ github.sha }}
          path: artifacts/assurance-acceptance.xml
          retention-days: 3
          if-no-files-found: warn
