name: APT source consistency validation
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths: ['.github/workflows/apt-source-validation.yml']
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        transport: [http, https]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compare the official source transport on the unchanged pinned runtime
        env:
          TRANSPORT: ${{ matrix.transport }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          base="$(awk '$1=="FROM" && $2 ~ /^mcr.microsoft.com\/playwright\/python:/ {print $2}' scanner/Dockerfile)"
          test -n "$base"
          docker run --rm --entrypoint /bin/bash -e TRANSPORT "$base" -ceu '
            echo "=== Existing package versions and sources ==="
            dpkg-query -W libexpat1 ca-certificates || true
            cat /etc/apt/sources.list.d/ubuntu.sources
            if [ "$TRANSPORT" = https ]; then
              test -s /etc/ssl/certs/ca-certificates.crt
              sed -i -e "s|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g" \
                -e "s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g" \
                -e "s|http://ports.ubuntu.com/ubuntu-ports|https://ports.ubuntu.com/ubuntu-ports|g" \
                /etc/apt/sources.list.d/ubuntu.sources
            fi
            rm -rf /var/lib/apt/lists/*
            apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 \
              -o Acquire::http::No-Cache=true -o Acquire::https::No-Cache=true update
            echo "=== Candidates from freshly verified indexes ==="
            apt-cache policy libexpat1 libexpat1-dev
            apt-get -y --download-only --no-install-recommends install \
              ca-certificates curl nmap openssl bind9-dnsutils jq git bash make gcc libpcap0.8 \
              iputils-ping dnsutils procps coreutils nikto masscan whois netcat-openbsd \
              traceroute dirb gobuster hydra medusa dnsrecon libcurl4-openssl-dev libssl-dev \
              python3-dev python3-venv bsdmainutils
          ' 2>&1 | tee "artifacts/apt-$TRANSPORT.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: apt-source-${{ matrix.transport }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 3
