name: Temporary generated-artifact refresh
on:
  push:
    branches: [docs/adr-0004-device-targets]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Regenerate committed contracts
        run: |
          python scripts/generate_capability_inventory.py
          python scripts/generate_public_api_contract.py
          SHAKERSCAN_UPDATE_API_CONTRACT=1 python -m pytest -q tests/test_api_characterization.py
          python scripts/generate_install_manifest.py
      - name: Commit generated artifacts when changed
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add docs/functionality-reference.md docs/generated/public-openapi-manifest.json ui/src/lib/publicApi.generated.ts tests/fixtures/api_contract install/MANIFEST.sha256
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(generated): refresh target-unification contracts"
          git push origin HEAD:docs/adr-0004-device-targets
