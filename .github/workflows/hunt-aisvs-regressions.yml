name: Hunt AISVS boundaries

on:
  pull_request:
    branches: [main, codex/network-worker-defaults]
    paths:
      - 'api/hunt/**'
      - 'api/targets/**'
      - 'tests/test_hunt*'
      - 'tests/test_target*'
      - 'docs/hunt-aisvs-boundaries.md'
      - '.github/workflows/hunt-aisvs-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunt-aisvs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the exact reviewed source, without runtime data or credentials
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-revision.txt
          git archive --format=tar HEAD -o artifacts/source.tar
          sha256sum artifacts/source.tar > artifacts/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunt-aisvs-source-${{ github.sha }}
          path: |
            artifacts/source.tar
            artifacts/source.sha256
            artifacts/source-revision.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Exercise existing metadata, SSH and instruction contracts
        env:
          PYTHONPATH: .:api:scanner
        run: |
          python -m pytest -q tests/test_hunt_metadata_defaults.py tests/test_hunt_ssh_trust.py tests/test_target_skill_contract.py tests/test_e2e_network_readiness.py --junitxml=artifacts/hunt-aisvs.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hunt-aisvs-results-${{ github.sha }}
          path: artifacts/hunt-aisvs.xml
          retention-days: 7
          if-no-files-found: error
