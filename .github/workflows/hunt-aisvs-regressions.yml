name: Hunt AISVS boundaries

on:
  pull_request:
    branches: [main, codex/network-worker-defaults]
    paths:
      - 'api/hunt/**'
      - 'api/targets/**'
      - 'tests/test_hunt*'
      - 'tests/test_target*'
      - 'docs/hunt-aisvs-boundaries.md'
      - 'ui/src/lib/targetInstruction*'
      - 'ui/src/lib/targetSkillApi.ts'
      - 'ui/src/components/targets/TargetSkillEditor.tsx'
      - '.github/workflows/hunt-aisvs-regressions.yml'
      - '.github/aisvs-doc-edits.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunt-aisvs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the exact reviewed source, without runtime data or credentials
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-revision.txt
          git archive --format=tar HEAD -o artifacts/source.tar
          sha256sum artifacts/source.tar > artifacts/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunt-aisvs-source-${{ github.sha }}
          path: |
            artifacts/source.tar
            artifacts/source.sha256
            artifacts/source-revision.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Exercise existing metadata, SSH and instruction contracts
        env:
          PYTHONPATH: .:api:scanner
        run: |
          python -m pytest -q tests/test_hunt_metadata_defaults.py tests/test_hunt_ssh_trust.py tests/test_target_skill_contract.py tests/test_e2e_network_readiness.py tests/test_target_instruction_trust.py tests/test_hunt_planner_gateway.py tests/test_hunt_planner_gateway_https.py --junitxml=artifacts/hunt-aisvs.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hunt-aisvs-results-${{ github.sha }}
          path: artifacts/hunt-aisvs.xml
          retention-days: 7
          if-no-files-found: error

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - name: Type-check and test the instruction editor
        working-directory: ui
        run: |
          npx tsc --noEmit
          npm run test:unit
          npx playwright install --with-deps chromium
          npm run build
          npm run start > /tmp/hunt-instruction-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/targets >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/targets >/dev/null
          npx playwright test tests/browser/target-skill.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hunt-instruction-editor-${{ github.sha }}
          path: |
            ui/test-results
            ui/playwright-report
          retention-days: 7
          if-no-files-found: warn

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Export generated contracts for independent review, not automatic approval
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          edits = json.loads(Path('.github/aisvs-doc-edits.json').read_text())
          assert {item['path'] for item in edits} == {'AGENTS.md', 'skills/hunt/SKILL.md'}
          for item in edits:
              path = Path(item['path'])
              text = path.read_text()
              assert hashlib.sha256(text.encode()).hexdigest() == item['before_sha256']
              assert text.count(item['old']) == 1
              updated = text.replace(item['old'], item['new'])
              assert hashlib.sha256(updated.encode()).hexdigest() == item['after_sha256']
              path.write_text(updated)
          PY
          python scripts/generate_public_api_contract.py
          python scripts/generate_install_manifest.py
          mkdir -p artifacts/contracts
          cp docs/generated/public-openapi-manifest.json artifacts/contracts/
          cp ui/src/lib/publicApi.generated.ts artifacts/contracts/
          cp install/MANIFEST.sha256 artifacts/contracts/
          cp AGENTS.md artifacts/contracts/
          cp skills/hunt/SKILL.md artifacts/contracts/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('artifacts/contracts')
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()}
          (root/'index.json').write_text(json.dumps({'head_sha':os.environ['REVIEW_HEAD'], 'files':files}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunt-aisvs-contracts-${{ github.sha }}
          path: artifacts/contracts
          retention-days: 7
          if-no-files-found: error

  # Temporary authoring bridge: immutable generated blobs only, never commits or refs.
  # This job is removed after the generated outputs have been independently reviewed.
  generated-blobs:
    needs: contracts
    if: github.event_name == 'pull_request' && github.repository == 'andriyze/shakerscan' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/hunt-aisvs-boundaries'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: hunt-aisvs-contracts-${{ github.sha }}
          path: contracts
      - name: Store reviewed-output candidates as immutable blobs (no checkout or source execution)
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          root = Path('contracts')
          names = {'public-openapi-manifest.json':'docs/generated/public-openapi-manifest.json',
                   'publicApi.generated.ts':'ui/src/lib/publicApi.generated.ts',
                   'MANIFEST.sha256':'install/MANIFEST.sha256',
                   'AGENTS.md':'AGENTS.md', 'SKILL.md':'skills/hunt/SKILL.md'}
          index = json.loads((root/'index.json').read_text())
          assert index['head_sha'] == os.environ['REVIEW_HEAD'] and set(index['files']) == set(names)
          result = {'head_sha':index['head_sha'], 'files':{}}
          for name, path in names.items():
              file = root/name
              assert file.is_file() and not file.is_symlink() and file.stat().st_size < 1000000
              content = file.read_bytes()
              digest = hashlib.sha256(content).hexdigest()
              assert digest == index['files'][name]
              payload = json.dumps({'content':base64.b64encode(content).decode(), 'encoding':'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/andriyze/shakerscan/git/blobs',
                  data=payload, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              assert sha == hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
              result['files'][path] = {'sha':sha,'sha256':digest}
          Path('blobs.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunt-aisvs-blob-ids-${{ github.sha }}
          path: blobs.json
          retention-days: 3
          if-no-files-found: error
