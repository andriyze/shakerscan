name: Temporary PR implementation workspace
on:
  push:
    branches: [work/pr294-target-unification]
permissions:
  contents: write
jobs:
  implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Apply reviewed source transformations on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = work/pr294-target-unification
          if test -f .implementation/apply.py; then
            python3 .implementation/apply.py
            git diff --check
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name='ChatGPT' -c user.email='noreply@openai.com' commit -m 'feat(targets): materialize reviewed unified-asset implementation'
              git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            fi
            echo "IMPLEMENTATION_COMMIT=$(git rev-parse HEAD)"
          fi
      - name: Set up supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Run implementation checks
        shell: bash
        run: bash .implementation/check.sh
