name: Budget continuation exact-tree validation
on:
  push:
    branches: [feat/hunt-operator-workflows]
    paths:
      - 'scripts/budget-batch/**'
      - '.github/workflows/budget-batch-validation.yml'
permissions:
  contents: read
concurrency:
  group: budget-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hunt_records
          POSTGRES_PASSWORD: budget-disposable-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hunt_records"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve reviewed inputs and select their pinned parent
        run: |
          cp -R scripts/budget-batch /tmp/budget-batch
          git checkout --detach 76653d344228eed9ce1cdfe59786a230ce119eb0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked dependencies and native tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
      - name: Reconstruct and verify the exact reviewed product tree
        run: |
          python /tmp/budget-batch/assemble.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Local exact-tree budget validation snapshot; no ref publication'
      - name: Validate generators and architectural contracts
        run: |
          python scripts/check_hunt_methodologies.py
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_documentation_policy.py
          python scripts/check_module_size.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
          git diff --check 76653d344228eed9ce1cdfe59786a230ce119eb0 HEAD
      - name: Real PostgreSQL extension, concurrency, cancellation and reload
        env:
          PYTHONPATH: .:api:scanner
          HUNT_TEST_POSTGRES_DSN: postgresql://postgres:budget-disposable-ci@127.0.0.1:5432/hunt_records
        run: |
          mkdir -p /tmp/budget-results
          python -m pytest -q tests/test_hunt_budget_amendments.py tests/test_hunt_budget_amendments_postgres.py --junitxml=/tmp/budget-results/budget-postgres.xml
      - name: Native NSE without optional skips
        env:
          PYTHONPATH: .:api:scanner
          SHAKERSCAN_REQUIRE_NATIVE_NSE: '1'
        run: python -m pytest -q tests/integration/test_hunt_nse_native.py tests/test_hunt_nse_http.py tests/test_hunt_nse_capability.py --junitxml=/tmp/budget-results/native-nse.xml
      - name: Complete locked Python suite
        run: python scripts/run_complete_python_suite.py --artifacts-dir /tmp/budget-results
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI tests and production build
        run: |
          npm ci --prefix ui
          npm --prefix ui test
          npm --prefix ui run build
      - name: Desktop and mobile budget continuation acceptance
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: |
          cd ui
          npx playwright install --with-deps chromium
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/budget-results/ui-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3100/hunt >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3100/hunt >/dev/null
          npx playwright test tests/browser/hunt-budget-amendments.spec.ts
          cp test-results/browser-results.json /tmp/budget-results/browser-results.json
      - name: Export verified blobs only after every check passes
        env:
          EXPORT_TOKEN: ${{ github.token }}
        run: python /tmp/budget-batch/export.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: budget-batch-validation
          path: |
            /tmp/budget-results
            ui/test-results
          if-no-files-found: warn
          retention-days: 7
