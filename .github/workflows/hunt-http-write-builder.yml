name: Temporary Hunt HTTP write authoring

# Isolated authoring only. Neither this workflow nor .dev is included in PR #241.
# Output goes to a temporary result branch; the connector fast-forwards the PR
# only after reviewing the evidence. No main writes or force pushes.
on:
  push:
    branches: [build/hunt-http-write-validation]
    paths:
      - '.dev/hunt-http-write-draft/**'
      - '.github/workflows/hunt-http-write-builder.yml'
permissions:
  contents: write
concurrency:
  group: hunt-http-write-authoring
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  refine-and-validate:
    if: github.repository == 'andriyze/shakerscan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: a977b87fc506717503ab55c345ad8ba6a7633dbf
      DESTINATION: build/hunt-http-write-result
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Correct methodology and fixture contracts on exact implementation commit
        run: |
          mkdir -p "$RUNNER_TEMP/hunt-http-artifacts"
          git worktree add --detach "$RUNNER_TEMP/hunt-http-source" "$BASE"
          python .dev/hunt-http-write-draft/refine_and_test.py "$RUNNER_TEMP/hunt-http-source" "$RUNNER_TEMP/hunt-http-artifacts" refine
          python .dev/hunt-http-write-draft/repair_fixtures.py "$RUNNER_TEMP/hunt-http-source"
      - name: Install locked repository dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Regenerate and verify shipped contracts
        working-directory: ${{ runner.temp }}/hunt-http-source
        env:
          PYTHONPATH: scanner:api
        run: |
          python scripts/generate_capability_inventory.py
          python scripts/generate_scan_contract.py
          python scripts/generate_hunt_contract.py
          python scripts/generate_install_manifest.py
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
          python scripts/check_hunt_methodologies.py
      - name: Run selected complete files in repository import layouts
        run: |
          python .dev/hunt-http-write-draft/refine_and_test.py "$RUNNER_TEMP/hunt-http-source" "$RUNNER_TEMP/hunt-http-artifacts" test
      - name: Validate shared admission fixtures and replay lifecycle
        working-directory: ${{ runner.temp }}/hunt-http-source
        env:
          PYTHONPATH: scanner:api
        run: |
          python -m pytest -q tests/test_hunt_authz_verification_limit.py tests/test_hunt_replay_worker_lifecycle.py --junitxml="$RUNNER_TEMP/hunt-http-artifacts/additional-tests.xml" 2>&1 | tee "$RUNNER_TEMP/hunt-http-artifacts/additional-tests.txt"
      - name: Publish clean follow-up commit to temporary result branch
        working-directory: ${{ runner.temp }}/hunt-http-source
        run: |
          set -euo pipefail
          test -z "$(git ls-remote origin "refs/heads/$DESTINATION")"
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add tests skills docs install ui/src/lib
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(\.github/|\.dev/)'; then exit 1; fi
          git commit -m 'fix(hunt): align workflow guidance and admission test fixtures' -m 'Use the real write-authority helper in AST admission tests, schema-valid baseline inputs, and a missing FastAPI dependency marker in compatibility stubs. Add positive device PUT/idempotency and missing-authority regressions without weakening existing assertions. Focused, related and static checks passed; full PR CI and real-device pairing remain separate validation.'
          git push origin "HEAD:refs/heads/$DESTINATION"
          git rev-parse HEAD | tee "$RUNNER_TEMP/hunt-http-artifacts/implementation-sha.txt"
          git diff "$BASE" HEAD > "$RUNNER_TEMP/hunt-http-artifacts/follow-up.patch"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/hunt-http-artifacts/implementation-source.tar"
      - name: Retain exact test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hunt-http-write-isolated-${{ github.sha }}
          path: ${{ runner.temp }}/hunt-http-artifacts
          if-no-files-found: error
          retention-days: 7
