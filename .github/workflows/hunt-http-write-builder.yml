name: Temporary Hunt HTTP write authoring

# Temporary branch-only authoring job. Neither this workflow nor its applicator
# enters the implementation branch. No main push, merge, release or force-push.
on:
  push:
    branches: [build/hunt-http-write-validation]
    paths:
      - '.dev/hunt-http-write-draft/**'
      - '.github/workflows/hunt-http-write-builder.yml'

permissions:
  contents: write

concurrency:
  group: hunt-http-write-authoring
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.repository == 'andriyze/shakerscan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: 7f5920bd5f4b08fbda11222871b0e2d68e0cd755
      DESTINATION: fix/hunt-authorized-http-writes
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Apply exact-source-checked draft to detached base
        run: |
          mkdir -p "$RUNNER_TEMP/hunt-http-artifacts"
          git archive --format=tar "$BASE" -o "$RUNNER_TEMP/hunt-http-artifacts/base-source.tar"
          git worktree add --detach "$RUNNER_TEMP/hunt-http-source" "$BASE"
          python .dev/hunt-http-write-draft/apply_fix.py "$RUNNER_TEMP/hunt-http-source" --check --diff "$RUNNER_TEMP/hunt-http-artifacts/proposed.patch"
          python .dev/hunt-http-write-draft/apply_fix.py "$RUNNER_TEMP/hunt-http-source"
      - name: Install locked repository dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - name: Regenerate advertised contracts and inventory
        working-directory: ${{ runner.temp }}/hunt-http-source
        env:
          PYTHONPATH: scanner:api
        run: |
          python scripts/generate_capability_inventory.py
          python scripts/generate_scan_contract.py
          python scripts/generate_hunt_contract.py
          python scripts/generate_install_manifest.py
      - name: Focused actual-repository regressions
        id: tests
        continue-on-error: true
        working-directory: ${{ runner.temp }}/hunt-http-source
        env:
          PYTHONPATH: scanner:api
        run: |
          python -m pytest -q tests/test_hunt_http_write_contract.py tests/test_hunt_http_write_integration.py tests/test_hunt_http_capability.py --junitxml="$RUNNER_TEMP/hunt-http-artifacts/http-tests.xml" 2>&1 | tee "$RUNNER_TEMP/hunt-http-artifacts/http-tests.txt"
      - name: Static repository checks
        id: static
        continue-on-error: true
        working-directory: ${{ runner.temp }}/hunt-http-source
        env:
          PYTHONPATH: scanner:api
        run: |
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
      - name: Publish implementation only to the requested draft branch
        working-directory: ${{ runner.temp }}/hunt-http-source
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin "refs/heads/$DESTINATION" | cut -f1)"
          test "$actual" = "$BASE"
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git add api tests skills docs install
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(\.github/|\.dev/)'; then
            echo 'Authoring files must not enter the implementation commit' >&2
            exit 1
          fi
          git commit -m 'fix(hunt): enable authorized HTTP workflow writes' -m "Authoring validation: focused tests=$TEST_OUTCOME; static checks=$STATIC_OUTCOME. Draft pending full PR CI and end-to-end workflow validation."
          git push origin "HEAD:refs/heads/$DESTINATION"
          git rev-parse HEAD | tee "$RUNNER_TEMP/hunt-http-artifacts/implementation-sha.txt"
          git diff "$BASE" HEAD --stat | tee "$RUNNER_TEMP/hunt-http-artifacts/implementation-stat.txt"
          git diff "$BASE" HEAD > "$RUNNER_TEMP/hunt-http-artifacts/implementation.patch"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/hunt-http-artifacts/implementation-source.tar"
          {
            echo '## Draft implementation published'
            echo "Commit: $(git rev-parse HEAD)"
            echo "Focused tests: $TEST_OUTCOME"
            echo "Static checks: $STATIC_OUTCOME"
            echo 'Normal PR checks are unchanged. Test/static failures remain blockers, not waived checks.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source, readable patch and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hunt-http-write-authoring-${{ github.sha }}
          path: ${{ runner.temp }}/hunt-http-artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Preserve validation failure status
        if: steps.tests.outcome != 'success' || steps.static.outcome != 'success'
        run: exit 1
