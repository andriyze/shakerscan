name: PR204 service execution repair
on:
  push:
    branches: [fix/hunt-any-port-remove-dead-lab]
    paths: [.github/workflows/pr204-apply-repair.yml, .github/pr204-repair-1.b64, .github/pr204-repair-2.b64, .github/pr204-repair-3.b64, .github/pr204-followup.b64]
permissions:
  contents: write
concurrency:
  group: pr204-service-repair
  cancel-in-progress: false
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: api:scanner:.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/hunt-any-port-remove-dead-lab
          fetch-depth: 0
      - name: Apply exact reviewed patches without replacing concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          encoded=''.join(pathlib.Path(f'.github/pr204-repair-{i}.b64').read_text().strip() for i in (1,2,3))
          patches=[(encoded,'d8397f30684d3df46f7df39c10684632fd15a801e8d07f12bf629bcd1642f989'),(pathlib.Path('.github/pr204-followup.b64').read_text().strip(),'a1709e018c51ce7bd3516206aa58c2f319dc30beb66fa42526572f4c07f034ab')]
          for encoded,expected in patches:
              patch=lzma.decompress(base64.b64decode(encoded,validate=True))
              assert hashlib.sha256(patch).hexdigest()==expected
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          path=pathlib.Path('tests/test_hunt_service_postgres.py')
          source=path.read_text()
          old='configuration={}, encrypted_secret='
          assert source.count(old)==1
          path.write_text(source.replace(old,'configuration={"auth_kind": "json_login", "secret_values_visible": False}, encrypted_secret='))
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked dependencies and browser
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          python -m playwright install --with-deps chromium
      - name: Start isolated disposable PostgreSQL fixture
        run: |
          container="pr204-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "REPAIR_CONTAINER=$container" >> "$GITHUB_ENV"
          docker run -d --rm --name "$container" --publish 127.0.0.1::5432 --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_DB=shakerscan_assurance_test postgres:16
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$container")
          echo "ASSURANCE_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:${port}/shakerscan_assurance_test" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d shakerscan_assurance_test; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Regenerate public contracts and integrity manifests
        run: |
          python scripts/generate_capability_inventory.py
          python scripts/generate_scan_contract.py
          python scripts/generate_hunt_contract.py
          python scripts/generate_public_api_contract.py
          python scripts/generate_install_manifest.py
      - name: Test real service execution, database migration, and worker regressions
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_hunt_service_execution.py tests/test_hunt_service_postgres.py tests/test_auth_session_store.py tests/test_auth_session_capability.py tests/test_browser_login_action.py tests/test_browser_login_worker.py tests/test_hunt_authorization_api.py tests/test_hunt_device_parity.py tests/test_hunt_device_traffic.py tests/test_hunt_action_dispatcher.py tests/test_runtime_capabilities.py tests/test_hunt_http_capability.py tests/test_hunt_operator_execution.py tests/test_request_replay_executor.py tests/test_device_agent.py tests/test_device_safety.py tests/test_device_browser_origin.py tests/test_hunt_fragment_xss_browser_proof.py tests/test_hunt_scanner_reservations.py tests/test_credential_store.py tests/test_authorization_candidate_materialization.py tests/test_authorization_candidate_history.py --junitxml=artifacts/pr204-service-tests.xml
          python - <<'PY'
          import xml.etree.ElementTree as E
          cases=list(E.parse('artifacts/pr204-service-tests.xml').getroot().iter('testcase'))
          db=[c for c in cases if c.get('classname','').endswith('test_hunt_service_postgres')]
          assert len(db)==3 and all(c.find('skipped') is None and c.find('failure') is None and c.find('error') is None for c in db)
          print(f'{len(cases)} regression cases; all 3 real PostgreSQL cases executed')
          PY
      - name: Check generated contracts and import integrity
        run: |
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/generate_public_api_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_scan_target_transport.py
          git diff --check
      - name: Commit validated changes and remove temporary transfer files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin fix/hunt-any-port-remove-dead-lab
          test "$(git rev-parse origin/fix/hunt-any-port-remove-dead-lab)" = "$EXPECTED_HEAD"
          git rm .github/pr204-repair-1.b64 .github/pr204-repair-2.b64 .github/pr204-repair-3.b64 .github/pr204-followup.b64 .github/workflows/pr204-apply-repair.yml
          git add -u
          git add api/hunt/service_binding.py api/runtime/hunt_service_schema.py tests/test_hunt_service_execution.py tests/test_hunt_service_postgres.py
          git -c user.name='ChatGPT' -c user.email='noreply@openai.com' commit -m 'fix(hunt): complete authenticated service-port execution and device ownership'
          git push origin HEAD:fix/hunt-any-port-remove-dead-lab
          git rev-parse HEAD | tee artifacts/pr204-pushed-sha.txt
      - name: Stop only this run's disposable database
        if: always()
        run: |
          if [ -n "${REPAIR_CONTAINER:-}" ]; then docker rm --force "$REPAIR_CONTAINER"; fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr204-service-validation-${{ github.sha }}
          path: |
            artifacts/pr204-service-tests.xml
            artifacts/pr204-pushed-sha.txt
          if-no-files-found: warn
          retention-days: 3
