name: Model Intake native tools

on:
  pull_request:
    branches: [main]
    paths:
      - scanner/Dockerfile.model-intake
      - tests/test_native_tool_build_contract.py
      - .github/workflows/verify-rc-native-tools.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-intake-native-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify native scanner dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # True only when the read-only Docker Hub secrets exist; forks and Dependabot get false
      # and keep pulling anonymously, as before.
      HAS_DH_READ: ${{ secrets.DOCKERHUB_READ_USERNAME != '' && secrets.DOCKERHUB_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Docker Hub pulls go through mirror.gcr.io first, so they work without the read token.
      - name: Pull Docker Hub images through mirror.gcr.io
        uses: ./.github/actions/docker-hub-mirror
      # Authenticated, read-only Docker Hub pulls avoid the anonymous pull rate limit (429
      # toomanyrequests). Skipped, so pulls stay anonymous, when the read secrets are absent.
      - name: Log in to Docker Hub for read-only pulls
        if: env.HAS_DH_READ == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_READ_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          # The docker-container builder ignores the daemon's mirrors; give BuildKit (and
          # `buildx imagetools`, which reads this builder's registry config) the same mirror.
          # The builder's own image comes from the mirror as well, not through the daemon.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and verify patched native scanners
        # Version and dependency assertions execute inside this Dockerfile target.
        # Do not export/load the multi-GB builder merely to repeat those assertions.
        run: |
          # The same digest-pinned Go builder the Dockerfile names, fetched from Google's Docker
          # Hub mirror; the digest pin means the mirror cannot change its content.
          builder="$(sed -n 's/^ARG MODEL_INTAKE_GO_BUILDER=//p' scanner/Dockerfile.model-intake)"
          [[ "$builder" =~ ^[a-z0-9._-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::unexpected MODEL_INTAKE_GO_BUILDER: $builder"; exit 1; }
          docker buildx build --target model-intake-go-tools --progress=plain \
            --build-arg "MODEL_INTAKE_GO_BUILDER=mirror.gcr.io/library/$builder" \
            -f scanner/Dockerfile.model-intake .
      # Why a Docker pull did not use the mirror: dockerd logs each endpoint it falls back from.
      - name: Show Docker daemon registry fallbacks
        if: failure()
        run: |
          sudo journalctl -u docker --since -15min --no-pager \
            | grep -iE 'mirror|fallback|next endpoint|toomanyrequests|error' | tail -n 100 || true
