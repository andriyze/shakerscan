name: Hunt native NSE acceptance
on:
  pull_request:
    paths:
      - 'api/capabilities/**'
      - 'api/runtime/pinned_http_replay.py'
      - 'api/hunt/interaction_router.py'
      - 'api/worker.py'
      - 'tests/**nse*'
      - 'tests/integration/**nse*'
      - '.github/workflows/hunt-nse.yml'
  merge_group:
  push:
    branches: [main]
    paths:
      - 'api/capabilities/**'
      - 'api/runtime/pinned_http_replay.py'
      - 'tests/**nse*'
      - 'tests/integration/**nse*'
      - '.github/workflows/hunt-nse.yml'
permissions:
  contents: read
concurrency:
  group: hunt-native-nse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-nse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked dependencies and native Nmap
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
      - name: Native service checks, without optional skips
        env:
          PYTHONPATH: .:api:scanner
          SHAKERSCAN_REQUIRE_NATIVE_NSE: '1'
        run: python -m pytest -q tests/integration/test_hunt_nse_native.py tests/test_hunt_nse_http.py tests/test_hunt_nse_capability.py --junitxml=/tmp/hunt-nse.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hunt-native-nse-results
          path: /tmp/hunt-nse.xml
          retention-days: 7
