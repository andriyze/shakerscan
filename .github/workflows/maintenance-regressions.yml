name: Maintenance regressions

on:
  push:
    branches: ['2.3.1']
  pull_request:
    paths:
      - 'api/**'
      - 'tests/test_managed_schedule*'
      - 'tests/test_public_retry*'
      - 'tests/test_collection*'
      - 'tests/collection_upload_fixtures.py'
      - 'tests/test_maintenance_acceptance_contract.py'
      - 'tests/disposable_postgres.py'
      - 'tests/test_credential_grants_postgres.py'
      - 'tests/test_target_asset*'
      - 'tests/test_unified_target*'
      - 'tests/test_findings_proof_sql_postgres.py'
      - 'scanner/ai_verdict_policy.py'
      - 'db/init.sql'
      - 'tests/test_target_archive_admission.py'
      - 'tests/test_e2e_debt_summary.py'
      - 'scripts/summarize_e2e_debt.py'
      - 'tests/test_lifecycle_runtime_integration.py'
      - 'tests/test_data_lifecycle_image_packaging.py'
      - 'tests/test_install_manifest_diagnostics.py'
      - 'tests/test_maintenance_import_layout.py'
      - 'scanner/Dockerfile*'
      - 'scanner/scanner_tools/build_fingerprint.py'
      - 'scripts/generate_install_manifest.py'
      - 'ui/**'
      - '.github/workflows/maintenance-regressions.yml'

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-assets-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: target-assets-ci-only
          POSTGRES_DB: target_assets_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d target_assets_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/scanner
      TARGET_ASSET_TEST_DATABASE_URL: postgresql://postgres:target-assets-ci-only@127.0.0.1:5432/target_assets_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Exercise installed startup, target ownership and input mutations
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_target_asset*postgres.py tests/test_unified_target_regressions.py --junitxml=artifacts/target-assets.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('artifacts/target-assets.xml').getroot().iter('testcase'))
          assert cases and not any(case.find('skipped') is not None for case in cases), 'Required target-asset acceptance did not run fully'
          PY
      - name: Retain target migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: target-assets-${{ github.sha }}
          path: artifacts/target-assets.xml
          if-no-files-found: error
          retention-days: 7

  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: maintenance-ci-only
          POSTGRES_DB: maintenance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d maintenance_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Match the source-tree import roots used by the canonical Python suite.
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/scanner
      SHAKERSCAN_TEST_SCHEDULE_DATABASE_URL: postgresql://postgres:maintenance-ci-only@127.0.0.1:5432/maintenance_test
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Preserve exact source for reproducible maintenance failures
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/source-revision.txt
          # Only tracked source, before dependencies or tests create local data.
          # Include generators and fixtures so contract failures can be reproduced.
          git archive --format=tar.gz HEAD > artifacts/maintenance-source.tar.gz
          sha256sum artifacts/maintenance-source.tar.gz > artifacts/source-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-inputs-${{ github.sha }}
          path: artifacts
          retention-days: 3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Export current API characterization for contract review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from api import api as api_module
          from tests.test_api_characterization import _normalized_routes, _operations, _app_contract
          destination = Path('artifacts/generated-api-contract')
          destination.mkdir(parents=True, exist_ok=True)
          for name, build in [('routes.json', _normalized_routes), ('operations.json', _operations), ('app_contract.json', _app_contract)]:
              (destination / name).write_text(json.dumps(build(api_module.app), indent=2) + '\n', encoding='utf-8')
          # Deliberately do not update golden fixtures: the full suite still checks drift.
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-characterization-${{ github.sha }}
          path: artifacts/generated-api-contract
          retention-days: 3
      - name: Scheduler database and retry regression tests (no target traffic)
        run: |
          python -m pytest -q tests/test_managed_schedule_edits.py tests/test_managed_schedule_persistence.py tests/test_managed_schedule_runner.py tests/test_public_api_contract_generation.py tests/test_lifecycle_runtime_integration.py tests/test_data_lifecycle_image_packaging.py tests/test_install_manifest_diagnostics.py tests/test_maintenance_import_layout.py tests/test_collection_atomic_retry.py tests/test_e2e_debt_summary.py --junitxml=artifacts/maintenance-python.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI unit tests and production build
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Investigation refresh browser regression (mocked API)
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run start -- --hostname 127.0.0.1 > /tmp/maintenance-ui.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/hunt >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/hunt >/dev/null
          npx playwright test tests/browser/hunt-review-refresh.spec.ts
      - name: Upload maintenance test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-results-${{ github.sha }}
          path: |
            artifacts/maintenance-python.xml
            ui/test-results
            /tmp/maintenance-ui.log
          retention-days: 3
          if-no-files-found: ignore

  collection-upload-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: collection-ci-only
          POSTGRES_DB: shakerscan_collection_retry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shakerscan_collection_retry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/scanner
      COLLECTION_TEST_DATABASE_URL: postgresql://postgres:collection-ci-only@127.0.0.1:5432/shakerscan_collection_retry_test
      COLLECTION_POSTGRES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the locked dependency set
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Exercise real collection route and transaction faults
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_collection_postgres_guard.py tests/test_collection_atomic_retry_postgres.py --junitxml=artifacts/collection-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('artifacts/collection-postgres.xml').getroot().iter('testcase'))
          assert cases and not any(case.find('skipped') is not None for case in cases), 'Required PostgreSQL acceptance did not run fully'
          PY
      - name: Retain collection acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collection-postgres-${{ github.sha }}
          path: artifacts/collection-postgres.xml
          if-no-files-found: error
          retention-days: 7

  credential-grants-postgres:
    # One credential, many targets: the grant SQL and routes on real PostgreSQL.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: grants-ci-only
          POSTGRES_DB: shakerscan_credential_grants_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shakerscan_credential_grants_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/scanner
      CREDENTIAL_GRANTS_TEST_DATABASE_URL: postgresql://postgres:grants-ci-only@127.0.0.1:5432/shakerscan_credential_grants_test
      CREDENTIAL_GRANTS_POSTGRES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the locked dependency set
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Exercise credential grants on real PostgreSQL
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_credential_grants_postgres.py --junitxml=artifacts/credential-grants-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('artifacts/credential-grants-postgres.xml').getroot().iter('testcase'))
          assert cases and not any(case.find('skipped') is not None for case in cases), 'Required PostgreSQL grant tests did not run fully'
          PY

  findings-proof-sql-postgres:
    # The proof filter's SQL equals finding_proof_fields, row by row, on real PostgreSQL.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: proof-sql-ci-only
          POSTGRES_DB: shakerscan_proof_sql_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shakerscan_proof_sql_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/api:${{ github.workspace }}/scanner
      FINDINGS_PROOF_SQL_TEST_DATABASE_URL: postgresql://postgres:proof-sql-ci-only@127.0.0.1:5432/shakerscan_proof_sql_test
      FINDINGS_PROOF_SQL_POSTGRES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install the locked dependency set
        run: python -m pip install --require-hashes -r scanner/requirements.lock
      - name: Hold the proof filter's SQL to the Python projection on real PostgreSQL
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_findings_proof_sql_postgres.py --junitxml=artifacts/findings-proof-sql-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('artifacts/findings-proof-sql-postgres.xml').getroot().iter('testcase'))
          assert cases and not any(case.find('skipped') is not None for case in cases), 'Required PostgreSQL proof filter tests did not run fully'
          PY
