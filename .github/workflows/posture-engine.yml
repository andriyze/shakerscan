name: Posture engine

# The bounded posture check engine (posture/) serves pub.shakerscan.com and runs inside the API
# image for self-hosted instances. Its TypeScript suite runs whenever the engine changes.
on:
  pull_request:
    paths: ['posture/**', '.github/workflows/posture-engine.yml']
  merge_group:
  push:
    branches: [main]
    paths: ['posture/**', '.github/workflows/posture-engine.yml']

permissions:
  contents: read

concurrency:
  group: posture-engine-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: posture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: posture/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && printf '{}' | node dist/instance.cjs | grep -q '"status":400'
