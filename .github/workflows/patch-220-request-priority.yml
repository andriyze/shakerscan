name: Patch 2.2.0 request priority

on:
  push:
    branches:
      - "fix/2.2.0-final-rc"
    paths:
      - ".github/workflows/patch-220-request-priority.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/2.2.0-final-rc
          fetch-depth: 0
      - name: Apply planner edit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/scan/action_plan.py')
          s = p.read_text()
          a = '        explicitly_requested = set(\n            execution_plan.resolved_families or policy.include_families\n        )\n        needs_candidates = xss or sqli or active_nuclei or passive_nuclei\n'
          b = '        explicitly_requested = set(\n            execution_plan.resolved_families or policy.include_families\n        )\n        # Exact operator-imported requests are stronger execution authority than synthetic candidates.\n        # When present, their verifier satisfies the selected-family minimum so generic breadth cannot\n        # consume the mutation ceiling before the exact request is replayed.\n        exact_request_candidates = bool(\n            request_candidate_ref\n            and int(request_candidate_ref.get("entry_count") or 0) > 0\n        )\n        needs_candidates = xss or sqli or active_nuclei or passive_nuclei\n'
          if a not in s:
              raise SystemExit('family anchor missing')
          s = s.replace(a, b, 1)
          s = s.replace('                required="xss" in explicitly_requested,\n', '                required=("xss" in explicitly_requested and not exact_request_candidates),\n', 1)
          s = s.replace('                required="sqli" in explicitly_requested,\n', '                required=("sqli" in explicitly_requested and not exact_request_candidates),\n', 1)
          s = s.replace('                    required="sqli" in explicitly_requested,\n', '                    required=("sqli" in explicitly_requested and not exact_request_candidates),\n', 1)
          x = '                    required=False,\n                    reserve_dependency_slots=int(sqli),\n'
          if x not in s:
              raise SystemExit('request xss anchor missing')
          s = s.replace(x, '                    required="xss" in explicitly_requested,\n                    reserve_dependency_slots=int(sqli),\n', 1)
          q = '                    required=False,\n                    reserve_dependency_slots=1,\n'
          if q not in s:
              raise SystemExit('request sqli anchor missing')
          s = s.replace(q, '                    required="sqli" in explicitly_requested,\n                    reserve_dependency_slots=1,\n', 1)
          r = '                        required=False,\n                    )\n            if nosqli:\n'
          if r not in s:
              raise SystemExit('request sqli proof anchor missing')
          s = s.replace(r, '                        required="sqli" in explicitly_requested,\n                    )\n            if nosqli:\n', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit planner edit
        shell: bash
        run: |
          rm -f .github/workflows/patch-220-request-priority.yml .github/workflows/patch-220-request-priority-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/scan/action_plan.py .github/workflows/patch-220-request-priority.yml .github/workflows/patch-220-request-priority-v2.yml
          git commit -m "fix(scan): prioritize exact request verification in selected families"
          git push origin HEAD:fix/2.2.0-final-rc
