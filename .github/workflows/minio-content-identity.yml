name: Validate exact-content SBOM recovery
on:
  push:
    branches: [diagnostics/pr217-minio-content-identity]
    paths: ['.github/workflows/minio-content-identity.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reconstruct the exact reviewed product tree without updating the PR
        run: |
          cp .github/ci/sbom-mirror.patch "$RUNNER_TEMP/sbom-mirror.patch"
          git fetch --depth=1 origin 2631fd389bc5266e9dd9a340a9e5b5bdcc944bc3
          git checkout --detach 2631fd389bc5266e9dd9a340a9e5b5bdcc944bc3
          git apply "$RUNNER_TEMP/sbom-mirror.patch"
          git add docs/sbom.md scripts/release_sbom.py scripts/release_sbom_stage2.py tests/test_release_sbom_mirrors.py
          git diff --cached --check
          test "$(git write-tree)" = fbad38fdade1b160359128bf97e3762ae42bc099
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Install locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
      - uses: ./.github/actions/sbom-tools
      - name: Offline formats, source contracts, integrity and mirror regressions
        run: |
          python -m pytest -q tests/test_release_sbom*.py --junitxml=mirror-tests.xml
          python scripts/generate_install_manifest.py --check
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
      - name: Reproduce the unchanged historical release fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.4.0 --repo "$GITHUB_REPOSITORY" --pattern release-candidate-receipt.json --dir fixture
          git fetch --depth=1 origin tag v2.4.0
          git worktree add --detach "$RUNNER_TEMP/sbom-release-source" 'v2.4.0^{commit}'
          git show 'v2.4.0:install/release-images.json' > fixture/release-images.json
          python scripts/release_sbom.py engine --receipt fixture/release-candidate-receipt.json --inventory fixture/release-images.json --version 2.4.0 --source-sha "$(git rev-parse 'v2.4.0^{commit}')" --generator-source-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --output engine-sbom-smoke
          python scripts/release_sbom.py verify --directory engine-sbom-smoke
      - name: Full independent catalogs and supporting-service coverage, no omissions
        run: |
          python scripts/release_sbom_stage2.py --directory engine-sbom-smoke --source-root "$RUNNER_TEMP/sbom-release-source" --tools "$SHAKERSCAN_SBOM_TOOLS" --output engine-sbom-expanded
          python scripts/release_sbom.py verify --directory engine-sbom-expanded
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('engine-sbom-expanded')
          index = json.loads((root / 'sbom-index.json').read_text())
          rows = index['extension']['catalogs']
          mirrored = [r for r in rows if 'retrieval_reference' in r]
          assert {(r['image'], r['platform']) for r in mirrored} == {(name, arch) for name in ['service-minio', 'service-minio-init'] for arch in ['linux/amd64', 'linux/arm64']}
          assert all(r['image_reference'].split('@')[1] == r['retrieval_reference'].split('@')[1] for r in mirrored)
          assert len([r for r in rows if r['scope'] == 'first-party-runtime']) == 10
          assert len([r for r in rows if r['scope'] == 'supporting-service-runtime']) == 10
          print('Verified all ten first-party and ten supporting-service platform catalogs, with original MinIO digests and explicit retrieval provenance.')
          PY
      - name: Export verified product blobs, never move a branch or publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          entries = []
          for name in ['docs/sbom.md', 'scripts/release_sbom.py', 'scripts/release_sbom_stage2.py', 'tests/test_release_sbom_mirrors.py']:
              data = Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              response = subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', '--input', '-'], input=payload.encode())
              actual = json.loads(response)['sha']
              assert actual == expected
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': actual})
          Path('verified-tree-entries.json').write_text(json.dumps(entries, indent=2))
          print(json.dumps(entries))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: minio-sbom-recovery-validation
          path: |
            mirror-tests.xml
            verified-tree-entries.json
            engine-sbom-expanded/sbom-index.json
            engine-sbom-expanded/sbom-source-inputs.json
            engine-sbom-expanded/sbom-coverage.json
          if-no-files-found: error
          retention-days: 14
