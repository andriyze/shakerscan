name: Export frozen RC regression workspace
on:
  push:
    branches: [fix/2.2.0-final-rc-work]
    paths: [.github/workflows/fix-220-final-rc.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: b538195c05373fcf1d70c4b63c5574f98dfc5f34
          persist-credentials: false
      - name: Export exact committed source without credentials
        run: |
          test "$(git rev-parse HEAD)" = b538195c05373fcf1d70c4b63c5574f98dfc5f34
          mkdir /tmp/rc-workspace
          git archive --format=tar.gz HEAD > /tmp/rc-workspace/source.tar.gz
          git ls-tree -r HEAD > /tmp/rc-workspace/tree.txt
          sha256sum /tmp/rc-workspace/source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc-workspace-b538195c
          path: /tmp/rc-workspace
          retention-days: 1
          if-no-files-found: error
