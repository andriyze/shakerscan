name: Build release images

# Reusable image build: construct the four release images for both platforms, push each by
# digest, assemble multi-arch manifest lists tagged candidate-<sha>-<run-id>, attest their
# provenance, and upload the uncertified candidate receipt. It publishes no version tag, no
# `latest`, no Git tag, and no GitHub Release -- exactly like the candidate build's own build and
# merge jobs, which it exists to share.
#
# Two callers use it: `build-on-main.yml` runs it on every push to main so a certifiable image set
# exists per SHA before any release is cut, and (once the release path is switched over) the
# release candidate reuses that pre-built set instead of building a second time. The build steps
# are kept byte-for-byte equivalent to the candidate's historical build jobs so the produced
# images are identical in construction.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version baked into the images (from VERSION)"
        required: true
        type: string
      candidate_sha:
        description: "Exact 40-character commit the images are built from"
        required: true
        type: string
      created:
        description: "RFC3339 build timestamp for image labels"
        required: true
        type: string
      workflow_sha:
        description: "SHA of the workflow definition, recorded as a provenance label"
        required: false
        type: string
        default: ""
    outputs:
      scanner_digest:
        value: ${{ jobs.merge.outputs.scanner_digest }}
      api_digest:
        value: ${{ jobs.merge.outputs.api_digest }}
      ui_digest:
        value: ${{ jobs.merge.outputs.ui_digest }}
      signer_digest:
        value: ${{ jobs.merge.outputs.signer_digest }}
      candidate_tag:
        value: candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}

env:
  SCANNER_IMAGE: shakerscan/shakerscan-scanner
  API_IMAGE: shakerscan/shakerscan-api
  UI_IMAGE: shakerscan/shakerscan-ui
  SIGNER_IMAGE: shakerscan/shakerscan-model-intake-signer
  MODEL_INTAKE_IMAGE: shakerscan/shakerscan-model-intake
  SOURCE_URL: https://github.com/andriyze/shakerscan

jobs:
  # Build each architecture on a NATIVE runner (no QEMU emulation -- that is what blew past the 6h
  # job limit, and katana's CGO dep cannot cross-compile). Each job pushes by digest; the manifest
  # lists are assembled in the merge job.
  build-runtime:
    name: Build scanner/API ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Prepare platform pair
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push scanner by digest
        id: scanner
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: scanner/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SCANNER_VERSION=${{ inputs.version }}
            SCANNER_SOURCE_REVISION=${{ inputs.candidate_sha }}
          labels: |
            org.opencontainers.image.title=ShakerScan Scanner
            org.opencontainers.image.description=Open-source DAST scanner API, worker, and security tooling image
            org.opencontainers.image.created=${{ inputs.created }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ inputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-scanner
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=scanner-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=scanner-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.SCANNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push API control plane by digest
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: scanner/Dockerfile.api
          platforms: ${{ matrix.platform }}
          build-args: |
            SCANNER_RUNTIME_IMAGE=${{ env.SCANNER_IMAGE }}@${{ steps.scanner.outputs.digest }}
          labels: |
            org.opencontainers.image.title=ShakerScan API Control Plane
            org.opencontainers.image.description=ShakerScan API with checksum-pinned Docker client for Model Intake guest staging
            org.opencontainers.image.created=${{ inputs.created }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ inputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-api
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=api-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.API_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push Model Intake by digest
        id: model_intake
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: scanner/Dockerfile.model-intake
          platforms: ${{ matrix.platform }}
          build-args: |
            SCANNER_RUNTIME_IMAGE=${{ env.SCANNER_IMAGE }}@${{ steps.scanner.outputs.digest }}
          labels: |
            org.opencontainers.image.title=ShakerScan Model Intake
            org.opencontainers.image.description=ShakerScan Model Intake worker and sandbox: the scanner runtime plus the artifact-scanning toolchain
            org.opencontainers.image.created=${{ inputs.created }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ inputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-model-intake
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=model-intake-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=model-intake-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.MODEL_INTAKE_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify baked scanner release identity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          SCANNER_DIGEST: ${{ steps.scanner.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          MODEL_INTAKE_DIGEST: ${{ steps.model_intake.outputs.digest }}
        run: |
          for image in "${SCANNER_IMAGE}@${SCANNER_DIGEST}" "${API_IMAGE}@${API_DIGEST}" "${MODEL_INTAKE_IMAGE}@${MODEL_INTAKE_DIGEST}"; do
            docker pull "$image"
            baked_version="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image" | awk -F= '$1 == "SCANNER_VERSION" {print $2}')"
            if [[ "$baked_version" != "$VERSION" ]]; then
              echo "$image baked SCANNER_VERSION=$baked_version; expected $VERSION" >&2
              exit 1
            fi
            docker run --rm \
              -e SCANNER_EXPECTED_VERSION="$VERSION" \
              -e SCANNER_EXPECTED_REVISION="$CANDIDATE_SHA" \
              --entrypoint python3 "$image" /app/release_identity.py --verify
            if docker run --rm \
              -e SCANNER_EXPECTED_VERSION="0.0.0-intentional-mismatch" \
              --entrypoint python3 "$image" /app/release_identity.py --verify; then
              echo "$image accepted an intentionally wrong deployment identity" >&2
              exit 1
            fi
          done

      - name: Export digests
        shell: bash
        run: |
          mkdir -p /tmp/digests/scanner /tmp/digests/api /tmp/digests/model-intake
          scanner_digest="${{ steps.scanner.outputs.digest }}"
          api_digest="${{ steps.api.outputs.digest }}"
          model_intake_digest="${{ steps.model_intake.outputs.digest }}"
          touch "/tmp/digests/scanner/${scanner_digest#sha256:}"
          touch "/tmp/digests/api/${api_digest#sha256:}"
          touch "/tmp/digests/model-intake/${model_intake_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 14

  # UI has no dependency on the scanner/API image chain. Keep it in a separate retry domain so a
  # transient package-registry failure cannot rebuild the multi-gigabyte scanner runtime.
  build-ui:
    name: Build UI ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Prepare platform pair
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push UI by digest
        id: ui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./ui
          file: ui/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ inputs.version }}
            UI_SOURCE_REVISION=${{ inputs.candidate_sha }}
          labels: |
            org.opencontainers.image.title=ShakerScan UI
            org.opencontainers.image.description=Open-source ShakerScan web dashboard
            org.opencontainers.image.created=${{ inputs.created }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ inputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-ui
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ui-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ui-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.UI_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export UI digest
        shell: bash
        run: |
          mkdir -p /tmp/digests/ui
          digest="${{ steps.ui.outputs.digest }}"
          touch "/tmp/digests/ui/${digest#sha256:}"

      - name: Upload UI digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 14

  # The narrow signer image is independent of both the product UI and the scanner/API dependency
  # chain, so it gets its own retry boundary as well.
  build-signer:
    name: Build signer ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Prepare platform pair
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push signer by digest
        id: signer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: api/model_intake_signer.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=ShakerScan Model Intake Signer
            org.opencontainers.image.description=Narrow Model Intake admission signer trust service
            org.opencontainers.image.created=${{ inputs.created }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ inputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-model-intake-signer
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=signer-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=signer-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.SIGNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export signer digest
        shell: bash
        run: |
          mkdir -p /tmp/digests/signer
          digest="${{ steps.signer.outputs.digest }}"
          touch "/tmp/digests/signer/${digest#sha256:}"

      - name: Upload signer digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signer-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 14

  # Combine the per-arch digests into one multi-arch manifest list per image, attest each final
  # manifest, and write the uncertified candidate receipt the release path reuses.
  merge:
    name: Create multi-arch manifests
    needs: [build-runtime, build-ui, build-signer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      scanner_digest: ${{ steps.receipt.outputs.scanner_digest }}
      api_digest: ${{ steps.receipt.outputs.api_digest }}
      ui_digest: ${{ steps.receipt.outputs.ui_digest }}
      signer_digest: ${{ steps.receipt.outputs.signer_digest }}
      model_intake_digest: ${{ steps.receipt.outputs.model_intake_digest }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: /tmp/digests
          pattern: "*-digests-*"
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create scanner manifest list
        working-directory: /tmp/digests/scanner
        env:
          CANDIDATE_TAG: candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${SCANNER_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${SCANNER_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${SCANNER_IMAGE}:${CANDIDATE_TAG}"

      - name: Create API control-plane manifest list
        working-directory: /tmp/digests/api
        env:
          CANDIDATE_TAG: candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${API_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${API_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${API_IMAGE}:${CANDIDATE_TAG}"

      - name: Create UI manifest list
        working-directory: /tmp/digests/ui
        env:
          CANDIDATE_TAG: candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${UI_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${UI_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${UI_IMAGE}:${CANDIDATE_TAG}"

      - name: Create Model Intake signer manifest list
        working-directory: /tmp/digests/signer
        env:
          CANDIDATE_TAG: candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${SIGNER_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${SIGNER_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${SIGNER_IMAGE}:${CANDIDATE_TAG}"

      - name: Create Model Intake manifest list
        working-directory: /tmp/digests/model-intake
        env:
          CANDIDATE_TAG: candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${MODEL_INTAKE_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${MODEL_INTAKE_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${MODEL_INTAKE_IMAGE}:${CANDIDATE_TAG}"

      - name: Write immutable candidate receipt
        id: receipt
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_TAG: candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}
        run: |
          digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" && !found {print $2; found=1}'
          }
          scanner_digest="$(digest "${SCANNER_IMAGE}:${CANDIDATE_TAG}")"
          api_digest="$(digest "${API_IMAGE}:${CANDIDATE_TAG}")"
          ui_digest="$(digest "${UI_IMAGE}:${CANDIDATE_TAG}")"
          signer_digest="$(digest "${SIGNER_IMAGE}:${CANDIDATE_TAG}")"
          model_intake_digest="$(digest "${MODEL_INTAKE_IMAGE}:${CANDIDATE_TAG}")"
          echo "scanner_digest=$scanner_digest" >> "$GITHUB_OUTPUT"
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "ui_digest=$ui_digest" >> "$GITHUB_OUTPUT"
          echo "signer_digest=$signer_digest" >> "$GITHUB_OUTPUT"
          echo "model_intake_digest=$model_intake_digest" >> "$GITHUB_OUTPUT"
          # The host-side runtime is verified file by file against install/MANIFEST.sha256; its
          # digest is bound into the receipt so promotion can publish it in the image lock.
          python3 scripts/generate_install_manifest.py --check
          runtime_manifest="$(sha256sum install/MANIFEST.sha256 | awk '{print $1}')"
          jq -n \
            --arg version "$VERSION" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg scanner "$scanner_digest" \
            --arg api "$api_digest" \
            --arg ui "$ui_digest" \
            --arg signer "$signer_digest" \
            --arg model_intake "$model_intake_digest" \
            --arg runtime_manifest "$runtime_manifest" \
            '{schema_version:"shakerscan-release-candidate/v1",version:$version,candidate_sha:$candidate_sha,candidate_tag:$candidate_tag,workflow_run:$workflow_run,images:{scanner:$scanner,api:$api,ui:$ui,signer:$signer,model_intake:$model_intake},runtime_manifest_sha256:$runtime_manifest}' \
            > release-candidate-receipt.json

      - name: Attest final scanner manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.SCANNER_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.scanner_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final API manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.API_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final UI manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.UI_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.ui_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final signer manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.SIGNER_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.signer_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final Model Intake manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.MODEL_INTAKE_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.model_intake_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify signed candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SCANNER_DIGEST: ${{ steps.receipt.outputs.scanner_digest }}
          API_DIGEST: ${{ steps.receipt.outputs.api_digest }}
          UI_DIGEST: ${{ steps.receipt.outputs.ui_digest }}
          SIGNER_DIGEST: ${{ steps.receipt.outputs.signer_digest }}
          MODEL_INTAKE_DIGEST: ${{ steps.receipt.outputs.model_intake_digest }}
        shell: bash
        run: |
          gh attestation verify "oci://docker.io/${SCANNER_IMAGE}@${SCANNER_DIGEST}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://docker.io/${API_IMAGE}@${API_DIGEST}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://docker.io/${UI_IMAGE}@${UI_DIGEST}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://docker.io/${SIGNER_IMAGE}@${SIGNER_DIGEST}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://docker.io/${MODEL_INTAKE_IMAGE}@${MODEL_INTAKE_DIGEST}" --repo "$GITHUB_REPOSITORY"
          receipt_tmp="$(mktemp)"
          jq --arg repository "$GITHUB_REPOSITORY" \
            '.provenance={verified:true,issuer:"github-actions-sigstore",repository:$repository,subject:"final-multiarch-image-digests"}' \
            release-candidate-receipt.json > "$receipt_tmp"
          mv "$receipt_tmp" release-candidate-receipt.json

      - name: Upload uncertified manifest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-uncertified-${{ inputs.version }}-${{ inputs.candidate_sha }}
          path: release-candidate-receipt.json
          if-no-files-found: error
          retention-days: 30
