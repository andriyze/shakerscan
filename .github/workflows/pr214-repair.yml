name: PR 214 repair validation
on:
  push:
    branches: [claude/github-access-qqgoq6]
    paths: [.github/workflows/pr214-repair.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Apply reviewed repair and verify exact locally tested blobs
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero --check .github/pr214-product.patch
          git apply --unidiff-zero .github/pr214-product.patch
          python - <<'PY'
          import subprocess
          from pathlib import Path
          expected = '''a1f2f699e1f8c32fc2459305b9b8371fd312486b api/capabilities/network.py
          e7185dfa8b7f956fb9f5d84e35ce5c3f717f044a api/capabilities/nse.py
          ec9718153150620cf08e5f5f844afe4542ce15f0 api/capabilities/replay.py
          018bdc801d0b437b2577c2d7c1a2d30b9b64fb2d api/hunt/service_binding.py
          5480630b0751a86ea17f626f069406340c5773f9 api/runtime/budgets.py
          bbd5efee8a1d42cc2db0dfdd35851e7ae22b48b9 api/runtime/session_service_authority.py
          197dccb4aeec99baea990d0cab724a2a1315c817 api/worker.py
          923e54114859d9b3986579830b157f516b572045 client/src/shakerscan/cli.py
          6251ed9cf08d3d047609f6e9f427ac71e1326939 client/tests/test_public.py
          145344419a1bb7ec0006da2c40adfaf9e74ff281 docs/client.md
          0eb070742ffe7666c1924870f356c39a5ac89c54 install/MANIFEST.sha256
          4805abf41abcdd449027521e6cf3c5debc9f7e37 tests/test_hunt_nse_capability.py
          1cfb9fa327480aa8d06cea5e37fcaf64181a2807 tests/test_hunt_replay_worker_lifecycle.py
          a8996116fa7aaf6e43299456af0d0b96964ec5f5 tests/test_hunt_session_service_authority.py
          0c1c75780c9c28b3ce61062955ecdb005333eac1 tests/test_runtime_zero_limits.py
          10439ac57c3fdd6e78fe7ba9a45039c88684b2ec tests/integration/test_hunt_nse_native.py'''
          paths = []
          for line in expected.splitlines():
              sha, path = line.split()
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
              paths.append(path)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          Path('.github/pr214-product.patch').unlink()
          Path('.github/workflows/pr214-repair.yml').unlink()
          subprocess.run(['git', 'add', '-u', '--', '.github/pr214-product.patch', '.github/workflows/pr214-repair.yml'], check=True)
          print('All 16 repaired blobs match the reviewed local source; transfer files removed.')
          PY
          git diff --cached --check
      - name: Install locked dependencies and native fixture tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
      - name: Real native NSE IPv4 and IPv6 acceptance
        env:
          PYTHONPATH: .:api:scanner
          SHAKERSCAN_REQUIRE_NATIVE_NSE: '1'
        run: python -m pytest -q tests/integration/test_hunt_nse_native.py --junitxml=/tmp/native-nse.xml
      - name: Focused replay, session, result and budget regressions
        env:
          PYTHONPATH: .:api:scanner:client/src
        run: |
          python -m pytest -q tests/test_hunt_nse_capability.py tests/test_hunt_replay_service_origin.py tests/test_hunt_replay_worker_lifecycle.py tests/test_replay_capability_adapter.py tests/test_runtime_zero_limits.py tests/test_runtime_capabilities.py tests/test_budget_reservation_lifecycle.py tests/test_network_capabilities.py tests/test_hunt_network_reservations.py tests/test_hunt_session_service_authority.py tests/test_hunt_service_execution.py tests/test_hunt_authority_integrity.py tests/test_hunt_authorization_service_origins.py tests/test_auth_session_store.py tests/test_hunt_verification_admission.py client/tests/test_public.py --junitxml=/tmp/focused.xml
      - name: Complete partitioned Python suite
        run: python scripts/run_complete_python_suite.py --artifacts-dir /tmp/pr214-python
      - name: Static and generated contract gates
        run: |
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
      - name: Upload validated Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def post(endpoint, value):
              request = urllib.request.Request(base + endpoint, data=json.dumps(value).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for row in subprocess.check_output(['git', 'diff', '--cached', '--name-status'], text=True).splitlines():
              status, path = row.split('\t')
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, expected, _ = subprocess.check_output(['git', 'ls-files', '--stage', '--', path], text=True).split()[:3]
              created = post('/git/blobs', {'content': Path(path).read_text(), 'encoding': 'utf-8'})
              assert created['sha'] == expected, (path, created['sha'], expected)
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': created['sha']})
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          result = post('/git/trees', {'base_tree': tree, 'tree': entries})
          print('VALIDATED_PARENT=' + parent)
          print('VALIDATED_TREE=' + result['sha'])
          Path('/tmp/pr214-tree.json').write_text(json.dumps({'parent': parent, 'tree': result['sha'], 'changed_files': [e['path'] for e in entries]}, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr214-repair-validation
          path: |
            /tmp/native-nse.xml
            /tmp/focused.xml
            /tmp/pr214-python
            /tmp/pr214-tree.json
          retention-days: 7
