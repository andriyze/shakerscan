name: Record deletion and public repository hygiene

on:
  pull_request:
    paths:
      - 'api/**'
      - 'db/**'
      - 'ui/**'
      - 'docs/**'
      - 'tests/test_data_lifecycle*'
      - 'tests/test_target_archive_admission.py'
      - 'tests/disposable_postgres.py'
      - 'tests/test_public_repo_hygiene.py'
      - 'scripts/check_public_repo_hygiene.py'
      - '.github/workflows/data-lifecycle.yml'
      - '.gitignore'
      - '.dockerignore'
  push:
    branches: ['2.3.1', main]

permissions:
  contents: read

concurrency:
  group: data-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: lifecycle-ci-only
          POSTGRES_DB: shakerscan_lifecycle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shakerscan_lifecycle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LIFECYCLE_TEST_DATABASE_URL: postgresql://postgres:lifecycle-ci-only@127.0.0.1:5432/shakerscan_lifecycle_test
      LIFECYCLE_POSTGRES_REQUIRED: '1'
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r scanner/requirements.lock
          npm ci --prefix ui
      - name: Verify publication and API contracts
        run: |
          python scripts/check_public_repo_hygiene.py
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_public_api_contract.py --check
          python scripts/check_documentation_policy.py
          python scripts/check_module_size.py
          python scripts/check_surface_dispositions.py
      - name: Real database lifecycle and regression tests
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/test_data_lifecycle.py tests/test_data_lifecycle_postgres.py \
            tests/test_data_lifecycle_replay.py tests/test_target_archive_admission.py \
            tests/test_public_repo_hygiene.py tests/test_data_exposure.py \
            tests/test_documentation_policy.py tests/test_v2_documentation_contract.py \
            tests/test_public_api_contract_generation.py tests/test_retest_contract_migrations.py \
            tests/test_finding_identity_collapse.py tests/test_target_origin_identity.py \
            --junitxml=artifacts/lifecycle-python.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = [c for c in ET.parse('artifacts/lifecycle-python.xml').getroot().iter('testcase')
                   if c.get('classname', '').endswith('test_data_lifecycle_postgres')]
          assert cases and not any(c.find('skipped') is not None for c in cases), 'Required lifecycle PostgreSQL acceptance did not run fully'
          PY
      - name: UI unit tests and production build
        working-directory: ui
        run: |
          npm test
          npm run build
      - name: Desktop and mobile deletion interactions (mocked API, no scan traffic)
        working-directory: ui
        run: |
          npx playwright install --with-deps chromium
          npm run start -- --hostname 127.0.0.1 > /tmp/lifecycle-ui.log 2>&1 &
          trap 'kill $(jobs -pr) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/targets >/dev/null; then break; fi
            sleep 2
          done
          npx playwright test tests/browser/data-lifecycle.spec.ts
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-browser-${{ github.sha }}
          path: |
            artifacts/lifecycle-python.xml
            ui/test-results
            /tmp/lifecycle-ui.log
          retention-days: 3
          if-no-files-found: ignore
