name: V2 source bundle

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Record source identity
        run: |
          mkdir -p "$RUNNER_TEMP/shakerscan-v2-metadata"
          git rev-parse HEAD > "$RUNNER_TEMP/shakerscan-v2-metadata/V2_SOURCE_SHA"
          git status --short --branch > "$RUNNER_TEMP/shakerscan-v2-metadata/V2_SOURCE_STATUS"

      - name: Build source archive outside the source tree
        run: |
          tar \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='**/.next' \
            --exclude='**/__pycache__' \
            --exclude='**/.pytest_cache' \
            -czf "$RUNNER_TEMP/shakerscan-v2-source.tar.gz" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shakerscan-v2-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shakerscan-v2-source.tar.gz
            ${{ runner.temp }}/shakerscan-v2-metadata/
          retention-days: 1
          if-no-files-found: error
