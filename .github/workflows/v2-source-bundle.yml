name: V2 source bundle

on:
  push:
    branches:
      - v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Record source identity
        run: |
          git rev-parse HEAD > V2_SOURCE_SHA
          git status --short --branch > V2_SOURCE_STATUS

      - name: Build source archive
        run: |
          tar \
            --exclude=.git \
            --exclude='**/node_modules' \
            --exclude='**/.next' \
            --exclude='**/__pycache__' \
            --exclude='**/.pytest_cache' \
            -czf shakerscan-v2-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: shakerscan-v2-source-${{ github.sha }}
          path: shakerscan-v2-source.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Publish run locator
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$RUN_ID" > V2_SOURCE_RUN_ID
          printf '%s\n' "$RUN_SHA" > V2_SOURCE_BUNDLE_SHA
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- V2_SOURCE_RUN_ID V2_SOURCE_BUNDLE_SHA
          git commit -m 'ci(v2): publish source bundle run locator'
          git push origin HEAD:v2
