name: PR 214 pinned NSE validation
on:
  push:
    branches: [claude/github-access-qqgoq6]
    paths: [.github/workflows/pr214-nse-validation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assemble exact reviewed NSE candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = urllib.request.Request(root + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          tree = get('/git/trees/5ed4c1f6878009a97fe03ffb37a4d2f79bc10b36?recursive=1')
          allowed = {'api/capabilities/nse_http.nse', 'api/capabilities/nse_http_runtime.py', 'api/capabilities/nse_http_transport.py', 'tests/test_hunt_nse_http.py', 'tests/integration/test_hunt_nse_native.py'}
          blobs = [entry for entry in tree['tree'] if entry['type'] == 'blob']
          assert {entry['path'] for entry in blobs} == allowed and not tree.get('truncated')
          for entry in blobs:
              blob = get('/git/blobs/' + entry['sha'])
              assert blob['encoding'] == 'base64'
              Path(entry['path']).write_bytes(base64.b64decode(blob['content']))
              assert subprocess.check_output(['git', 'hash-object', entry['path']], text=True).strip() == entry['sha']
          patch = Path('.github/pr214-nse.patch')
          patch.write_text(patch.read_text().replace('\n diff --git ', '\ndiff --git '))
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '.github/pr214-nse-output.patch'], check=True)
          subprocess.run(['git', 'apply', '.github/pr214-nse-health.patch'], check=True)
          expected = '''18104e4abc83d3b2392a5d13a07c7d23261d12c6 .github/workflows/hunt-nse.yml
          4f115c33e7751288e269ed3e5d467956fa8ec0ae api/capabilities/network.py
          f1f4fddbc212ff421e2bfca1598d6cdc4ae43953 api/capabilities/nse.py
          95cc4ea45cd68512fcf3c777f4c9318356b4b76d api/capabilities/nse_http.nse
          c7c16153193baeebd960834b5083dd177ed18db5 api/capabilities/nse_http_runtime.py
          84ad8097d85b46b3b68443d2ff353b96056152e0 api/capabilities/nse_http_transport.py
          1b8725d2a8fe4fafa9e23a36c6afb0541929714e api/hunt/interaction_router.py
          93ec9e3f6be18607424fc740a164e8a841588b63 api/hunt/device_traffic.py
          a8e3eade0c52fce54ce4048320522192fafecda1 api/hunt/device_policy.py
          2d71b027d9ac47d722e84429202d11b1094e9451 api/runtime/capability_registry.py
          18038da496983e4bd777659d9dd8ad065a78a209 api/runtime/pinned_http_replay.py
          29d5e5d83c87a882c44ea8a54bab02ee0cd4c83e api/worker.py
          a8c6ada4591518183e3d7c2b19a2412c69a30921 docs/connected-device-security.md
          e0915811b96b1e1000f371892ae02e2c37e1801e install/MANIFEST.sha256
          7b7b3f2848578c011eb875a002e04c60a16017e9 tests/integration/test_hunt_nse_native.py
          de69fb0235a2b44d432abf544a60b935dd32a0c0 tests/test_hunt_nse_capability.py
          c847a7f6c24ad411f2fad2951a3368b861a54943 tests/test_hunt_nse_http.py
          729e473ecc1cb81bbe97f2317b1aeaf7a88fb9ed tests/test_hunt_nse_device_health.py'''
          paths = []
          for line in expected.splitlines():
              sha, path = line.split()
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
              paths.append(path)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '-f', '.github/pr214-nse.patch', '.github/pr214-nse-output.patch', '.github/pr214-nse-health.patch', '.github/workflows/pr214-nse-validation.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.lock
      - name: Install locked dependencies and Nmap
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scanner/requirements.lock
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap
      - name: Native analyses, real pinned HTTP and device continuation tests
        env:
          PYTHONPATH: .:api:scanner
          SHAKERSCAN_REQUIRE_NATIVE_NSE: '1'
        run: |
          python -m pytest -q tests/integration/test_hunt_nse_native.py tests/test_hunt_nse_http.py tests/test_hunt_nse_capability.py tests/test_hunt_nse_device_health.py tests/test_hunt_device_traffic.py --junitxml=/tmp/nse-native.xml
      - name: Install Chromium for the full suite
        run: python -m playwright install --with-deps chromium
      - name: Complete partitioned Python suite
        run: python scripts/run_complete_python_suite.py --artifacts-dir /tmp/nse-python
      - name: Generated and static gates
        run: |
          python scripts/generate_capability_inventory.py --check
          python scripts/generate_install_manifest.py --check
          python scripts/generate_scan_contract.py --check
          python scripts/generate_hunt_contract.py --check
          python scripts/check_installed_import_closure.py
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          python scripts/check_surface_dispositions.py
          python scripts/check_scan_target_transport.py
      - name: Store the validated tree without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def post(path, data):
              req = urllib.request.Request(root + path, data=json.dumps(data).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          entries = []
          for row in git('diff', '--cached', '--name-status').splitlines():
              status, path = row.split('\t')
              if status == 'D':
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, expected, _ = git('ls-files', '--stage', '--', path).split()[:3]
              blob = post('/git/blobs', {'content': Path(path).read_text(), 'encoding': 'utf-8'})
              assert blob['sha'] == expected
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          tree = post('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert tree['sha'] == git('write-tree')
          data = {'parent': git('rev-parse', 'HEAD'), 'tree': tree['sha'], 'files': [entry['path'] for entry in entries]}
          print(json.dumps(data, indent=2))
          Path('/tmp/nse-product-tree.json').write_text(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr214-nse-validation
          path: |
            /tmp/nse-native.xml
            /tmp/nse-python
            /tmp/nse-product-tree.json
          retention-days: 7
