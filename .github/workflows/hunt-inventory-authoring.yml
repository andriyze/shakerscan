name: Reviewed Hunt inventory generation

on:
  pull_request:
    branches: [codex/network-worker-defaults]
    paths: ['.github/workflows/hunt-inventory-authoring.yml']

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'andriyze/shakerscan' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/hunt-aisvs-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reproduce the independently reviewed two-line inventory change
        run: |
          python scripts/generate_capability_inventory.py
          python scripts/generate_capability_inventory.py --check
          python - <<'PY'
          import hashlib
          from pathlib import Path
          content = Path('docs/functionality-reference.md').read_bytes()
          assert hashlib.sha256(content).hexdigest() == '5aa10ca97e2e5fd8c799102c14947550037c4305278afcf6d68b0ec7ce8e23fb'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-hunt-inventory-${{ github.sha }}
          path: docs/functionality-reference.md
          retention-days: 3
          if-no-files-found: error

  store-blob:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-hunt-inventory-${{ github.sha }}
          path: generated
      - name: Store exact reviewed bytes only; no checkout, source execution, commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          path = Path('generated/functionality-reference.md')
          assert path.is_file() and not path.is_symlink() and path.stat().st_size == 244520
          content = path.read_bytes()
          assert hashlib.sha256(content).hexdigest() == '5aa10ca97e2e5fd8c799102c14947550037c4305278afcf6d68b0ec7ce8e23fb'
          payload = json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode()
          request = urllib.request.Request('https://api.github.com/repos/andriyze/shakerscan/git/blobs',
              data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=30) as response:
              sha = json.load(response)['sha']
          assert sha == '6d08f748b14de1a4e8cf4a394e32963a40757194'
          print('Verified immutable inventory blob:', sha)
          PY
