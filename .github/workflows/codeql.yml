name: CodeQL

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: codeql-${{ github.ref }}-${{ matrix.language }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # No build step: CodeQL extracts Python and JavaScript/TypeScript from
      # source. Running autobuild made the javascript-typescript matrix leg try
      # to build the Next.js UI during database generation, which fails and took
      # the whole analysis down with it -- the checked-in generated contract is
      # already present, so nothing needs producing first.

      - name: Analyze
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827
        with:
          category: /language:${{ matrix.language }}
