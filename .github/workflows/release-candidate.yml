name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without v prefix"
        required: true
      candidate_sha:
        description: "Exact approved commit SHA (must be the selected main commit)"
        required: true
      codeql_run_id:
        description: "Successful CodeQL workflow run ID for this exact SHA"
        required: true
      parity_run_id:
        description: "Optional real-fleet Scan parity workflow run ID for this exact SHA"
        required: false
      model_intake_physical_run_id:
        description: "Optional real Hugging Face/KVM acceptance run ID for this exact SHA"
        required: false
      device_physical_run_id:
        description: "Optional physical-device acceptance run ID for this exact SHA"
        required: false
      waive_dast_quality:
        description: "Release-owner acceptance of a measured DAST quality-bar shortfall (recorded as declared debt, not a pass). Regression gates still enforced."
        type: boolean
        default: false
      waive_e2e_debt:
        description: "Release-owner acceptance of the named installed-stack E2E declared-debt checks (recorded by area/check/reason in scope_exclusions, not a pass). Every other check stays a hard gate."
        type: boolean
        default: false

# Serialize candidate construction. This workflow never publishes a version,
# `latest`, an installer channel, a Git tag, or a GitHub Release.
concurrency:
  group: shakerscan-release-candidate
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCANNER_IMAGE: shakerscan/shakerscan-scanner
  API_IMAGE: shakerscan/shakerscan-api
  UI_IMAGE: shakerscan/shakerscan-ui
  SIGNER_IMAGE: shakerscan/shakerscan-model-intake-signer
  SOURCE_URL: https://github.com/andriyze/shakerscan

jobs:
  # Resolve and validate the release version once, shared by all downstream jobs.
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      created: ${{ steps.meta.outputs.created }}
      candidate_sha: ${{ steps.meta.outputs.candidate_sha }}
      workflow_sha: ${{ steps.meta.outputs.workflow_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Manual publication validates and builds the explicitly approved
          # candidate, even when main has moved on with workflow-only fixes.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}
          # Full history is required for the "candidate is on main" ancestor
          # check; a shallow clone truncates merge-base and can falsely fail.
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          version="$INPUT_VERSION"
          candidate_sha="$INPUT_CANDIDATE_SHA"
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release candidates must run from refs/heads/main, got ${GITHUB_REF}" >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$file_version" ]]; then
            echo "Release version mismatch: ref/input resolved to $version but VERSION contains $file_version" >&2
            exit 1
          fi

          candidate_sha="$(git rev-list -n1 "$candidate_sha")" || {
            echo "Candidate does not resolve to a commit: $candidate_sha" >&2
            exit 1
          }
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || [[ "$candidate_sha" != "$checked_out_sha" ]]; then
            echo "Candidate mismatch: approved=$candidate_sha checked_out=$checked_out_sha" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify candidate is on main
        shell: bash
        run: |
          # A bare `git fetch origin main` updates only FETCH_HEAD; the explicit
          # refspec is required so refs/remotes/origin/main exists (on a tag
          # push, checkout fetched only the tag ref). Fetching the LIVE branch
          # also keeps the dispatch path honest against main moving after
          # approval instead of comparing against a vacuous local ref.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${{ steps.meta.outputs.candidate_sha }}" origin/main || {
            echo "Approved candidate is not reachable from origin/main" >&2
            exit 1
          }

  validate:
    name: Validate exact release candidate
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout approved candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.meta.outputs.candidate_sha }}
          # The upgrade smoke loads the 0.5.7 schema from its historical
          # commit. A depth-one checkout can resolve the frozen candidate but
          # cannot provide that baseline tree.
          fetch-depth: 0

      - name: Verify generated documentation and the installer manifest
        run: |
          python3 scripts/generate_capability_inventory.py --check
          python3 scripts/generate_install_manifest.py --check

      - name: Refuse to build a release from an unprotected main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/apply_main_ruleset.py --check

      - name: Verify exact-SHA external release gates
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
          CODEQL_RUN_ID: ${{ inputs.codeql_run_id }}
          PARITY_RUN_ID: ${{ inputs.parity_run_id }}
          MODEL_INTAKE_PHYSICAL_RUN_ID: ${{ inputs.model_intake_physical_run_id }}
          DEVICE_PHYSICAL_RUN_ID: ${{ inputs.device_physical_run_id }}
        shell: bash
        run: |
          verify_run() {
            run_id="$1"
            expected_name="$2"
            expected_path="${3:-}"
            actual="$(gh run view "$run_id" --json conclusion,headSha,workflowName --jq '.workflowName + "|" + .conclusion + "|" + .headSha')"
            expected_by_name="${expected_name}|success|${CANDIDATE_SHA}"
            expected_by_path="${expected_path}|success|${CANDIDATE_SHA}"
            [[ "$actual" == "$expected_by_name" || ( -n "$expected_path" && "$actual" == "$expected_by_path" ) ]]
          }
          # GitHub reports a workflow's display name when it can resolve the
          # metadata, but can return the immutable workflow path for the same
          # successful run. Accept only these two identities for CodeQL.
          verify_run "$CODEQL_RUN_ID" "CodeQL" ".github/workflows/codeql.yml"
          if [[ -n "$PARITY_RUN_ID" ]]; then
            verify_run "$PARITY_RUN_ID" "V2 Scan parity (real fleet)"
          fi
          if [[ -n "$MODEL_INTAKE_PHYSICAL_RUN_ID" ]]; then
            verify_run "$MODEL_INTAKE_PHYSICAL_RUN_ID" "Model Intake physical acceptance"
          fi
          if [[ -n "$DEVICE_PHYSICAL_RUN_ID" ]]; then
            verify_run "$DEVICE_PHYSICAL_RUN_ID" "Device physical acceptance"
          fi

          # headSha only proves where the run was dispatched; the identity
          # receipt proves which commit the parity fleet actually checked out.
          if [[ -n "$PARITY_RUN_ID" ]]; then
            rm -rf /tmp/parity-identity
            gh run download "$PARITY_RUN_ID" \
              -n "parity-identity-$CANDIDATE_SHA" -D /tmp/parity-identity
            python3 - <<'PY'
          import json, os, sys
          with open('/tmp/parity-identity/parity-identity.json', encoding='utf-8') as fh:
              identity = json.load(fh)
          expected = os.environ['CANDIDATE_SHA']
          if identity.get('candidate_sha') != expected or identity.get('resolved_head_sha') != expected:
              sys.exit(
                  'Parity identity mismatch: '
                  f"claimed={identity.get('candidate_sha')} "
                  f"checked_out={identity.get('resolved_head_sha')} expected={expected}"
              )
          PY
          fi

      - name: Smoke-test frozen-source installer
        run: make installer-smoke

      - name: Pre-pull checksum-pinned scanner bases
        run: |
          scripts/retry-command.sh timeout 300 docker pull \
            golang:1.26.7-bookworm@sha256:e8c859f5632dcfde7b32d2012b4351728f6437930887c2f6a91ea242459e5514
          scripts/retry-command.sh timeout 300 docker pull \
            mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d

      - name: Build locked scanner image
        run: >-
          docker build
          --build-arg SCANNER_VERSION=${{ needs.meta.outputs.version }}
          --build-arg SCANNER_SOURCE_REVISION=${{ needs.meta.outputs.candidate_sha }}
          -f scanner/Dockerfile -t shakerscan-scanner:release-candidate .

      - name: Build and verify locked API control-plane image
        run: |
          docker build \
            --build-arg SCANNER_RUNTIME_IMAGE=shakerscan-scanner:release-candidate \
            -f scanner/Dockerfile.api -t shakerscan-api:release-candidate .
          docker run --rm --entrypoint sh shakerscan-scanner:release-candidate -ceu \
            'if command -v docker >/dev/null 2>&1; then echo "worker image must not contain Docker" >&2; exit 1; fi'
          docker run --rm --entrypoint docker shakerscan-api:release-candidate --version
          docker run --rm --entrypoint sh shakerscan-api:release-candidate -ceu \
            'if docker buildx version >/dev/null 2>&1; then echo "runtime API must not carry Buildx" >&2; exit 1; fi'
          test "$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' shakerscan-scanner:release-candidate | awk -F= '$1 == "SCANNER_VERSION" {print $2}')" = "${{ needs.meta.outputs.version }}"
          test "$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' shakerscan-api:release-candidate | awk -F= '$1 == "SCANNER_VERSION" {print $2}')" = "${{ needs.meta.outputs.version }}"

      - name: Enforce candidate-image external wire ceilings
        env:
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
        shell: bash
        run: |
          mkdir -p artifacts
          worker_name="shakerscan-wire-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$worker_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$worker_name" \
            --add-host host.docker.internal:host-gateway \
            --add-host shakerscan-fixtures.internal:host-gateway \
            --entrypoint sleep shakerscan-scanner:release-candidate infinity
          image_id="$(docker image inspect --format '{{.Id}}' shakerscan-scanner:release-candidate)"
          python tests/e2e/run_external_wire_acceptance.py \
            --worker-container "$worker_name" --json \
            > artifacts/release-external-wire-raw.json
          jq --arg source_sha "$CANDIDATE_SHA" --arg worker_image_id "$image_id" \
            '. + {source_sha:$source_sha,worker_image_id:$worker_image_id}' \
            artifacts/release-external-wire-raw.json \
            > artifacts/release-external-wire.json
          test "$(jq -r '.source_sha' artifacts/release-external-wire.json)" = "$CANDIDATE_SHA"
          test "$(jq -r '.status' artifacts/release-external-wire.json)" = passed
          test "$(jq -r '.tool_count' artifacts/release-external-wire.json)" = 9

      - name: Upload candidate external wire receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-wire-${{ needs.meta.outputs.candidate_sha }}
          path: artifacts/release-external-wire.json
          if-no-files-found: error
          retention-days: 30

      - name: Unit, contract, documentation, and release gates from exact source
        run: |
          mkdir -p artifacts
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/src/api:/src/scanner:/src \
            -v "$PWD:/src:ro" -w /src \
            -v "$PWD/artifacts:/artifacts" \
            shakerscan-scanner:release-candidate \
            scripts/run_complete_python_suite.py \
            --artifacts-dir /artifacts
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/src/api:/src/scanner:/src \
            -v "$PWD:/src:ro" -w /src \
            shakerscan-scanner:release-candidate \
            scripts/release_gates.py

      - name: Verify baked candidate runtime without source shadowing
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/scripts/verify_installed_runtime.py:/tmp/verify-installed-runtime.py:ro" \
            shakerscan-scanner:release-candidate \
            /tmp/verify-installed-runtime.py

      - name: Set up supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Audit, test, and build UI
        run: |
          npm --prefix ui ci
          npm --prefix ui audit --omit=dev --audit-level=high
          npm --prefix ui run test:unit
          npm --prefix ui run build

      - name: Upload exact-source Python contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-contracts-${{ needs.meta.outputs.candidate_sha }}
          path: artifacts/v2-full-python.xml
          if-no-files-found: error
          retention-days: 30

      - name: Audit locked Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check pip-audit==2.10.1
          python3 -m pip_audit --no-deps --disable-pip -r scanner/requirements.lock

  # Build each architecture on a NATIVE runner (no QEMU emulation — that is what
  # blew past the 6h job limit, and katana's CGO dep cannot cross-compile). Each
  # job pushes by digest; the manifest lists are assembled in the merge job.
  build-runtime:
    name: Build scanner/API ${{ matrix.platform }}
    needs: [meta, validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.meta.outputs.candidate_sha }}

      - name: Prepare platform pair
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push scanner by digest
        id: scanner
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: scanner/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SCANNER_VERSION=${{ needs.meta.outputs.version }}
            SCANNER_SOURCE_REVISION=${{ needs.meta.outputs.candidate_sha }}
          labels: |
            org.opencontainers.image.title=ShakerScan Scanner
            org.opencontainers.image.description=Open-source DAST scanner API, worker, and security tooling image
            org.opencontainers.image.created=${{ needs.meta.outputs.created }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ needs.meta.outputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-scanner
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=scanner-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=scanner-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.SCANNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push API control plane by digest
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: scanner/Dockerfile.api
          platforms: ${{ matrix.platform }}
          build-args: |
            SCANNER_RUNTIME_IMAGE=${{ env.SCANNER_IMAGE }}@${{ steps.scanner.outputs.digest }}
          labels: |
            org.opencontainers.image.title=ShakerScan API Control Plane
            org.opencontainers.image.description=ShakerScan API with checksum-pinned Docker client for Model Intake guest staging
            org.opencontainers.image.created=${{ needs.meta.outputs.created }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ needs.meta.outputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-api
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=api-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.API_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify baked scanner release identity
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
          SCANNER_DIGEST: ${{ steps.scanner.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
        run: |
          for image in "${SCANNER_IMAGE}@${SCANNER_DIGEST}" "${API_IMAGE}@${API_DIGEST}"; do
            docker pull "$image"
            baked_version="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$image" | awk -F= '$1 == "SCANNER_VERSION" {print $2}')"
            if [[ "$baked_version" != "$VERSION" ]]; then
              echo "$image baked SCANNER_VERSION=$baked_version; expected $VERSION" >&2
              exit 1
            fi
            docker run --rm \
              -e SCANNER_EXPECTED_VERSION="$VERSION" \
              -e SCANNER_EXPECTED_REVISION="$CANDIDATE_SHA" \
              --entrypoint python3 "$image" /app/release_identity.py --verify
            if docker run --rm \
              -e SCANNER_EXPECTED_VERSION="0.0.0-intentional-mismatch" \
              --entrypoint python3 "$image" /app/release_identity.py --verify; then
              echo "$image accepted an intentionally wrong deployment identity" >&2
              exit 1
            fi
          done

      - name: Export digests
        shell: bash
        run: |
          mkdir -p /tmp/digests/scanner /tmp/digests/api
          scanner_digest="${{ steps.scanner.outputs.digest }}"
          api_digest="${{ steps.api.outputs.digest }}"
          touch "/tmp/digests/scanner/${scanner_digest#sha256:}"
          touch "/tmp/digests/api/${api_digest#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 14

  # UI has no dependency on the scanner/API image chain. Keep it in a separate
  # retry domain so a transient package-registry failure cannot rebuild the
  # multi-gigabyte scanner runtime.
  build-ui:
    name: Build UI ${{ matrix.platform }}
    needs: [meta, validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.meta.outputs.candidate_sha }}

      - name: Prepare platform pair
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push UI by digest
        id: ui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ./ui
          file: ui/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.meta.outputs.version }}
            UI_SOURCE_REVISION=${{ needs.meta.outputs.candidate_sha }}
          labels: |
            org.opencontainers.image.title=ShakerScan UI
            org.opencontainers.image.description=Open-source ShakerScan web dashboard
            org.opencontainers.image.created=${{ needs.meta.outputs.created }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ needs.meta.outputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-ui
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ui-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ui-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.UI_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export UI digest
        shell: bash
        run: |
          mkdir -p /tmp/digests/ui
          digest="${{ steps.ui.outputs.digest }}"
          touch "/tmp/digests/ui/${digest#sha256:}"

      - name: Upload UI digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 14

  # The narrow signer image is independent of both the product UI and the
  # scanner/API dependency chain, so it gets its own retry boundary as well.
  build-signer:
    name: Build signer ${{ matrix.platform }}
    needs: [meta, validate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.meta.outputs.candidate_sha }}

      - name: Prepare platform pair
        shell: bash
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push signer by digest
        id: signer
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: api/model_intake_signer.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=ShakerScan Model Intake Signer
            org.opencontainers.image.description=Narrow Model Intake admission signer trust service
            org.opencontainers.image.created=${{ needs.meta.outputs.created }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.candidate_sha }}
            com.shakerscan.release.workflow-revision=${{ needs.meta.outputs.workflow_sha }}
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.url=https://hub.docker.com/r/shakerscan/shakerscan-model-intake-signer
            org.opencontainers.image.documentation=${{ env.SOURCE_URL }}#readme
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=ShakerScan
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=signer-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=signer-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.SIGNER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export signer digest
        shell: bash
        run: |
          mkdir -p /tmp/digests/signer
          digest="${{ steps.signer.outputs.digest }}"
          touch "/tmp/digests/signer/${digest#sha256:}"

      - name: Upload signer digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signer-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 14

  # Combine the per-arch digests into one multi-arch manifest list per image.
  merge:
    name: Create multi-arch manifests
    needs: [meta, build-runtime, build-ui, build-signer]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ needs.meta.outputs.version }}
      scanner_image: shakerscan/shakerscan-scanner:candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
      api_image: shakerscan/shakerscan-api:candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
      ui_image: shakerscan/shakerscan-ui:candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
      signer_image: shakerscan/shakerscan-model-intake-signer:candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
      scanner_digest: ${{ steps.receipt.outputs.scanner_digest }}
      api_digest: ${{ steps.receipt.outputs.api_digest }}
      ui_digest: ${{ steps.receipt.outputs.ui_digest }}
      signer_digest: ${{ steps.receipt.outputs.signer_digest }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.meta.outputs.candidate_sha }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: /tmp/digests
          pattern: "*-digests-*"
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create scanner manifest list
        working-directory: /tmp/digests/scanner
        env:
          CANDIDATE_TAG: candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${SCANNER_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${SCANNER_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${SCANNER_IMAGE}:${CANDIDATE_TAG}"

      - name: Create API control-plane manifest list
        working-directory: /tmp/digests/api
        env:
          CANDIDATE_TAG: candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${API_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${API_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${API_IMAGE}:${CANDIDATE_TAG}"

      - name: Create UI manifest list
        working-directory: /tmp/digests/ui
        env:
          CANDIDATE_TAG: candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${UI_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${UI_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${UI_IMAGE}:${CANDIDATE_TAG}"

      - name: Create Model Intake signer manifest list
        working-directory: /tmp/digests/signer
        env:
          CANDIDATE_TAG: candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
        shell: bash
        run: |
          docker buildx imagetools create -t "${SIGNER_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${SIGNER_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${SIGNER_IMAGE}:${CANDIDATE_TAG}"

      - name: Write immutable candidate receipt
        id: receipt
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
          CANDIDATE_TAG: candidate-${{ needs.meta.outputs.candidate_sha }}-${{ github.run_id }}
        run: |
          digest() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" && !found {print $2; found=1}'
          }
          scanner_digest="$(digest "${SCANNER_IMAGE}:${CANDIDATE_TAG}")"
          api_digest="$(digest "${API_IMAGE}:${CANDIDATE_TAG}")"
          ui_digest="$(digest "${UI_IMAGE}:${CANDIDATE_TAG}")"
          signer_digest="$(digest "${SIGNER_IMAGE}:${CANDIDATE_TAG}")"
          echo "scanner_digest=$scanner_digest" >> "$GITHUB_OUTPUT"
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "ui_digest=$ui_digest" >> "$GITHUB_OUTPUT"
          echo "signer_digest=$signer_digest" >> "$GITHUB_OUTPUT"
          # The host-side runtime is verified file by file against install/MANIFEST.sha256;
          # its digest is bound into the receipt so promotion can publish it in the image lock.
          python3 scripts/generate_install_manifest.py --check
          runtime_manifest="$(sha256sum install/MANIFEST.sha256 | awk '{print $1}')"
          jq -n \
            --arg version "$VERSION" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg scanner "$scanner_digest" \
            --arg api "$api_digest" \
            --arg ui "$ui_digest" \
            --arg signer "$signer_digest" \
            --arg runtime_manifest "$runtime_manifest" \
            '{schema_version:"shakerscan-release-candidate/v1",version:$version,candidate_sha:$candidate_sha,candidate_tag:$candidate_tag,workflow_run:$workflow_run,images:{scanner:$scanner,api:$api,ui:$ui,signer:$signer},runtime_manifest_sha256:$runtime_manifest}' \
            > release-candidate-receipt.json

      - name: Attest final scanner manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.SCANNER_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.scanner_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final API manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.API_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.api_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final UI manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.UI_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.ui_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final signer manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: docker.io/${{ env.SIGNER_IMAGE }}
          subject-digest: ${{ steps.receipt.outputs.signer_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify signed candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SCANNER_DIGEST: ${{ steps.receipt.outputs.scanner_digest }}
          API_DIGEST: ${{ steps.receipt.outputs.api_digest }}
          UI_DIGEST: ${{ steps.receipt.outputs.ui_digest }}
          SIGNER_DIGEST: ${{ steps.receipt.outputs.signer_digest }}
        shell: bash
        run: |
          gh attestation verify "oci://docker.io/${SCANNER_IMAGE}@${SCANNER_DIGEST}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://docker.io/${API_IMAGE}@${API_DIGEST}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://docker.io/${UI_IMAGE}@${UI_DIGEST}" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "oci://docker.io/${SIGNER_IMAGE}@${SIGNER_DIGEST}" --repo "$GITHUB_REPOSITORY"
          receipt_tmp="$(mktemp)"
          jq --arg repository "$GITHUB_REPOSITORY" \
            '.provenance={verified:true,issuer:"github-actions-sigstore",repository:$repository,subject:"final-multiarch-image-digests"}' \
            release-candidate-receipt.json > "$receipt_tmp"
          mv "$receipt_tmp" release-candidate-receipt.json

      - name: Upload uncertified manifest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-uncertified-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.candidate_sha }}
          path: release-candidate-receipt.json
          if-no-files-found: error
          retention-days: 30

  vulnerability-scan:
    name: Scan exact ${{ matrix.target.name }} ${{ matrix.platform.name }} runtime
    needs: [meta, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: amd64
            value: linux/amd64
          - name: arm64
            value: linux/arm64
        target:
          - name: scanner
            image: shakerscan/shakerscan-scanner
            digest: ${{ needs.merge.outputs.scanner_digest }}
            skip_dirs: /opt/model-intake-tools
            skip_files: /opt/tools/trivy,/opt/tools/osv-scanner
          - name: api
            image: shakerscan/shakerscan-api
            digest: ${{ needs.merge.outputs.api_digest }}
            skip_dirs: /opt/model-intake-tools
            skip_files: /opt/tools/trivy,/opt/tools/osv-scanner,/usr/local/bin/docker
          - name: ui
            image: shakerscan/shakerscan-ui
            digest: ${{ needs.merge.outputs.ui_digest }}
            skip_dirs: ""
            skip_files: ""
          - name: signer
            image: shakerscan/shakerscan-model-intake-signer
            digest: ${{ needs.merge.outputs.signer_digest }}
            skip_dirs: ""
            skip_files: ""
    steps:
      - name: Checkout waiver policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.meta.outputs.candidate_sha }}

      - name: Validate active vulnerability waivers
        run: |
          python3 scripts/validate_vulnerability_waivers.py \
            --file security/image-vulnerability-waivers.json \
            --image "${{ matrix.target.name }}" \
            --output .trivyignore

      - name: Reject high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          # A multi-architecture manifest must be checked on both supported
          # runtime platforms; otherwise the runner silently selects amd64.
          TRIVY_PLATFORM: ${{ matrix.platform.value }}
        with:
          image-ref: docker.io/${{ matrix.target.image }}@${{ matrix.target.digest }}
          format: json
          output: trivy-${{ matrix.target.name }}-${{ matrix.platform.name }}.json
          severity: HIGH,CRITICAL
          scanners: vuln
          # A release gate can require remediation only when an upstream fix
          # exists. Unfixed advisories remain in the uploaded report instead
          # of making every new distro advisory an impossible release block.
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore
          # Model Intake is an explicit 2.0 scope exclusion. Its isolated tool
          # environments and API-only Docker staging client do not qualify the
          # stable Scan/Hunt runtime and cannot hold that runtime's release.
          skip-dirs: ${{ matrix.target.skip_dirs }}
          skip-files: ${{ matrix.target.skip_files }}

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vulnerability-${{ matrix.target.name }}-${{ matrix.platform.name }}-${{ needs.meta.outputs.candidate_sha }}
          path: trivy-${{ matrix.target.name }}-${{ matrix.platform.name }}.json
          if-no-files-found: error
          retention-days: 30

  # Certification deliberately happens after the multi-architecture manifests
  # exist. These are the exact immutable digests the promotion workflow re-tags;
  # pre-manifest build images cannot stand in for them. It runs in parallel with
  # the vulnerability scans: promotion requires the whole run to succeed, so a
  # failed scan still blocks, and the slowest gate no longer waits for eight
  # image scans that do not feed it.
  certify:
    name: Certify final manifest digests
    needs: [meta, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.meta.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Download immutable manifest receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-candidate-uncertified-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.candidate_sha }}
          path: artifacts/uncertified

      - name: Download exact-source Python contract report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-contracts-${{ needs.meta.outputs.candidate_sha }}
          path: artifacts/certification

      - name: Download candidate-bound external acceptance receipts
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
          PARITY_RUN_ID: ${{ inputs.parity_run_id }}
          MODEL_INTAKE_PHYSICAL_RUN_ID: ${{ inputs.model_intake_physical_run_id }}
          DEVICE_PHYSICAL_RUN_ID: ${{ inputs.device_physical_run_id }}
        shell: bash
        run: |
          mkdir -p artifacts/certification/external
          if [[ -n "$PARITY_RUN_ID" ]]; then
            mkdir -p artifacts/certification/external/parity
            gh run download "$PARITY_RUN_ID" -n "v2-scan-parity-${CANDIDATE_SHA}" \
              -D artifacts/certification/external/parity
          fi
          if [[ -n "$MODEL_INTAKE_PHYSICAL_RUN_ID" ]]; then
            mkdir -p artifacts/certification/external/model-intake
            gh run download "$MODEL_INTAKE_PHYSICAL_RUN_ID" -n "model-intake-physical-${CANDIDATE_SHA}" \
              -D artifacts/certification/external/model-intake
          fi
          if [[ -n "$DEVICE_PHYSICAL_RUN_ID" ]]; then
            mkdir -p artifacts/certification/external/device
            gh run download "$DEVICE_PHYSICAL_RUN_ID" -n "device-physical-${CANDIDATE_SHA}" \
              -D artifacts/certification/external/device
          fi

      - name: Pull and identify exact final manifests
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
        shell: bash
        run: |
          receipt=artifacts/uncertified/release-candidate-receipt.json
          test "$(jq -r '.candidate_sha' "$receipt")" = "$CANDIDATE_SHA"
          for binding in \
            "scanner:${SCANNER_IMAGE}:shakerscan-scanner" \
            "api:${API_IMAGE}:shakerscan-api" \
            "ui:${UI_IMAGE}:shakerscan-ui" \
            "signer:${SIGNER_IMAGE}:shakerscan-model-intake-signer"; do
            IFS=: read -r key repository local_repository <<<"$binding"
            digest="$(jq -r ".images.${key}" "$receipt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker pull "${repository}@${digest}"
            docker tag "${repository}@${digest}" "${local_repository}:${VERSION}"
          done
          scanner_digest="$(jq -r '.images.scanner' "$receipt")"
          api_digest="$(jq -r '.images.api' "$receipt")"
          for image in "${SCANNER_IMAGE}@${scanner_digest}" "${API_IMAGE}@${api_digest}"; do
            docker run --rm \
              -e SCANNER_EXPECTED_VERSION="$VERSION" \
              -e SCANNER_EXPECTED_REVISION="$CANDIDATE_SHA" \
              --entrypoint python3 "$image" /app/release_identity.py --verify
          done

      - name: Verify exact final scanner runtime without source shadowing
        env:
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
        shell: bash
        run: |
          mkdir -p artifacts/certification
          scanner_digest="$(jq -r '.images.scanner' artifacts/uncertified/release-candidate-receipt.json)"
          docker run --rm --entrypoint python \
            -v "$PWD/scripts/verify_installed_runtime.py:/tmp/verify-installed-runtime.py:ro" \
            "${SCANNER_IMAGE}@${scanner_digest}" \
            /tmp/verify-installed-runtime.py

      - name: Prove previous-stable upgrade, restart, and rollback
        env:
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
        shell: bash
        run: |
          receipt=artifacts/uncertified/release-candidate-receipt.json
          scanner_digest="$(jq -r '.images.scanner' "$receipt")"
          api_digest="$(jq -r '.images.api' "$receipt")"
          ui_digest="$(jq -r '.images.ui' "$receipt")"
          SCANNER_IMAGE="${SCANNER_IMAGE}@${scanner_digest}" \
            CANDIDATE_API_IMAGE="${API_IMAGE}@${api_digest}" \
            CANDIDATE_UI_IMAGE="${UI_IMAGE}@${ui_digest}" \
            CANDIDATE_IMAGE_DIGEST="$scanner_digest" \
            CANDIDATE_API_IMAGE_DIGEST="$api_digest" \
            CANDIDATE_UI_IMAGE_DIGEST="$ui_digest" \
            UPGRADE_RECEIPT_PATH="$PWD/artifacts/certification/upgrade-receipt.json" \
            scripts/upgrade_smoke.sh

      - name: Set up supported Node browser runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run full user-visible E2E on exact final manifests
        env:
          INSTALLED_STACK_SMOKE_E2E: "1"
          INSTALLED_STACK_SMOKE_E2E_SCORECARD: ${{ github.workspace }}/artifacts/certification/e2e-scorecard.json
          INSTALLED_STACK_SMOKE_BROWSER_JSON: ${{ github.workspace }}/artifacts/certification/playwright.json
          INSTALLED_STACK_SMOKE_DAST_RECALL_JSON: ${{ github.workspace }}/artifacts/certification/dast-recall.json
          INSTALLED_STACK_SMOKE_FAULT_DIR: ${{ github.workspace }}/artifacts/certification/fault
          # Authorized acceptance of a measured DAST quality-bar shortfall: the
          # benchmark still runs with --enforce-quality and produces the measured
          # card, but the enforced non-zero exit no longer fails the smoke.
          SHAKERSCAN_RELEASE_WAIVE_DAST_QUALITY: ${{ inputs.waive_dast_quality && '1' || '' }}
          # Authorized acceptance of the named installed-stack E2E declared-debt
          # checks: those checks run as tracked XFAILs (loud, counted, recorded),
          # every other check stays a hard gate.
          SHAKERSCAN_RELEASE_DECLARED_DEBT: ${{ inputs.waive_e2e_debt && '1' || '' }}
        run: |
          npm --prefix ui ci
          npx --prefix ui playwright install --with-deps chromium
          make installed-stack-smoke

      - name: Build exact-digest preservation receipt
        env:
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
        shell: bash
        run: |
          receipt=artifacts/uncertified/release-candidate-receipt.json
          python3 scripts/release_preservation.py \
            --matrix tests/release_preservation_matrix.json \
            --junit artifacts/certification/v2-full-python.xml \
            --e2e-scorecard artifacts/certification/e2e-scorecard.json \
            --playwright-json artifacts/certification/playwright.json \
            --source-sha "$CANDIDATE_SHA" \
            --image "scanner=$(jq -r '.images.scanner' "$receipt")" \
            --image "api=$(jq -r '.images.api' "$receipt")" \
            --image "ui=$(jq -r '.images.ui' "$receipt")" \
            --image "signer=$(jq -r '.images.signer' "$receipt")" \
            --output artifacts/certification/preservation-receipt.json

      - name: Seal promotion-ready candidate receipt
        env:
          CANDIDATE_SHA: ${{ needs.meta.outputs.candidate_sha }}
          PARITY_RUN_ID: ${{ inputs.parity_run_id }}
          MODEL_INTAKE_PHYSICAL_RUN_ID: ${{ inputs.model_intake_physical_run_id }}
          DEVICE_PHYSICAL_RUN_ID: ${{ inputs.device_physical_run_id }}
          WAIVE_DAST_QUALITY: ${{ inputs.waive_dast_quality }}
          WAIVE_E2E_DEBT: ${{ inputs.waive_e2e_debt }}
        shell: bash
        run: |
          certification_args=(
            --candidate artifacts/uncertified/release-candidate-receipt.json \
            --upgrade artifacts/certification/upgrade-receipt.json \
            --preservation artifacts/certification/preservation-receipt.json \
            --e2e-scorecard artifacts/certification/e2e-scorecard.json \
            --dast-quality artifacts/certification/dast-recall.json \
            --fault-cancellation artifacts/certification/fault/scan-cancellation-race.json \
            --fault-reservation-identity artifacts/certification/fault/scan-reservation-identity.json \
            --fault-action-resume artifacts/certification/fault/scan-action-resume.json \
            --source-sha "$CANDIDATE_SHA" \
            --output release-candidate-receipt.json
          )
          if [[ -n "$PARITY_RUN_ID" ]]; then
            certification_args+=(--real-fleet-parity artifacts/certification/external/parity/v2-scan-parity.json)
          fi
          if [[ -n "$MODEL_INTAKE_PHYSICAL_RUN_ID" ]]; then
            certification_args+=(--model-intake-physical artifacts/certification/external/model-intake/model-intake-physical-acceptance.json)
          fi
          if [[ -n "$DEVICE_PHYSICAL_RUN_ID" ]]; then
            certification_args+=(--device-physical artifacts/certification/external/device/device-physical-acceptance.json)
          fi
          if [[ "$WAIVE_DAST_QUALITY" == "true" ]]; then
            certification_args+=(--waive-dast-quality-shortfall)
          fi
          if [[ "$WAIVE_E2E_DEBT" == "true" ]]; then
            certification_args+=(--waive-e2e-declared-debt)
          fi
          python3 scripts/certify_release_receipt.py "${certification_args[@]}"
          test "$(jq -r '.schema_version' release-candidate-receipt.json)" = shakerscan-release-candidate/v2
          test "$(jq -r '.certification.status' release-candidate-receipt.json)" = pass

      - name: Upload promotion-ready receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.candidate_sha }}
          path: release-candidate-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-digest certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-certification-${{ needs.meta.outputs.candidate_sha }}
          path: artifacts/certification
          if-no-files-found: error
          retention-days: 30
