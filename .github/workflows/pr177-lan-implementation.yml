name: PR 177 LAN implementation (temporary)

# One-shot implementation helper; removed from the PR after its guarded edit/test/push.
# It never runs on a fork or pull_request_target and never uses repository secrets.
on:
  push:
    branches: [feat/public-client-checks]
    paths: [.github/workflows/pr177-lan-implementation.yml]

permissions:
  contents: read

jobs:
  apply-and-test:
    if: github.repository == 'andriyze/shakerscan' && github.ref == 'refs/heads/feat/public-client-checks'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply the exact reviewed file edit
        run: |
          set -euo pipefail
          python .github/pr177_lan_patch.py
          bash -n scanner.sh
          git diff --check
          tar --exclude=.git --exclude=.env --exclude=dist -czf /tmp/shakerscan-lan-source.tar.gz .
      - name: Install test/build dependencies
        run: python -m pip install 'pytest==9.1.1' 'hatchling>=1.27' 'build==1.2.2.post1'
      - name: LAN, remote-access and client regressions
        env:
          PYTHONPATH: client/src
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider tests/test_scanner_lan_access.py tests/test_scanner_remote_access.py tests/test_shakerscan_client.py client/tests/test_public.py
          python -m build --outdir /tmp/lan-dist client
          python -m venv /tmp/lan-client
          /tmp/lan-client/bin/pip install --no-deps /tmp/lan-dist/*.whl
          /tmp/lan-client/bin/shakerscan mcp --help
          /tmp/lan-client/bin/shakerscan api --help
      - name: Commit validated implementation without rewriting branch history
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin feat/public-client-checks
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scanner.sh README.md docs/client.md
          git commit -m 'feat: add explicit trusted-LAN startup and laptop client guidance'
          git push origin HEAD:refs/heads/feat/public-client-checks
      - name: Preserve the tested source snapshot for local verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr177-lan-source
          path: /tmp/shakerscan-lan-source.tar.gz
          if-no-files-found: ignore
          retention-days: 1
