name: V2 migration contracts

on:
  push:
    branches:
      - v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Classify V2 changes without rebuilding unrelated products
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" == "null" ]]; then
            base_sha="$BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          # Fail closed. This classifier decides whether the substantive jobs run at
          # all, so any base it cannot diff against must mean "run everything", never
          # "nothing changed". A missing-object error here previously classified both
          # products as unchanged and skipped every real check, reporting green.
          if [[ -z "$base_sha" ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::warning::cannot resolve diff base '${base_sha:-<empty>}'; running all V2 jobs"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_files="$(git diff --name-only "$base_sha" HEAD)"; then
            echo "::warning::cannot diff ${base_sha}..HEAD; running all V2 jobs"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "ui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$changed_files" ]]; then
            echo "no files changed between ${base_sha} and HEAD"
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "ui=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          backend=false
          ui=false
          while IFS= read -r changed; do
            case "$changed" in
              api/public_api_contract.py|scripts/generate_public_api_contract.py|tests/test_public_api_contract_generation.py|docs/generated/public-openapi-manifest.json|ui/src/lib/publicApi.generated.ts)
                backend=true
                ui=true
                ;;
              ui/*|scripts/generate_scan_contract.py|scripts/generate_hunt_contract.py|tests/test_ui_*|tests/test_scan_contract_generation.py)
                ui=true
                ;;
              api/api.py|api/*/router.py|api/*/*_router.py|api/scan/contracts.py|config/v2_surface_disposition.yaml|scripts/check_surface_dispositions.py|tests/test_scan_openapi_contract.py|.github/workflows/v2-contracts.yml)
                backend=true
                ui=true
                ;;
              *)
                backend=true
                ;;
            esac
          done <<< "$changed_files"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  contracts:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # check_surface_dispositions.py verifies the manifest source_head is an
          # ancestor of HEAD; the default shallow clone omits it and the ancestry
          # check fails with "source_head is not an ancestor of the current checkout".
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 pytest-asyncio==1.4.0 aiohttp==3.14.3
          asyncpg==0.31.0 cryptography==50.0.0 fastapi==0.139.2
          httpx==0.28.1 pydantic==2.13.4 PyJWT==2.13.0
          PyYAML==6.0.3 redis==8.0.1 requests==2.34.2

      - name: Freeze monolith growth and lock the API contract
        run: |
          python scripts/check_module_size.py
          python scripts/check_documentation_policy.py
          PYTHONPATH=.:api:scanner python -m pytest -q -p no:cacheprovider \
            tests/test_api_characterization.py \
            tests/test_documentation_policy.py

      - name: Verify the public installer ships its whole import closure and a current manifest
        run: |
          python scripts/check_installed_import_closure.py
          python scripts/generate_install_manifest.py --check

      - name: Enforce V2 surface dispositions
        run: |
          python scripts/check_surface_dispositions.py

      - name: Reject canonical target-transport bypasses
        run: |
          python scripts/check_scan_target_transport.py
          python -m pytest -q -p no:cacheprovider \
            tests/test_scan_target_transport_gate.py

      - name: Reject public OpenAPI and generated-client drift
        run: |
          # Match the package-native complete-suite import order: package
          # modules first, followed by the flat API/scanner runtime layouts.
          PYTHONPATH=.:api:scanner python -m pytest -q -p no:cacheprovider \
            tests/test_public_api_contract_generation.py \
            tests/test_scan_openapi_contract.py \
            tests/test_scan_contract_generation.py

      - name: Validate package-native Scan contracts
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_scan_action_plan.py \
            tests/test_scan_action_compiler.py \
            tests/test_scan_budget_allocator.py \
            tests/test_scan_action_store.py \
            tests/test_scan_capability_result.py \
            tests/test_scan_orchestrator.py \
            tests/test_scan_fault_injection.py \
            tests/test_scan_detection_parity.py \
            tests/test_scan_security_invariants.py \
            tests/test_scan_secret_surface_canary.py \
            tests/test_scan_legacy_execution_removed.py \
            tests/test_scan_compatibility_sunset.py \
            tests/test_scan_operational_metrics.py \
            tests/test_worker_action_executor.py \
            tests/test_scan_authorization_revalidation.py \
            tests/test_scan_finalizer.py \
            tests/test_scan_work_manifests.py \
            tests/test_observation_manifests.py \
            tests/test_observation_store.py \
            tests/test_scan_placement_transport.py

      - name: Validate installed-runtime Scan contracts
        env:
          PYTHONPATH: api:scanner
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_scan_v2_contract.py \
            tests/test_scan_execution_plan.py \
            tests/test_scan_action_resume.py \
            tests/test_scan_dns_rebinding.py \
            tests/test_scan_job_contract.py \
            tests/test_scan_worker_contract.py \
            tests/test_scan_worker_dispatch.py \
            tests/test_api_scan_option_masking.py::test_canonical_options_builder_erases_legacy_identity_and_uses_plan_budget \
            tests/test_api_helpers.py::test_canonical_schedule_queues_scan_job_v2_without_legacy_identity

      - name: Validate executable Scan stages and capability dispatch
        env:
          PYTHONPATH: api:scanner
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_scan_executor.py \
            tests/test_scan_stage_scheduler.py \
            tests/test_scan_capability_execution.py \
            tests/test_external_process_budget.py \
            tests/test_deterministic_scan_execution_adapter.py \
            tests/test_broker_scan_execution.py \
            tests/test_broker_worker.py \
            tests/test_canonical_tls_runtime.py \
            tests/test_scan_subdomain_discovery.py \
            tests/test_parallel_scan.py \
            tests/test_capability_executor.py \
            tests/test_inline_capability_adapters.py \
            tests/test_replay_capability_adapter.py \
            tests/test_scanner_execution_adapter.py \
            tests/test_request_meter.py \
            tests/test_network_capabilities.py \
            tests/test_scanner_fixed_budget_adapter.py \
            tests/test_pinned_socks_proxy.py \
            tests/test_subprocess_receipts.py \
            tests/test_worker_scan_ai_gating.py::test_run_scan_rejects_monolithic_deterministic_execution \
            tests/test_worker_scan_ai_gating.py::test_canonical_shard_builder_emits_secret_free_v2_queue_authority

      - name: Validate fleet and broker Scan authority
        env:
          PYTHONPATH: api:scanner
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_broker_scan_execution.py \
            tests/test_broker_worker.py

      - name: Validate canonical frozen DNS resolution
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_sitecustomize_frozen_dns.py

      - name: Validate unified Hunt capability reservations
        env:
          PYTHONPATH: api:scanner
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_hunt_browser_capability.py \
            tests/test_hunt_scanner_reservations.py \
            tests/test_hunt_device_control_reservations.py \
            tests/test_hunt_device_http_reservations.py \
            tests/test_hunt_device_queue_reservations.py \
            tests/test_hunt_device_ssh_confirmation_reservations.py \
            tests/test_hunt_device_ssh_proposal_reservations.py

      - name: Validate canonical Hunt start contract
        run: |
          PYTHONPATH=. python -m pytest -q -p no:cacheprovider \
            tests/test_hunt_start_contract.py \
            tests/test_hunt_authority_integrity.py \
            tests/test_legacy_hunt_isolation.py
          PYTHONPATH=api:scanner python -m pytest -q -p no:cacheprovider \
            tests/test_api_helpers.py::test_primary_api_parses_typed_native_hunt_start \
            tests/test_api_helpers.py::test_primary_api_preserves_policy_profile_alias_when_budget_profile_is_omitted \
            tests/test_api_helpers.py::test_hunt_router_documents_the_native_request_and_response_models \
            tests/test_api_helpers.py::test_primary_api_rejects_legacy_hunt_start_without_migration_flag \
            tests/test_api_helpers.py::test_primary_api_rejects_legacy_hunt_start_even_with_old_override_env \
            tests/test_api_helpers.py::test_primary_api_rejects_oversized_hunt_body_before_json_parsing \
            tests/test_api_helpers.py::test_native_hunt_start_persists_exact_contract_and_capability_allowlist

      - name: Validate credential, archive, Hunt skill, and assurance regressions
        run: |
          PYTHONPATH=.:api:scanner python -m pytest -q -p no:cacheprovider \
            tests/test_http_archive.py \
            tests/test_hunt_authority_integrity.py \
            tests/test_hunt_direct_origin.py \
            tests/test_hunt_http_capability.py \
            tests/test_hunt_run_router.py \
            tests/test_hunt_skills.py \
            tests/test_runtime_credentials.py \
            tests/test_scan_credentials.py \
            tests/test_scan_finalizer.py \
            tests/test_scan_risk_and_assurance.py
          PYTHONPATH=api:scanner:. python -m pytest -q -p no:cacheprovider \
            tests/test_runtime_hardening.py

      - name: Validate durable budget, persistence, and receipt contracts
        env:
          PYTHONPATH: api
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_budget_reservation_lifecycle.py \
            tests/test_reservation_store.py \
            tests/test_retest_contract_migrations.py \
            tests/test_runtime_receipts.py \
            tests/test_v2_native_receipt_hardening.py

      - name: Validate exact request replay contracts
        env:
          PYTHONPATH: api:scanner
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_request_replay.py \
            tests/test_request_replay_executor.py \
            tests/test_v2_native_replay_primitives.py \
            tests/test_v2_replay_executor_durability.py \
            tests/test_v2_worker_replay.py

      - name: Validate discovery recovery and public redaction contracts
        env:
          PYTHONPATH: .:scanner
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_discovery_recovery_checkpoint.py \
            tests/test_v2_public_url_redaction.py

      - name: Validate V2 worker freshness manifest
        env:
          PYTHONPATH: scanner
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_v2_native_fingerprint.py

      - name: Validate release gates and CI coverage contract
        env:
          PYTHONPATH: api:scanner
        run: |
          mkdir -p artifacts
          python scripts/release_gates.py --pytest-arg=-p --pytest-arg=no:cacheprovider
          python -m pytest -q -p no:cacheprovider tests/test_v2_ci_contract.py \
            --junitxml=artifacts/v2-focused.xml

      - name: Compile V2 runtime modules
        run: |
          python -m compileall -q \
            api/runtime \
            api/scan \
            api/hunt \
            api/api.py \
            api/worker.py \
            api/broker_worker.py \
            api/agent_tools.py \
            api/hunt/capability_executor.py \
            api/capabilities \
            scanner/*.py \
            scanner/manifests.py \
            scanner/scanner.py \
            scanner/scanner_tools/build_fingerprint.py \
            scanner/scanner_tools/request_replay.py \
            scanner/scanner_tools/url_redaction.py \
            scanner/scanner_tools/v2_request_replay_hardening.py \
            scanner/scanner_tools/v2_fingerprint_hardening.py

      - name: Record focused contract results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v2-focused-contract-results
          path: artifacts/v2-focused.xml
          if-no-files-found: ignore

  ui-contract:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run generated contracts, UI unit tests, and production build
        run: |
          npm --prefix ui ci
          python3 scripts/generate_scan_contract.py --check
          python3 scripts/generate_hunt_contract.py --check
          npm --prefix ui run test:unit
          npm --prefix ui run build

  # Building the scanner toolchain and booting the complete Compose stack is a
  # candidate acceptance gate, not per-commit feedback. Pushes and PR updates
  # run focused contracts; the release-candidate workflow runs the exhaustive
  # Python qualification exactly once from the approved immutable source.
  images-api-ui:
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_PASSWORD: ci-postgres-credential-0000000000000001
      REDIS_PASSWORD: ci-redis-credential-000000000000000001
      MODEL_INTAKE_SIGNER_DATABASE_PASSWORD: ci-model-intake-signer-db-password-00000001
      MODEL_INTAKE_SIGNER_INTERNAL_TOKEN: ci-model-intake-signer-token-000000000000001
      MODEL_INTAKE_OPERATOR_TOKEN: ci-model-intake-operator-token-00000000000001
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # The upgrade receipt resolves the v0.8.17 baseline tag to its exact
          # source commit. A depth-1 checkout contains only the candidate.
          fetch-depth: 0

      - name: Set up supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build scanner, API, worker, and UI images in product dependency order
        run: ./scanner.sh build

      - name: Verify the scanner/API image overlay
        run: scripts/docker_api_overlay_smoke.sh shakerscan-worker:local shakerscan-api-v2-overlay-smoke

      - name: Start the canonical local stack
        run: |
          docker compose up -d
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:8080/health >/dev/null; then break; fi
            sleep 5
          done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/workers

      - name: Run API startup, schema, and real-tool smoke gates
        run: |
          docker compose exec -T api python -c 'import api; assert api.app'
          docker compose exec -T worker sh -ceu 'httpx -version; nuclei -version; katana -version; dalfox version'
          SCANNER_IMAGE=shakerscan-worker:local \
            CANDIDATE_API_IMAGE=shakerscan-api:latest \
            CANDIDATE_UI_IMAGE=shakerscan-ui:latest \
            scripts/upgrade_smoke.sh

      - name: Enforce external adapter wire ceilings
        run: |
          mkdir -p artifacts
          python tests/e2e/run_external_wire_acceptance.py --json \
            > artifacts/v2-external-wire-raw.json
          jq --arg source_sha "$GITHUB_SHA" \
            '. + {source_sha:$source_sha}' \
            artifacts/v2-external-wire-raw.json \
            > artifacts/v2-external-wire.json
          test "$(jq -r '.status' artifacts/v2-external-wire.json)" = passed
          test "$(jq -r '.tool_count' artifacts/v2-external-wire.json)" = 9

      - name: Upload external wire acceptance receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-wire-${{ github.sha }}
          path: artifacts/v2-external-wire.json
          if-no-files-found: error

      - name: Prove cancellation wins action admission in PostgreSQL
        run: |
          mkdir -p artifacts
          docker compose cp \
            tests/e2e/run_scan_cancellation_race.py \
            api:/tmp/run_scan_cancellation_race.py
          docker compose exec -T -w /app api \
            python /tmp/run_scan_cancellation_race.py --json \
            > artifacts/v2-scan-cancellation-race.json

      - name: Upload Scan cancellation race receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v2-scan-cancellation-race
          path: artifacts/v2-scan-cancellation-race.json
          if-no-files-found: error

      - name: Prove Scan action reservation identity in PostgreSQL
        run: |
          docker compose cp \
            tests/e2e/run_scan_reservation_identity.py \
            api:/tmp/run_scan_reservation_identity.py
          docker compose exec -T -w /app api \
            python /tmp/run_scan_reservation_identity.py --json \
            > artifacts/v2-scan-reservation-identity.json

      - name: Upload Scan reservation identity receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v2-scan-reservation-identity
          path: artifacts/v2-scan-reservation-identity.json
          if-no-files-found: error

      - name: Prove Scan action resume without repeated target traffic
        run: |
          docker compose cp \
            tests/e2e/run_scan_action_resume.py \
            api:/tmp/run_scan_action_resume.py
          docker compose exec -T -w /app api \
            python /tmp/run_scan_action_resume.py --json \
            > artifacts/v2-scan-action-resume.json
          test "$(jq -r '.passed' artifacts/v2-scan-action-resume.json)" = true
          test "$(jq -r '.repeated_target_requests' artifacts/v2-scan-action-resume.json)" = 0

      - name: Upload Scan action resume receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v2-scan-action-resume
          path: artifacts/v2-scan-action-resume.json
          if-no-files-found: error

      - name: Type-check and build the production UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run test:unit
          npm --prefix ui run build

      - name: Run production-stack browser acceptance
        env:
          PLAYWRIGHT_REAL_STACK: "1"
          SHAKERSCAN_API_URL: http://127.0.0.1:8080
        run: |
          npx --prefix ui playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npm --prefix ui run test:browser

      - name: Run deterministic Model Intake V2 gate
        run: |
          mkdir -p artifacts
          python tests/e2e/run_e2e.py \
            --area model_intake \
            --scorecard artifacts/v2-model-intake-scorecard.json

      - name: Upload Model Intake scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v2-model-intake-e2e
          path: artifacts/v2-model-intake-scorecard.json
          if-no-files-found: error

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail=300 api worker ui || true

      - name: Stop the stack
        if: always()
        run: docker compose down -v
