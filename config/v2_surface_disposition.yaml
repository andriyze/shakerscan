# V2 surface disposition manifest.
#
# Every public route on the API app must map to exactly one surface here before
# it may be deleted, moved, or extended. The disposition -- not the fact that a
# route currently exists -- decides whether it survives V2.
#
# Enforced by scripts/check_surface_dispositions.py.
#
# Dispositions:
#   DELETE_NOW            duplicate/dead execution; remove now
#   QUARANTINE_READ_ONLY  history must stay readable; no new writes
#   MERGE_THEN_DELETE     unique behaviour moves to the canonical owner first
#   KEEP_AND_SPLIT        intentional domain, poor module boundary
#   KEEP_CANONICAL        this is the V2 authority
#   ARCHIVE_DOC_ONLY      historical context only
schema_version: v2-surface-disposition/v1
source_head: 061a6d40106104d17a8983feec01236bc7cf1c05

