# ShakerScan - Open Source Edition
# Docker Compose configuration for full stack deployment

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
      POSTGRES_DB: scanner
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${SHAKERSCAN_DATA_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # Redis Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${SHAKERSCAN_DATA_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # API Server
  # ============================================================
  api:
    build:
      context: .
      dockerfile: scanner/Dockerfile
    # Resolve host-published services (e2e fixtures / honey targets) from inside the
    # container on Linux CI too. No-op on Docker Desktop, where it already resolves.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SHAKERSCAN_BIND_HOST:-127.0.0.1}:${SHAKERSCAN_API_PORT:-8080}:8080"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://scanner:scanner@postgres:5432/scanner
      - RESULTS_DIR=/results
      - LOCAL_ENV_FILE=/workspace/.env
      - SCANNER_VERSION=${SCANNER_VERSION:-dev}
      - GIT_COMMIT=${GIT_COMMIT:-dev}
      # Browser/API origin contract. These must be present inside the API
      # container; Compose host variables are not inherited unless listed.
      - SHAKERSCAN_UI_PORT=${SHAKERSCAN_UI_PORT:-3000}
      - SHAKERSCAN_BIND_HOST=${SHAKERSCAN_BIND_HOST:-127.0.0.1}
      - SHAKERSCAN_PUBLIC_HOST=${SHAKERSCAN_PUBLIC_HOST:-}
      - SHAKERSCAN_CORS_ALLOW_ORIGINS=${SHAKERSCAN_CORS_ALLOW_ORIGINS:-}
      - SHAKERSCAN_CORS_ALLOW_ORIGIN_REGEX=${SHAKERSCAN_CORS_ALLOW_ORIGIN_REGEX:-}
      # Owned-fleet bootstrap foundation. Fleet mode remains disabled until
      # the required values are explicitly configured.
      - FLEET_OVERLAY_CIDR=${FLEET_OVERLAY_CIDR:-}
      - FLEET_CONTROL_PLANE_OVERLAY_URL=${FLEET_CONTROL_PLANE_OVERLAY_URL:-}
      - FLEET_WIREGUARD_PUBLIC_KEY=${FLEET_WIREGUARD_PUBLIC_KEY:-}
      - FLEET_WIREGUARD_ENDPOINT=${FLEET_WIREGUARD_ENDPOINT:-}
      - FLEET_WORKER_IMAGE_DIGEST=${FLEET_WORKER_IMAGE_DIGEST:-}
      - FLEET_DESIRED_WORKER_COUNT=${FLEET_DESIRED_WORKER_COUNT:-1}
      - FLEET_HEARTBEAT_TIMEOUT_SECONDS=${FLEET_HEARTBEAT_TIMEOUT_SECONDS:-300}
      - FLEET_ALLOW_INSECURE_ENROLLMENT=${FLEET_ALLOW_INSECURE_ENROLLMENT:-false}
      - FLEET_OPERATOR_TOKEN=${FLEET_OPERATOR_TOKEN:-}
      - FLEET_CONNECTION_BUNDLE_JSON=${FLEET_CONNECTION_BUNDLE_JSON:-}
      - FLEET_CONNECTION_BUNDLE_PATH=${FLEET_CONNECTION_BUNDLE_PATH:-}
      - FLEET_CA_CERT_PATH=/run/shakerscan-fleet/control/ca.crt
      # Fleet cap. Empty => Docker RAM minus the supporting-stack reserve, at
      # roughly 1GB per worker. Set a number to force a fixed ceiling.
      - SHAKERSCAN_MAX_WORKERS=${SHAKERSCAN_MAX_WORKERS:-}
      - SHAKERSCAN_PLATFORM_MEMORY_RESERVE_GB=${SHAKERSCAN_PLATFORM_MEMORY_RESERVE_GB:-7}
      - SHAKERSCAN_PER_WORKER_MEM_GB=${SHAKERSCAN_PER_WORKER_MEM_GB:-1}
      # AI options (optional - set in .env file)
      - AI_URL=${AI_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_FALLBACK_MODEL=${AI_FALLBACK_MODEL:-}
      - AI_MASK_HOST=${AI_MASK_HOST:-example.com}
      - AI_SCAN_CLASSIFICATION_ENABLED=${AI_SCAN_CLASSIFICATION_ENABLED:-false}
      - AI_CLASSIFY_MIN_SEVERITY=${AI_CLASSIFY_MIN_SEVERITY:-}
      - AI_CLASSIFY_CHAIN_BUDGET_SECONDS=${AI_CLASSIFY_CHAIN_BUDGET_SECONDS:-120}
      - AI_CLASSIFY_CIRCUIT_WINDOW_SECONDS=${AI_CLASSIFY_CIRCUIT_WINDOW_SECONDS:-300}
      - AI_CLASSIFY_CIRCUIT_ERROR_THRESHOLD=${AI_CLASSIFY_CIRCUIT_ERROR_THRESHOLD:-5}
      - AI_CLASSIFY_CIRCUIT_COOLDOWN_SECONDS=${AI_CLASSIFY_CIRCUIT_COOLDOWN_SECONDS:-180}
      - AI_VERIFY_ENABLED=${AI_VERIFY_ENABLED:-false}
      - AI_VERIFY_MIN_SEVERITY=${AI_VERIFY_MIN_SEVERITY:-high}
      - AUTO_RETEST_ON_SCAN_COMPLETE=${AUTO_RETEST_ON_SCAN_COMPLETE:-true}
      - AUTO_RETEST_MIN_SEVERITY=${AUTO_RETEST_MIN_SEVERITY:-medium}
      - AUTO_RETEST_MAX_PER_SCAN=${AUTO_RETEST_MAX_PER_SCAN:-25}
      - AI_DEMO_MODE_ENABLED=${AI_DEMO_MODE_ENABLED:-false}
      - AI_DEMO_HONEY_PUBLIC_URL=${AI_DEMO_HONEY_PUBLIC_URL:-}
      - AI_DEMO_HONEY_SCANNER_URL=${AI_DEMO_HONEY_SCANNER_URL:-}
      - AI_OPS_ROUTER_EXECUTE_ENABLED=${AI_OPS_ROUTER_EXECUTE_ENABLED:-true}
      - RETEST_AI_BUDGET_SECONDS=${RETEST_AI_BUDGET_SECONDS:-240}
      - RETEST_AI_CIRCUIT_WINDOW_SECONDS=${RETEST_AI_CIRCUIT_WINDOW_SECONDS:-300}
      - RETEST_AI_CIRCUIT_ERROR_THRESHOLD=${RETEST_AI_CIRCUIT_ERROR_THRESHOLD:-5}
      - RETEST_AI_CIRCUIT_COOLDOWN_SECONDS=${RETEST_AI_CIRCUIT_COOLDOWN_SECONDS:-180}
      - RETEST_STALE_CHECK_INTERVAL_SECONDS=${RETEST_STALE_CHECK_INTERVAL_SECONDS:-30}
      - RETEST_RUNNING_STALE_SECONDS=${RETEST_RUNNING_STALE_SECONDS:-600}
      - RETEST_STALE_BATCH_SIZE=${RETEST_STALE_BATCH_SIZE:-25}
      - RETEST_STALE_REQUEUE_LIMIT=${RETEST_STALE_REQUEUE_LIMIT:-1}
    volumes:
      # Live source as DIRECTORY mounts (NOT single-file): directory mounts avoid
      # the macOS Docker single-file bind-mount inode-pinning that served stale/
      # truncated files (silent "no output, exit 0" scans). entrypoint.sh copies
      # the individual files from /app/_src/* over the baked /app copies.
      - ./scanner:/app/_src/scanner:ro
      - ./api:/app/_src/api:ro
      - ./results:/results
      - ./:/workspace
      - ./.shakerscan-fleet:/run/shakerscan-fleet:ro
      # Docker socket for worker scaling
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    command: ["python3", "/app/api.py"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Fleet-only CA-verified HTTPS listener on the WireGuard data address.
  # It shares the API code/database but disables all duplicate background controllers.
  fleet-edge:
    profiles: ["fleet"]
    network_mode: host
    build:
      context: .
      dockerfile: scanner/Dockerfile
    environment:
      - REDIS_URL=redis://${SHAKERSCAN_DATA_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}
      - DATABASE_URL=postgresql://scanner:scanner@${SHAKERSCAN_DATA_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}/scanner
      - RESULTS_DIR=/results
      - FLEET_EDGE_MODE=true
      - SHAKERSCAN_BIND_HOST=${SHAKERSCAN_DATA_BIND_HOST:-127.0.0.1}
      - FLEET_OVERLAY_CIDR=${FLEET_OVERLAY_CIDR:-}
      - FLEET_CONTROL_PLANE_OVERLAY_URL=${FLEET_CONTROL_PLANE_OVERLAY_URL:-}
      - FLEET_WIREGUARD_PUBLIC_KEY=${FLEET_WIREGUARD_PUBLIC_KEY:-}
      - FLEET_WIREGUARD_ENDPOINT=${FLEET_WIREGUARD_ENDPOINT:-}
      - FLEET_WORKER_IMAGE_DIGEST=${FLEET_WORKER_IMAGE_DIGEST:-}
      - FLEET_DESIRED_WORKER_COUNT=${FLEET_DESIRED_WORKER_COUNT:-1}
      - FLEET_HEARTBEAT_TIMEOUT_SECONDS=${FLEET_HEARTBEAT_TIMEOUT_SECONDS:-300}
      - FLEET_ALLOW_INSECURE_ENROLLMENT=false
      - FLEET_OPERATOR_TOKEN=${FLEET_OPERATOR_TOKEN:-}
      - FLEET_CONNECTION_BUNDLE_JSON=${FLEET_CONNECTION_BUNDLE_JSON:-}
      - FLEET_CONNECTION_BUNDLE_PATH=${FLEET_CONNECTION_BUNDLE_PATH:-}
      - FLEET_CA_CERT_PATH=/run/shakerscan-fleet/control/ca.crt
    volumes:
      - ./scanner:/app/_src/scanner:ro
      - ./api:/app/_src/api:ro
      - ./results:/results
      - ./.shakerscan-fleet:/run/shakerscan-fleet:ro
    command:
      - uvicorn
      - api:app
      - --host
      - ${SHAKERSCAN_DATA_BIND_HOST:-127.0.0.1}
      - --port
      - ${FLEET_TLS_PORT:-8443}
      - --ssl-keyfile
      - /run/shakerscan-fleet/control/server.key
      - --ssl-certfile
      - /run/shakerscan-fleet/control/server.crt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Scanner Workers (scale with --scale worker=N)
  # ============================================================
  worker:
    init: true  # Use tini as PID 1 to reap zombie processes
    # Resolve host-published services (e2e fixtures / honey targets) from inside the
    # container on Linux CI too. No-op on Docker Desktop, where it already resolves.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: scanner/Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://scanner:scanner@postgres:5432/scanner
      - RESULTS_DIR=/results
      - SCANNER_VERSION=${SCANNER_VERSION:-dev}
      - GIT_COMMIT=${GIT_COMMIT:-dev}
      # AI options (optional - set in .env file)
      - AI_URL=${AI_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_FALLBACK_MODEL=${AI_FALLBACK_MODEL:-}
      - AI_MASK_HOST=${AI_MASK_HOST:-example.com}
      - AI_SCAN_CLASSIFICATION_ENABLED=${AI_SCAN_CLASSIFICATION_ENABLED:-false}
      - AI_CLASSIFY_MIN_SEVERITY=${AI_CLASSIFY_MIN_SEVERITY:-}
      - AI_CLASSIFY_CHAIN_BUDGET_SECONDS=${AI_CLASSIFY_CHAIN_BUDGET_SECONDS:-120}
      - AI_CLASSIFY_CIRCUIT_WINDOW_SECONDS=${AI_CLASSIFY_CIRCUIT_WINDOW_SECONDS:-300}
      - AI_CLASSIFY_CIRCUIT_ERROR_THRESHOLD=${AI_CLASSIFY_CIRCUIT_ERROR_THRESHOLD:-5}
      - AI_CLASSIFY_CIRCUIT_COOLDOWN_SECONDS=${AI_CLASSIFY_CIRCUIT_COOLDOWN_SECONDS:-180}
      - AI_VERIFY_ENABLED=${AI_VERIFY_ENABLED:-false}
      - AI_VERIFY_MIN_SEVERITY=${AI_VERIFY_MIN_SEVERITY:-high}
      - AUTO_RETEST_ON_SCAN_COMPLETE=${AUTO_RETEST_ON_SCAN_COMPLETE:-true}
      - AUTO_RETEST_MIN_SEVERITY=${AUTO_RETEST_MIN_SEVERITY:-medium}
      - AUTO_RETEST_MAX_PER_SCAN=${AUTO_RETEST_MAX_PER_SCAN:-25}
      - AI_DEMO_MODE_ENABLED=${AI_DEMO_MODE_ENABLED:-false}
      - AI_DEMO_HONEY_PUBLIC_URL=${AI_DEMO_HONEY_PUBLIC_URL:-}
      - AI_DEMO_HONEY_SCANNER_URL=${AI_DEMO_HONEY_SCANNER_URL:-}
      - RETEST_AI_BUDGET_SECONDS=${RETEST_AI_BUDGET_SECONDS:-240}
      - RETEST_AI_CIRCUIT_WINDOW_SECONDS=${RETEST_AI_CIRCUIT_WINDOW_SECONDS:-300}
      - RETEST_AI_CIRCUIT_ERROR_THRESHOLD=${RETEST_AI_CIRCUIT_ERROR_THRESHOLD:-5}
      - RETEST_AI_CIRCUIT_COOLDOWN_SECONDS=${RETEST_AI_CIRCUIT_COOLDOWN_SECONDS:-180}
      - RETEST_STALE_CHECK_INTERVAL_SECONDS=${RETEST_STALE_CHECK_INTERVAL_SECONDS:-30}
      - RETEST_RUNNING_STALE_SECONDS=${RETEST_RUNNING_STALE_SECONDS:-600}
      - RETEST_STALE_BATCH_SIZE=${RETEST_STALE_BATCH_SIZE:-25}
      - RETEST_STALE_REQUEUE_LIMIT=${RETEST_STALE_REQUEUE_LIMIT:-1}
    volumes:
      # Live source as DIRECTORY mounts (NOT single-file) — directory mounts avoid
      # the macOS Docker single-file bind-mount inode-pinning that served stale/
      # truncated scanner.py (silent "no output, exit 0" scans). entrypoint.sh
      # copies the individual files from /app/_src/* over the baked /app copies.
      - ./scanner:/app/_src/scanner:ro
      - ./api:/app/_src/api:ro
      - ./results:/results
    command: ["python3", "/app/worker.py"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Gungnir CT Monitor (start with --profile gungnir)
  # ============================================================
  gungnir-worker:
    build:
      context: .
      dockerfile: scanner/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://scanner:scanner@postgres:5432/scanner
    volumes:
      # Directory mount (see api/worker note); entrypoint.sh copies the files.
      - ./api:/app/_src/api:ro
    command: ["python3", "/app/gungnir_worker.py"]
    profiles:
      - gungnir
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================
  # Web UI
  # ============================================================
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_VERSION=${SCANNER_VERSION:-dev}
    ports:
      - "${SHAKERSCAN_BIND_HOST:-127.0.0.1}:${SHAKERSCAN_UI_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${SHAKERSCAN_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_APP_VERSION=${SCANNER_VERSION:-dev}
      - SHAKERSCAN_README_PATH=/docs/README.md
    volumes:
      - ./README.md:/docs/README.md:ro
    depends_on:
      - api
    restart: unless-stopped

  # ============================================================
  # E2E DAST target (start only with --profile e2e)
  # ============================================================
  juice-shop:
    # Multi-platform digest resolved 2026-07-21. Pinning prevents an upstream
    # latest-image change from silently changing release-gate ground truth.
    image: bkimminich/juice-shop@sha256:e68144772ebaaca0ec117b38d44903af92416793230288ef7c5437fc4f26850a
    profiles:
      - e2e
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres-data:
  redis-data:
