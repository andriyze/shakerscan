# Benchmark scorecard fixture — Honey (broad detector-coverage DAST target).
# Consumed by scripts/benchmark_targets.py. Honey exercises generic detectors
# (data exposure, webhook bypass, approval bypass, path traversal, SQLi). The key
# gate here is precision: broad categories without promoting weak evidence to High.
#
# `proof: deterministic` means proven by a deterministic proof contract -- the finding's server
# `verified` flag, the same requirement as `proof: verified` -- and only proven matches count toward
# expected_recall or a found category. A match by class, route and severity without that proof is
# reported as expected_detected_unproven, a diagnostic never counted as found.
#
# min_categories_found counts the answer key's families (sensitive_exposure, webhook, approval,
# path_traversal) with at least one expectation found with its required proof.
# require_no_unproven_critical fails the run if ANY critical-severity finding in the report is not
# verified, whether or not it matches an expectation.
name: honey
target_url: https://honey.shakerscan.com
scan_options:
  parallel: true
  shard_strategy: coverage
  budget_profile: thorough

gates:
  min_expected_recall: 0.67    # 3 of the 4 expected classes
  min_categories_found: 3            # broad category coverage
  max_unverified_high_ratio: 0.25    # do NOT inflate suspected -> Critical
  require_no_unproven_critical: true # Critical needs deterministic proof

expected:
  - id: data-exposure
    family: sensitive_exposure
    route: /api
    min_severity: high
    proof: deterministic
  - id: webhook-bypass
    family: webhook
    route: /webhook
    min_severity: high
    proof: deterministic
  - id: approval-bypass
    family: approval
    route: /approve
    min_severity: high
    proof: deterministic
  - id: path-traversal
    family: path_traversal
    route: /file
    min_severity: high
    proof: deterministic

hard_tail:
  - ai-model-findings    # AI/model surfaces are scored separately
