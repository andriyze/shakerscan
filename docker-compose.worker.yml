# ShakerScan owned-fleet worker-only runtime.
# This file intentionally defines no API, UI, Redis, or Postgres services.
name: ${FLEET_COMPOSE_PROJECT_NAME:-shakerscan-fleet-worker}

services:
  worker:
    init: true
    image: ${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE must be a digest-pinned scanner image}
    env_file:
      - path: ${FLEET_WORKER_ENV_FILE:-./.shakerscan-fleet/worker.env}
        format: raw
    environment:
      - PYTHONUNBUFFERED=1
      - FLEET_WORKER_IMAGE_DIGEST=${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE must be a digest-pinned scanner image}
      - SHAKERSCAN_NODE_ID=${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      - WORKER_ID=${FLEET_NODE_ID:?FLEET_NODE_ID is required}-worker
    volumes:
      - ${FLEET_RESULTS_DIR:-./results}:/results
    command: ["python3", "/app/fleet_worker_entrypoint.py"]
    labels:
      com.shakerscan.node_id: ${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      com.shakerscan.fleet_managed: "true"
    deploy:
      resources:
        limits:
          cpus: ${FLEET_WORKER_CPU_LIMIT:-2}
          memory: ${FLEET_WORKER_MEMORY_LIMIT:-4G}
    restart: unless-stopped

  node-agent:
    image: ${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE must be a digest-pinned scanner image}
    environment:
      - PYTHONUNBUFFERED=1
      - FLEET_STATE_PATH=/run/shakerscan-fleet/state.json
      - FLEET_AGENT_INTERVAL_SECONDS=${FLEET_AGENT_INTERVAL_SECONDS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FLEET_RUNTIME_DIR:-./.shakerscan-fleet}:/run/shakerscan-fleet:ro
      - ${FLEET_RESULTS_DIR:-./results}:/results:ro
    command: ["python3", "/app/fleet_agent.py"]
    labels:
      com.shakerscan.node_id: ${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      com.shakerscan.fleet_managed: "true"
    depends_on:
      - worker
    restart: unless-stopped
