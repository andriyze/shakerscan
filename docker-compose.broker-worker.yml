# Outbound-only HTTPS broker worker runtime. No Redis/PostgreSQL credentials
# or data-plane ports are present on this node.
name: ${FLEET_COMPOSE_PROJECT_NAME:-shakerscan-broker-worker}

services:
  worker:
    init: true
    image: ${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE is required}
    environment:
      - PYTHONUNBUFFERED=1
      - FLEET_WORKER_IMAGE_DIGEST=${FLEET_EXPECTED_WORKER_IMAGE_DIGEST:?FLEET_EXPECTED_WORKER_IMAGE_DIGEST is required}
      - SHAKERSCAN_NODE_ID=${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      # Destination policy: the same values as the control plane (scope checks run here too).
      - SHAKERSCAN_PRIVATE_NETWORK_TARGETS=${SHAKERSCAN_PRIVATE_NETWORK_TARGETS:-}
      - SHAKERSCAN_NAT64_PREFIXES=${SHAKERSCAN_NAT64_PREFIXES:-}
      - WORKER_ID=${FLEET_NODE_ID:?FLEET_NODE_ID is required}-broker
      - FLEET_BROKER_STATE_PATH=/run/shakerscan-fleet/state.json
      - SHAKERSCAN_BROKER_LEASE=1
      - ARTIFACT_STORAGE_REQUIRED=false
      - RESULTS_DIR=/results
      - SHAKERSCAN_DNS_DOH_RESOLVERS=${SHAKERSCAN_DNS_DOH_RESOLVERS-https://cloudflare-dns.com/dns-query,https://dns.google/dns-query}
      # Optional subfinder provider keys (docs/functionality-reference.md, section 10); never logged.
      - SHAKERSCAN_SUBFINDER_PROVIDERS=${SHAKERSCAN_SUBFINDER_PROVIDERS:-}
      - SHAKERSCAN_SUBFINDER_PROVIDER_CONFIG=${SHAKERSCAN_SUBFINDER_PROVIDER_CONFIG:-}
    volumes:
      - ${FLEET_RUNTIME_DIR:-./.shakerscan-fleet}:/run/shakerscan-fleet:ro
      - ${FLEET_RESULTS_DIR:-./results}:/results
    command: ["python3", "/app/broker_worker.py"]
    labels:
      com.shakerscan.node_id: ${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      com.shakerscan.fleet_managed: "true"
    deploy:
      resources:
        limits:
          cpus: ${FLEET_WORKER_CPU_LIMIT:-2}
          memory: ${FLEET_WORKER_MEMORY_LIMIT:-4G}
    restart: unless-stopped

  # No Model Intake service on fleet nodes: Model Intake jobs are consumed only by the
  # control-plane model-intake-worker (worker_queue_policy.py), and the toolchain lives in the
  # dedicated shakerscan-model-intake image, not in the fleet worker image.
  node-agent:
    image: ${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE is required}
    environment:
      - PYTHONUNBUFFERED=1
      - FLEET_STATE_PATH=/run/shakerscan-fleet/state.json
      - FLEET_AGENT_INTERVAL_SECONDS=${FLEET_AGENT_INTERVAL_SECONDS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FLEET_RUNTIME_DIR:-./.shakerscan-fleet}:/run/shakerscan-fleet:ro
      - ${FLEET_RESULTS_DIR:-./results}:/results:ro
    command: ["python3", "/app/fleet_agent.py"]
    labels:
      com.shakerscan.node_id: ${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      com.shakerscan.fleet_managed: "true"
    depends_on:
      - worker
    restart: unless-stopped
