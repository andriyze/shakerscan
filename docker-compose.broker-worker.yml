# Outbound-only HTTPS broker worker runtime. No Redis/PostgreSQL credentials
# or data-plane ports are present on this node.
name: ${FLEET_COMPOSE_PROJECT_NAME:-shakerscan-broker-worker}

services:
  worker:
    init: true
    image: ${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE is required}
    environment:
      - PYTHONUNBUFFERED=1
      - FLEET_WORKER_IMAGE_DIGEST=${FLEET_EXPECTED_WORKER_IMAGE_DIGEST:?FLEET_EXPECTED_WORKER_IMAGE_DIGEST is required}
      - SHAKERSCAN_NODE_ID=${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      - WORKER_ID=${FLEET_NODE_ID:?FLEET_NODE_ID is required}-broker
      - FLEET_BROKER_STATE_PATH=/run/shakerscan-fleet/state.json
      - SHAKERSCAN_BROKER_LEASE=1
      - ARTIFACT_STORAGE_REQUIRED=false
      - RESULTS_DIR=/results
    volumes:
      - ${FLEET_RUNTIME_DIR:-./.shakerscan-fleet}:/run/shakerscan-fleet:ro
      - ${FLEET_RESULTS_DIR:-./results}:/results
    command: ["python3", "/app/broker_worker_v2.py"]
    labels:
      com.shakerscan.node_id: ${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      com.shakerscan.fleet_managed: "true"
    deploy:
      resources:
        limits:
          cpus: ${FLEET_WORKER_CPU_LIMIT:-2}
          memory: ${FLEET_WORKER_MEMORY_LIMIT:-4G}
    restart: unless-stopped

  model-intake-sandbox:
    init: true
    image: ${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE is required}
    user: "${MODEL_INTAKE_SANDBOX_UID:-10001}:${MODEL_INTAKE_SANDBOX_GID:-10001}"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_INTAKE_SANDBOX_NETWORK_MODE=none
      - MODEL_INTAKE_SANDBOX_READ_ONLY=1
      - MODEL_INTAKE_SANDBOX_NO_NEW_PRIVILEGES=1
      - MODEL_INTAKE_SANDBOX_RUNTIME_ADAPTERS_JSON=${MODEL_INTAKE_SANDBOX_RUNTIME_ADAPTERS_JSON:-}
      - MODEL_INTAKE_SANDBOX_RUNTIME_TIMEOUT_SECONDS=${MODEL_INTAKE_SANDBOX_RUNTIME_TIMEOUT_SECONDS:-90}
      - HOME=/tmp
    volumes:
      - ${FLEET_RESULTS_DIR:-./results}/model-intake-quarantine:/results/model-intake-quarantine:ro
      - ${FLEET_RESULTS_DIR:-./results}/model-intake-sandbox:/results/model-intake-sandbox
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    command: ["python3", "/app/scanner_tools/model_intake_sandbox.py", "--serve"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
          pids: 64
    restart: unless-stopped

  node-agent:
    image: ${FLEET_WORKER_IMAGE:?FLEET_WORKER_IMAGE is required}
    environment:
      - PYTHONUNBUFFERED=1
      - FLEET_STATE_PATH=/run/shakerscan-fleet/state.json
      - FLEET_AGENT_INTERVAL_SECONDS=${FLEET_AGENT_INTERVAL_SECONDS:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FLEET_RUNTIME_DIR:-./.shakerscan-fleet}:/run/shakerscan-fleet:ro
      - ${FLEET_RESULTS_DIR:-./results}:/results:ro
    command: ["python3", "/app/fleet_agent.py"]
    labels:
      com.shakerscan.node_id: ${FLEET_NODE_ID:?FLEET_NODE_ID is required}
      com.shakerscan.fleet_managed: "true"
    depends_on:
      - worker
    restart: unless-stopped
